    if(C.phase==='place'){ctPlaceEdge(C,e);return ctGo()}
    const T=C.T;if(!T)return;const i=T.p,p=C.players[i];if(!ctRoadOK(C,i,e))return;
    if(T.stage==='rb'){ctSnap(C);C.edges[e]=i;T.rb--;ctLog(C,'🛣️ '+ctPN(C,i)+' วางถนนฟรี');if(T.rb<=0||ctPieces(C,i).r>=15||!CTG.E.some((x,k)=>ctRoadOK(C,i,k))){T.stage=null;T.rb=0}ctUpdLR(C);return ctGo()}
    if(T.mode!=='road')return;if(!ctCan(p,CT_COST.road)){toast('การ์ดในเครื่องไม่พอ ขาด '+ctMiss(p,CT_COST.road)+' · ถ้าในมือจริงมี กด ✎ แก้การ์ดก่อน');return}
    ctSnap(C);ctPay(C,p,CT_COST.road);C.edges[e]=i;T.built=true;T.mode=null;ctLog(C,'▬ '+ctPN(C,i)+' สร้างถนน');ctUpdLR(C);ctGo()},
  ctRob(t){const C=ct();const h=ctNum(t);if(C.view.fix){ctSnap(C);C.robber=h;return ctGo()}const T=C.T;if(!T||T.stage!=='robber'||h===C.robber)return;ctSnap(C);C.robber=h;
    ctLog(C,'🦹 '+ctPN(C,T.p)+' ย้ายโจรไปช่อง '+(C.hex[h].t?CT_T[C.hex[h].t].n:'')+(C.hex[h].n?' '+C.hex[h].n:''));ctAfterRobber(C);ctGo()},
  ctVic(t){ct().T.vic=ctNum(t);ctGo()},
  ctVicBack(){ct().T.vic=null;ctGo()},
  ctStealRand(){const C=ct();ctSnap(C);ctStealFrom(C,C.T.vic,null);ctGo()},
  ctStealR(t){const C=ct();ctSnap(C);ctStealFrom(C,C.T.vic,t.dataset.id);ctGo()},
  ctRollN(t){const C=ct();ctRoll(C,ctNum(t));ctGo()},
  ctDice(){const C=ct();const T=C.T;if(!T||T.rolled||T.stage||ctAfter.rolling)return;ctAfter.rolling=true;const b=document.getElementById('ctDiceBtn');let k=0;
    const iv=setInterval(()=>{if(b)b.textContent=CT_DICE[Math.floor(Math.random()*6)]+CT_DICE[Math.floor(Math.random()*6)];if(++k>=8){clearInterval(iv);ctAfter.rolling=false;const a=1+Math.floor(Math.random()*6),c=1+Math.floor(Math.random()*6);ctRoll(C,a+c,[a,c]);toast('🎲 ทอยได้ '+(a+c));ctGo()}},70)},
  ctDisc(t){const C=ct();const [i,r,d]=t.dataset.id.split(':');const T=C.T;const s=T.dsel[i]||(T.dsel[i]={});const p=C.players[+i];const got=CT_RES.reduce((a,x)=>a+(s[x]||0),0);
    const v=(s[r]||0)+(+d);if(v<0||v>(p.res[r]||0)||(+d>0&&got>=T.disc[i]))return;s[r]=v;ctGo()},
  ctDiscRand(t){const C=ct();const i=ctNum(t);const T=C.T;const p=C.players[i];const bag=[];CT_RES.forEach(r=>{for(let k=0;k<(p.res[r]||0);k++)bag.push(r)});const pick=shuffle(bag).slice(0,T.disc[i]);const s={};pick.forEach(r=>s[r]=(s[r]||0)+1);T.dsel[i]=s;ctGo()},
  ctDiscOK(t){const C=ct();const i=ctNum(t);const T=C.T;const s=T.dsel[i]||{};const got=CT_RES.reduce((a,r)=>a+(s[r]||0),0);if(got!==T.disc[i])return;ctSnap(C);
    CT_RES.forEach(r=>{if(s[r]){C.players[i].res[r]-=s[r];C.bank[r]+=s[r]}});ctLog(C,ctPN(C,i)+' ทิ้งการ์ด '+got+' ใบ');delete T.disc[i];delete T.dsel[i];if(!Object.keys(T.disc).length)T.stage='robber';ctGo()},
  ctMode(t){const C=ct();const T=C.T;const k=t.dataset.id;if(!k){T.mode=null;return ctGo()}const i=T.p,p=C.players[i];
    if(!ctCan(p,CT_COST[k])){toast('การ์ดในเครื่องไม่พอ ขาด '+ctMiss(p,CT_COST[k])+' · ถ้าในมือจริงมี กด ✎ แก้การ์ดก่อน');return}
    const L=ctLegal(Object.assign({},C,{T:Object.assign({},T,{mode:k})}));if(!(L.nodes.length||L.edges.length)){toast(k==='road'?'ไม่มีทางที่ต่อถนนได้':k==='set'?'ไม่มีจุดที่สร้างบ้านได้ (ต้องมีถนนมาถึงและห่างบ้านอื่น 2 จุด)':'ไม่มีบ้านให้อัป');return}
    T.mode=k;T.panel=null;ctGo()},
  ctPanel(t){const C=ct();const T=C.T;const k=t.dataset.id;T.mode=null;T.panel=T.panel===k?null:k||null;if(k==='trade')T.tr={w:null,g:{},t:{}};if(k==='bank')T.bk={};ctGo()},
  ctTrW(t){const T=ct().T;T.tr.w=ctNum(t);ctGo()},
  ctTrQ(t){const T=ct().T;const [k,r,d]=t.dataset.id.split(':');const o=T.tr[k];o[r]=Math.max(0,(o[r]||0)+(+d));ctGo()},
  ctTrOK(){const C=ct();const T=C.T;const tr=T.tr;const a=C.players[T.p],b=C.players[tr.w];ctSnap(C);
    CT_RES.forEach(r=>{const g=tr.g[r]||0,x=tr.t[r]||0;a.res[r]+=x-g;b.res[r]+=g-x});ctLog(C,'🤝 '+ctPN(C,T.p)+' ให้ '+ctResTxt(tr.g)+' แลก '+ctResTxt(tr.t)+' กับ '+ctPN(C,tr.w));toast('แลกแล้ว');T.tr={w:null,g:{},t:{}};ctGo()},
  ctBkG(t){const T=ct().T;T.bk={g:t.dataset.id};ctGo()},
  ctBkT(t){const T=ct().T;T.bk.t=t.dataset.id;ctGo()},
  ctBkOK(){const C=ct();const T=C.T;const p=C.players[T.p];const {g,t:r}=T.bk;const k=ctRatio(C,T.p,g);if((p.res[g]||0)<k||!C.bank[r])return;ctSnap(C);p.res[g]-=k;C.bank[g]+=k;ctTake(C,p,r,1);
    ctLog(C,'⚓ '+ctPN(C,T.p)+' แลกธนาคาร '+CT_RE[g].repeat(k)+' → '+CT_RE[r]);toast('แลกแล้ว '+k+':1');T.bk={g};ctGo()},
  ctBuyDev(){const C=ct();const T=C.T;const p=C.players[T.p];if(!ctCan(p,CT_COST.dev)){toast('การ์ดในเครื่องไม่พอ ขาด '+ctMiss(p,CT_COST.dev)+' · ถ้าในมือจริงมี กด ✎ แก้การ์ดก่อน');return}T.mode=null;T.panel='buy';ctGo()},
  ctBuyK(t){const C=ct();const T=C.T;const p=C.players[T.p];let k=t.dataset.id;if(!ctCan(p,CT_COST.dev))return;
    if(k==='rand'){const bag=[];CT_DEVK.forEach(x=>{for(let j=0;j<C.deck[x];j++)bag.push(x)});if(!bag.length)return;k=bag[Math.floor(Math.random()*bag.length)]}
    if(!C.deck[k])return;ctSnap(C);ctPay(C,p,CT_COST.dev);C.deck[k]--;p.nd[k]++;T.built=true;T.panel=null;ctLog(C,'📜 '+ctPN(C,T.p)+' ซื้อการ์ดพัฒนา 1 ใบ');
    toast(t.dataset.id==='rand'?'ได้การ์ด '+CT_DEV[k].i+' '+CT_DEV[k].n+(k==='v'?' (เก็บไว้ ไม่ต้องเล่น)':' (เล่นได้ตาหน้า)'):'ซื้อแล้ว');ctGo()},
  ctPlay(t){const C=ct();const T=C.T;const i=T.p,p=C.players[i];const k=t.dataset.id;if(!ctDevPlayable(C,i).includes(k))return;
    if(k==='yp'){T.panel='yp';T.yp={};return ctGo()}if(k==='mo'){T.panel='mo';T.mo=null;return ctGo()}
    ctSnap(C);p.dev[k]--;T.dev=true;T.panel=null;
    if(k==='k'){p.kn++;T.knPre=!T.rolled;T.stage='robber';ctLog(C,'⚔️ '+ctPN(C,i)+' เล่นอัศวิน');ctUpdLA(C,i)}
    if(k==='rb'){const left=15-ctPieces(C,i).r;T.rb=Math.min(2,left);T.stage=T.rb>0?'rb':null;ctLog(C,'🛣️ '+ctPN(C,i)+' เล่นการ์ดสร้างถนน')}
    ctGo()},
  ctYP(t){const C=ct();const T=C.T;const [,r,d]=t.dataset.id.split(':');const n=CT_RES.reduce((a,x)=>a+(T.yp[x]||0),0);const v=(T.yp[r]||0)+(+d);if(v<0||(+d>0&&(n>=2||v>C.bank[r])))return;T.yp[r]=v;ctGo()},
  ctYPOK(){const C=ct();const T=C.T;const p=C.players[T.p];if(!ctDevPlayable(C,T.p).includes('yp'))return;ctSnap(C);p.dev.yp--;T.dev=true;CT_RES.forEach(r=>{if(T.yp[r])ctTake(C,p,r,T.yp[r])});
    ctLog(C,'🎁 '+ctPN(C,T.p)+' เล่นปีอุดมสมบูรณ์ ได้ '+ctResTxt(T.yp));T.panel=null;T.yp={};ctGo()},
  ctMoR(t){ct().T.mo=t.dataset.id;ctGo()},
  ctMoOK(){const C=ct();const T=C.T;const r=T.mo;const p=C.players[T.p];if(!r||!ctDevPlayable(C,T.p).includes('mo'))return;ctSnap(C);p.dev.mo--;T.dev=true;let n=0;
    C.players.forEach((q,j)=>{if(j===T.p)return;n+=q.res[r]||0;q.res[r]=0});p.res[r]+=n;ctLog(C,'💰 '+ctPN(C,T.p)+' เล่นผูกขาด '+CT_RN[r]+' ได้ '+n+' ใบ');toast('ได้ '+CT_RN[r]+' '+n+' ใบ (ตามที่จดในเครื่อง)');T.panel=null;T.mo=null;ctGo()},
  ctRbSkip(){const C=ct();const T=C.T;T.stage=null;T.rb=0;ctGo()},
  ctEndTurn(){const C=ct();const T=C.T;if(!T.rolled){toast('ยังไม่ได้ทอยเต๋า');return}if(T.stage)return;ctEndTurn(C);ctGo()},
  ctUndo(){const C=ct();const s=C.hist.pop();if(!s){toast('ไม่มีอะไรให้ย้อน');return}const o=JSON.parse(s);Object.keys(o).forEach(k=>{if(k!=='_ln')C[k]=o[k]});if(o._ln!=null&&C.log.length>o._ln)C.log.length=o._ln;toast('ย้อนกลับแล้ว');ctGo()},
  ctPeek(t){const C=ct();const i=ctNum(t);if(ctHandVisible(C,i)&&!C.opts.open)delete C.view.peek[i];else C.view.peek[i]=Date.now();ctGo()},
  ctHandEd(t){ctHandSheet(ctNum(t))},
  ctHandQ(t){const C=ct();const [i,r,d]=t.dataset.id.split(':');const p=C.players[+i];
    if(r==='kn'){p.kn=Math.max(0,p.kn+(+d));ctUpdLA(C,+i)}
    else if(CT_DEVK.includes(r)){if(+d>0&&!C.deck[r])return toast('กองไม่มีการ์ดนี้เหลือ');if(+d<0&&!p.dev[r])return;p.dev[r]+=+d;C.deck[r]-=+d}
    else{if(+d>0&&!C.bank[r])return toast('ธนาคารไม่มี'+CT_RN[r]+'เหลือ');if(+d<0&&!p.res[r])return;p.res[r]+=+d;C.bank[r]-=+d}
    ctSave();render();ctHandSheet(+i)},
  ctChat(){const C=ct();C.view.chat=!C.view.chat;CT_CHAT=[];ctGo();if(C.view.chat)setTimeout(()=>{const el=document.getElementById('ctChatIn');if(el&&window.innerWidth>700)el.focus()},30)},
  ctAsk(){const el=document.getElementById('ctChatIn');const q=el?el.value:'';if(el)el.value='';ctAsk(q)},
  ctAskQ(t){ctAsk(t.dataset.id)},
  ctKB(){openSheet('📖 กติกา Catan',CT_KB.map(e=>`<details class="rules"><summary>${esc(e.t)}</summary>${md(e.a)}</details>`).join('')+'<p class="muted small">สรุปจากคู่มือ Catan ฉบับภาษาอังกฤษพิมพ์ครั้งที่ 5</p>','<button class="btn primary" data-act="closeSheet">ปิด</button>')},
  ctLogS(){const C=ct();openSheet('📜 บันทึกเกม',C.log.length?`<ol class="ct-log" reversed>${C.log.slice().reverse().map(l=>`<li>${esc(l.t)}</li>`).join('')}</ol>`:'<p class="muted">ยังไม่มีอะไร</p>','<button class="btn primary" data-act="closeSheet">ปิด</button>')},
  ctStats(){openSheet('📊 สถิติลูกเต๋า',ctStatsHTML(ct()),'<button class="btn primary" data-act="closeSheet">ปิด</button>')},
  ctPhotoS(){const u=CT_TMP_PHOTO||ctPhoto();openSheet('📷 รูปกระดาน',u?`<img src="${u}" alt="รูปกระดาน" style="width:100%;border-radius:12px">`:'<p class="muted">ไม่มีรูป</p>','<button class="btn primary" data-act="closeSheet">ปิด</button>')},
  ctSet(){ctSetSheet()},
  ctFull(){const C=ct();C.view.full=!C.view.full;ctGo();window.scrollTo({top:0})},
  ctFix(){const C=ct();closeSheet();C.view.fix={k:'set',p:ctCur(C)||0};if(C.T){C.T.mode=null}ctGo()},
  ctFixK(t){ct().view.fix.k=t.dataset.id;ctGo()},
  ctFixP(t){ct().view.fix.p=ctNum(t);ctGo()},
  ctFixOff(){const C=ct();C.view.fix=null;ctUpdLR(C);ctGo()},
  ctEditBoard(){const C=ct();closeSheet();C.back=C.phase;C.phase='board';C.view.ed='hex';ctGo();window.scrollTo({top:0})},
  ctToEnd(){const C=ct();closeSheet();C.phase='end';ctGo();window.scrollTo({top:0})},
  ctWin(t){const C=ct();C.win=ctNum(t);ctLog(C,'🏆 '+ctPN(C,C.win)+' ชนะด้วย '+ctVP(C,C.win,true)+' แต้ม');C.phase='end';ctGo();window.scrollTo({top:0})},
  ctBackTable(){const C=ct();C.phase=C.place&&!C.T?'place':'play';C.win=null;ctGo()},
  async ctSaveRes(){const C=ct();if(C.saved)return;const aw=checked('ctAward');const n=Math.max(0,Math.min(50,Math.floor(+val('ctAwardN')||0)));C.award=n;C.saved=true;ctSave();
    const rk=C.players.map((p,i)=>({p,v:ctVP(C,i,true),i}));const best=Math.max(...rk.map(x=>x.v));const winners=(C.win!=null?[rk[C.win]]:rk.filter(x=>x.v===best)).map(x=>x.p);
    const pts={};if(aw)winners.forEach(p=>{if(p.id)pts[p.id]=n});await saveGameSession({game:'Catan',players:C.players,winners,pts});toast('บันทึกผลเข้าบ้านแล้ว');render()},
  ctAgain(){const C=ct();S.catan=ctNew(C);S.catan.phase='board';ctGo();window.scrollTo({top:0})},
  ctNewGame(){S.catan=ctNew();LS.set('catanPhoto','');CT_TMP_PHOTO='';ctGo();window.scrollTo({top:0})}
});
function ctAddP(C,p){p.pc=CT_PCK.find(c=>!C.players.some(x=>x.pc===c));p.side='bltr'.split('').find(s=>!C.players.some(x=>x.side===s));return p}
function ctFixNode(C,n){const F=C.view.fix;ctSnap(C);if(F.k==='del')delete C.nodes[n];else if(F.k==='set')C.nodes[n]={p:F.p,c:0};else if(F.k==='city')C.nodes[n]={p:F.p,c:1};ctUpdLR(C);ctGo()}
function ctFixEdge(C,e){const F=C.view.fix;ctSnap(C);if(F.k==='del')delete C.edges[e];else if(F.k==='road')C.edges[e]=F.p;ctUpdLR(C);ctGo()}
function ctHandSheet(i){const C=ct();const p=C.players[i];if(!p)return;
  openSheet('✎ การ์ดของ '+esc(ctName(p)),`<p class="muted small" style="margin:0">ใช้แก้ให้ตรงกับการ์ดในมือจริง · ธนาคารปรับตามให้เอง</p>
    <div class="ct-stps">${CT_RES.map(r=>ctStep('ctHandQ',i,r,p.res[r]||0)).join('')}</div>
    <div class="label">การ์ดพัฒนาในมือ (ไม่รวมที่เพิ่งซื้อตานี้ ${ctDevN(p)-CT_DEVK.reduce((a,k)=>a+p.dev[k],0)} ใบ)</div>
    <div class="ct-stps">${CT_DEVK.map(k=>`<div class="ct-stp"><span>${CT_DEV[k].i} ${CT_DEV[k].n}</span><button type="button" data-act="ctHandQ" data-id="${i}:${k}:-1">−</button><b>${p.dev[k]}</b><button type="button" data-act="ctHandQ" data-id="${i}:${k}:1">+</button></div>`).join('')}
    <div class="ct-stp"><span>⚔️ อัศวินที่เล่นแล้ว</span><button type="button" data-act="ctHandQ" data-id="${i}:kn:-1">−</button><b>${p.kn}</b><button type="button" data-act="ctHandQ" data-id="${i}:kn:1">+</button></div></div>`,
    '<button class="btn primary" data-act="closeSheet">เสร็จ</button>')}
function ctSetSheet(){const C=ct();
  openSheet('⚙ ตั้งค่าและแก้ไข',`<label class="check"><input type="checkbox" data-ct="combine" ${C.opts.combine?'checked':''}> รวมขั้นแลกกับสร้าง</label>
    <label class="check"><input type="checkbox" data-ct="open" ${C.opts.open?'checked':''}> เปิดการ์ดในมือทุกคนบนจอ</label>
    <label class="check"><input type="checkbox" data-ct="seats" ${C.opts.seats?'checked':''}> จอแบบนั่งล้อมกระดาน (หมุนแผงหาคนนั่ง)</label>
    <label class="field" style="max-width:180px"><span>แต้มที่ต้องได้</span><input type="number" min="3" max="20" value="${C.opts.target}" data-ct="target"></label>
    <div class="label">แก้ไขระหว่างเกม</div>
    <div class="btns"><button class="btn sm" data-act="ctFix">🏠 ย้าย/เพิ่ม/ลบ บ้าน ถนน โจร</button><button class="btn sm" data-act="ctEditBoard">🗺 แก้ช่อง เลข ท่าเรือ</button></div>
    <div class="label">ที่นั่ง</div><div class="ct-plist">${C.players.map((p,i)=>`<div class="ct-pcs">${playerPawn(p,'sm')} ${CT_SIDES.map(([s,n])=>`<button type="button" class="chip" data-act="ctSeatSide" data-id="${i}:${s}" aria-pressed="${p.side===s}">${n}</button>`).join('')}</div>`).join('')}</div>`,
    '<button class="btn" data-act="ctToEnd">จบเกม ไปหน้าสรุป</button><button class="btn primary" data-act="closeSheet">ปิด</button>')}
ACT.ctSeatSide=t=>{const C=ct();const [i,s]=t.dataset.id.split(':');const o=C.players.find(p=>p.side===s);if(o)o.side=C.players[+i].side;C.players[+i].side=s;ctSave();render();ctSetSheet()};
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ct;if(!k||!S.catan)return;const C=ct();
  if(k==='photo'){ctLoadPhoto(e.target.files&&e.target.files[0]);return}
  if(k==='target'){const v=parseInt(e.target.value,10);if(v>=3&&v<=20)C.opts.target=v}else C.opts[k]=e.target.checked;ctSave();render()});
document.addEventListener('keydown',e=>{
  if(!(S.tab==='tools'&&S.tool==='catan'&&S.catan)||!$('#sheet').hidden||e.isComposing)return;const C=S.catan;
  if(e.target&&e.target.id==='ctChatIn'){if(e.key==='Enter'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();ACT.ctAsk()}return}
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if((e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')&&(C.phase==='play'||C.phase==='place')){e.preventDefault();ACT.ctUndo();return}
  if(C.phase!=='play'||!C.T||e.metaKey||e.ctrlKey||e.altKey)return;const T=C.T;
  if(e.key==='Escape'){if(C.view.chat){C.view.chat=false;CT_CHAT=[];ctGo()}else if(T.mode||T.panel){T.mode=null;T.panel=null;ctGo()}return}
  if(e.key===' '&&!T.rolled&&!T.stage){e.preventDefault();ACT.ctDice();return}
  if(e.key==='Enter'&&T.rolled&&!T.stage&&!T.mode){e.preventDefault();ACT.ctEndTurn()}
});
window.addEventListener('resize',()=>{if(S.tab==='tools'&&S.tool==='catan'&&S.catan&&(S.catan.phase==='play'||S.catan.phase==='place')){clearTimeout(ctAfter.rs);ctAfter.rs=setTimeout(()=>{if(!typing())render()},150)}});

/* hook for future games: House.registerTool({id,name,desc,view:()=>html}) */
window.House={registerTool(def){if(def&&def.id&&typeof def.view==='function'){TOOLS[def.id]={view:def.view,name:def.name,desc:def.desc};render()}},store:Store,kids,act:ACT,render,
  x:{S,Store,EXT,ACT,LS,esc,md,toast,openSheet,closeSheet,render,beep,kids,kidById,pawn,shuffle,okColor,uid,seal:xbSeal,open:xbOpen,askEnd:()=>askEndGame()}};

render();
Store.init();
})();
</script>
