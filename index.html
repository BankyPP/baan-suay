<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baan Suay">
<meta name="theme-color" content="#1B365D">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Baan Suay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,700;1,400&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* Layout: a family game table. House name + mode switch on top, rooms as a scrolling tab row, one content column.
   Calm blue-grey paper and ink; the siblings' pawn colours are the only loud colour on the page. */
:root{
  --paper:#ECF0F3; --surface:#FFFFFF; --sunk:#DFE6EC; --ink:#17212B; --muted:#55626E; --line:#CDD6DE;
  --btn:#17212B; --btn-ink:#FFFFFF; --good:#16825A; --good-bg:#DCF1E7; --bad:#BE3A2A; --bad-bg:#F8E0DC;
  --focus:#2F5BD3; --scrim:rgba(12,18,24,.48); --star:#E2A00C;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 6px 20px rgba(23,33,43,.08);
  --f-head:"Kanit","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","Kanit",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10161C; --surface:#18212A; --sunk:#222C37; --ink:#E6ECF1; --muted:#98A5B1; --line:#2D3844;
  --btn:#E6ECF1; --btn-ink:#10161C; --good:#4CC18C; --good-bg:#16352A; --bad:#F2806E; --bad-bg:#3B201C;
  --focus:#86A6FF; --scrim:rgba(0,0,0,.6); --star:#F5B931; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10161C; --surface:#18212A; --sunk:#222C37; --ink:#E6ECF1; --muted:#98A5B1; --line:#2D3844;
  --btn:#E6ECF1; --btn-ink:#10161C; --good:#4CC18C; --good-bg:#16352A; --bad:#F2806E; --bad-bg:#3B201C;
  --focus:#86A6FF; --scrim:rgba(0,0,0,.6); --star:#F5B931; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--f-body)}
h1,h2,h3,h4,h5{font-family:var(--f-head);line-height:1.25;text-wrap:balance;margin:0}
h2{font-weight:600;font-size:1.35rem}
h3{font-weight:500;font-size:1.08rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 28px}
.sitefoot{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted);text-align:center}
.sitefoot time{font-variant-numeric:tabular-nums;color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:46px;height:46px;flex:none;color:var(--ink)}
.brand h1{font-weight:700;font-size:clamp(1.45rem,4.6vw,2.1rem);letter-spacing:-.005em}
.brand small{display:block;font:500 .78rem/1.3 var(--f-head);color:var(--muted);letter-spacing:.03em}
.modebtn{display:inline-flex;align-items:center;gap:8px;font:500 .9rem/1 var(--f-head);min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.modebtn .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.modebtn[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.modebtn[aria-pressed="true"] .dot{background:#38D38E}

.tabs{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;margin-block:14px 20px;box-shadow:inset 0 -1px 0 var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:500 1rem/1 var(--f-head);background:none;border:0;color:var(--muted);padding:12px 14px 13px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;flex:none}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}

.banner{font-size:.9rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px}

.btn{font:500 .95rem/1.1 var(--f-head);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:.86rem;border-radius:10px}
.btn.big{min-height:58px;font-size:1.1rem;padding:0 22px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.sec{display:grid;gap:14px;margin-bottom:32px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head p{color:var(--muted);font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font:500 .74rem/1.2 var(--f-head);letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:500 .86rem/1 var(--f-head);padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:500 .72rem/1 var(--f-head);padding:5px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ex{background:transparent;border:1px dashed var(--muted)}
.subj{display:inline-block;font:600 .74rem/1 var(--f-head);letter-spacing:.04em;padding:5px 9px;border-radius:6px;border:1.5px solid var(--ink);color:var(--ink)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;display:grid;gap:12px;justify-items:center}
.empty b{font:600 1.05rem var(--f-head);color:var(--ink)}

/* pawns: the siblings as game pieces */
.pawn{--c:#6B7785;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font:600 15px/1 var(--f-head);letter-spacing:.02em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);flex:none;border:0;padding:0}
.pawn.sm{width:26px;height:26px;font-size:10.5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.pawn.lg{width:64px;height:64px;font-size:22px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.pawn.xl{width:132px;height:132px;font-size:46px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.2)}
button.pawn{cursor:pointer;transition:transform .12s}
button.pawn:active{transform:scale(.94)}
button.pawn[aria-pressed="false"]{opacity:.32}
button.pawn[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.pawns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex}
.stack .pawn{margin-left:-6px;outline:2px solid var(--surface)}
.stack .pawn:first-child{margin-left:0}

/* race track */
.board{display:grid;gap:10px}
.lane{--c:#6B7785;display:grid;grid-template-columns:88px minmax(0,1fr) 70px;gap:12px;align-items:center}
.lane-who b{font:600 1.02rem/1.2 var(--f-head);display:block}
.lane-who small{display:block;color:var(--muted);font-size:.76rem;line-height:1.25}
.track{position:relative;height:50px;border-radius:25px;background:var(--sunk);overflow:hidden}
.track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--paper) calc(10% - 2px) 10%)}
.track .fill{position:absolute;inset:0 auto 0 0;width:calc(50px + (100% - 50px) * var(--p));background:color-mix(in srgb,var(--c) 26%,transparent);border-radius:25px;transition:width .7s}
.track .pawn{position:absolute;top:5px;left:calc(5px + (100% - 50px) * var(--p));transition:left .7s}
.lane-pts{font:600 1.35rem/1 var(--f-head);text-align:right;font-variant-numeric:tabular-nums}
.lane-pts small{display:block;font:400 .72rem var(--f-body);color:var(--muted)}
.lead{font:600 .66rem/1 var(--f-head);background:var(--ink);color:var(--paper);padding:3px 6px;border-radius:5px;margin-left:4px;vertical-align:2px}
@media (max-width:540px){.lane{grid-template-columns:66px minmax(0,1fr) 50px;gap:8px}.lane-who small{display:none}}

.feed{display:grid;gap:0}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .pts{font:600 .95rem var(--f-head);font-variant-numeric:tabular-nums;color:var(--good)}
.feed .pts.zero{color:var(--muted)}
.feed .pts.neg,.lane-pts.neg{color:var(--bad)}
.lane-who{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.lane-who small{grid-column:2}
.rk{grid-row:span 2;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:600 .85rem/1 var(--f-head);font-variant-numeric:tabular-nums;color:var(--muted)}
.rk.top{background:var(--star);color:#fff}
.secret-title{font-size:clamp(1.5rem,4.4vw,2.1rem);font-weight:700;letter-spacing:.01em}
.pick.minus .opt input:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
ul.plain{list-style:none;margin:0;padding:0}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.qcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:grid;gap:4px}
.qcard:hover{border-color:var(--muted)}
.qcard b{font:600 1rem var(--f-head)}
.qcard span{color:var(--muted);font-size:.86rem;line-height:1.4}

/* lessons */
.lcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:grid;gap:8px;align-content:start;min-width:0}
.lcard:hover{border-color:var(--muted)}
.lcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lcard p{color:var(--muted);font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}
.lcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;min-height:26px}
.prose{max-width:68ch;overflow-wrap:anywhere}
.prose h3,.prose h4,.prose h5{margin:1.1em 0 .4em}
.prose h3{font-size:1.15rem;font-weight:600}
.prose p,.prose ul,.prose ol{margin:.5em 0}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin:.2em 0}
.prose u,.qtext u,.choice u,.explain u,.fmtprev u,.goals u{text-underline-offset:.22em}
.prose code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.tip{background:var(--sunk);border-radius:12px;padding:10px 14px;margin:.7em 0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:500 .92rem var(--f-head);cursor:pointer;padding:6px 0}
.back:hover{color:var(--ink)}

/* quiz */
.quiz{display:grid;gap:16px;max-width:760px}
.qtop{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .3s}
.qtext{font-size:1.2rem;line-height:1.55}
.qtext p{margin:0}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:1.02rem}
.choice .L{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--sunk);font:600 .95rem var(--f-head)}
.choice:hover:not(:disabled){border-color:var(--muted)}
.choice:disabled{cursor:default}
.choice.sel{border-color:var(--ink);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--ink)}
.choice.sel .L{background:var(--ink);color:var(--paper)}
.qmap{display:flex;flex-wrap:wrap;gap:6px}
.qmap button{min-width:38px;height:38px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:600 .9rem/1 var(--f-head);font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer}
.qmap button.done{background:var(--sunk);color:var(--ink);border-color:var(--muted)}
.qmap button.cur{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.qmap button.lock{border-style:dashed}
.qmap button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good);border-style:solid}
.qmap button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);border-style:solid}
.qmap button.part{background:var(--sunk);border-color:var(--muted);border-style:solid}
.explain.verdict.ok{background:var(--good-bg)}
.explain.verdict.no{background:var(--bad-bg)}
.explain .prose{margin-top:6px}
textarea.grow{min-height:46px;resize:vertical;overflow:hidden}
.quiz>.btn{justify-self:start}
.qnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.qnav .btn{flex:1 1 140px}
.qsubmit{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:14px;border-top:1px dashed var(--line)}
.qsubmit .banner{flex:1 1 100%;margin:0}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.right .L{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .L{background:var(--bad);color:#fff}
.explain{border-radius:14px;padding:12px 16px;background:var(--sunk)}
.explain b{font-family:var(--f-head);font-weight:600}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px 16px}
.result .score{font:700 3.6rem/1 var(--f-head);font-variant-numeric:tabular-nums}

/* lesson topics, stars, quiz setup */
.stars{display:inline-flex;gap:1px;align-items:center;flex:none}
.stars i{display:inline-flex}
.stars svg{width:19px;height:19px;fill:var(--line)}
.stars i.on svg{fill:var(--star)}
.stars.sm svg{width:14px;height:14px}
.ltitle{font-size:clamp(1.6rem,4.4vw,2.2rem);font-weight:600}
.topics{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:14px;row-gap:8px;align-items:start}
.tno{grid-row:1/span 2;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--sunk);font:600 1.05rem/1 var(--f-head);font-variant-numeric:tabular-nums}
.topic-head{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;min-height:38px}
.topic-head h3{font-size:1.1rem;font-weight:600}
.goalwrap{display:grid;gap:6px;min-width:0}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.goals li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;line-height:1.5;overflow-wrap:anywhere}
.goals li::before{content:"";width:12px;height:12px;margin-top:.42em;border:1.6px solid var(--muted);border-radius:3px}
@media (max-width:480px){.topic{grid-template-columns:30px minmax(0,1fr);column-gap:10px;padding:12px}.tno{width:30px;height:30px;font-size:.95rem}}
.qpanel{display:grid;gap:18px}
.qgroup{display:grid;gap:8px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:720px}
@media (max-width:560px){.seg{grid-template-columns:1fr 1fr}.seg button:first-child{grid-column:1/-1}}
.seg button{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.seg button b{font:600 1.15rem/1.1 var(--f-head)}
.seg button span{font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.mini{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.mini input{width:92px;padding:8px 10px}
.mini span{white-space:nowrap}
.fmtbar{position:sticky;top:-20px;z-index:3;margin:-4px -20px 0;padding:22px 20px 10px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fmtbar button b{font-weight:600}
.fmtbar button sub,.fmtbar button sup{font-size:.7em}
.fmtbar button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:600 1rem/1 var(--f-body);cursor:pointer;color:var(--ink)}
.fmtbar button span{font:500 .8rem/1 var(--f-head);color:var(--muted)}
.fmtbar button:active{background:var(--sunk)}
.fmtprev{flex:1 1 100%;min-width:0;font-size:.95rem;line-height:1.5;overflow-wrap:anywhere;min-height:1.5em}
.mini.wide select{width:auto;max-width:100%;padding:8px 10px;min-width:0}
.mini.wide{max-width:100%}
.tfoot{grid-column:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line)}
.tfoot .btn{margin-left:auto}
.topic.exam{border-style:dashed;border-width:1.5px;background:var(--sunk)}
.topic.exam .tno{background:var(--ink);color:var(--paper)}
.topic.exam.final{border-color:var(--ink)}
.chip.examchip{font-weight:600}
.qsettings{display:grid;gap:12px;background:var(--sunk);border-style:dashed}
.chip.hidchip{border-style:dashed;opacity:.75}
.tfoot.hid>.muted{text-decoration:line-through}
.tfoot .btn.eye{margin-left:auto}
.tfoot .btn.eye+.btn{margin-left:0}
.btn.eye svg{width:16px;height:16px;flex:none}
.btn.eye{font-size:.82rem;color:var(--good);border-color:var(--good)}
.btn.eye.off{color:var(--muted);border-color:var(--line);border-style:dashed}
.qedit .mini{justify-self:start}
.clock{font:600 1rem/1 var(--f-head);font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:999px;background:var(--sunk);min-width:4.2em;text-align:center}
.clock.warn{background:var(--bad-bg);color:var(--bad)}
.meq-box{min-height:170px;font-size:1.05rem}
.meq-yours{border:1px dashed var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:6px}
.review{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;width:100%;max-width:560px;text-align:left}
.review li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--sunk);font-size:.92rem}
.review .rv{font:600 .82rem/1 var(--f-head);padding:5px 8px;border-radius:6px;min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
.review li.ok .rv{background:var(--good-bg);color:var(--good)}
.review li.no .rv{background:var(--bad-bg);color:var(--bad)}
.review .rq{overflow-wrap:anywhere}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.starpick{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.starpick input{position:absolute;opacity:0;width:1px;height:1px}
.starpick label{cursor:pointer;padding:2px;display:inline-flex}
.starpick svg{width:26px;height:26px;fill:var(--line);transition:fill .1s}
.starpick input:checked~label svg,.starpick label:hover svg,.starpick label:hover~label svg{fill:var(--star)}
.starpick input:focus-visible+label{outline:3px solid var(--focus);outline-offset:1px;border-radius:6px}

/* tools */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);display:grid;gap:18px;min-width:0}
.bigq{font-size:clamp(1.3rem,3.4vw,1.9rem);line-height:1.5;font-weight:400}
.bigq p{margin:0}
.scoreline{display:flex;gap:14px;flex-wrap:wrap}
.scoreline>span{display:inline-flex;align-items:center;gap:6px;font:600 1.1rem var(--f-head);font-variant-numeric:tabular-nums}
.center{display:grid;justify-items:center;text-align:center;gap:10px}
.turnname{font:600 clamp(1.6rem,5vw,2.4rem)/1.1 var(--f-head)}
.dir{display:inline-flex;align-items:center;gap:8px;font:500 1rem var(--f-head);color:var(--muted)}
.dir svg{width:26px;height:26px}
.pending{font:600 1.15rem var(--f-head);background:var(--bad-bg);color:var(--bad);padding:8px 16px;border-radius:999px}
.unocolors{display:flex;gap:8px;justify-content:center}
.unocolors button{width:40px;height:40px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.unocolors button[aria-pressed="true"]{border-color:var(--ink)}
.unogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.nextup{display:flex;gap:6px;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem}
.order{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:46px;padding:8px;border-radius:12px;background:var(--sunk)}
.order .item{display:inline-flex;align-items:center;gap:4px;font:500 .8rem var(--f-head);color:var(--muted)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .tot{font:700 2rem/1 var(--f-head);font-variant-numeric:tabular-nums;min-width:2.5ch;text-align:right}
.prow .ctrl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.prow .ctrl input{width:90px}
.digits{font:600 clamp(4rem,16vw,7.5rem)/1 var(--f-head);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.digits.done{color:var(--bad);animation:blink .6s steps(2) 6}
@keyframes blink{50%{opacity:.25}}
.dice{display:flex;gap:14px;justify-content:center}
.dice svg{width:84px;height:84px}
.rank{display:grid;gap:8px;width:100%;max-width:460px}
.rank div{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--sunk);text-align:left}
.rank .no{font:600 1rem var(--f-head);color:var(--muted)}
.rank .v{font:700 1.3rem var(--f-head);font-variant-numeric:tabular-nums}

/* Baan Suay Game Show: one deliberate stage look (navy + marquee yellow) in both themes */
.bs{--bs-navy:#1B365D;--bs-deep:#122847;--bs-hover:#244876;--bs-line:#081324;--bs-gold:#FFF35C;--bs-white:#FFFFFF;--bs-dim:rgba(255,255,255,.62);
  background:var(--bs-navy);color:var(--bs-white);border-radius:6px;padding:clamp(14px,2.6vw,28px);display:grid;gap:clamp(12px,2vw,20px);box-shadow:inset 0 3px 0 #6F9BE6,var(--shadow);min-width:0}
.bs-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bs-title{font:600 clamp(1.35rem,3.8vw,2.6rem)/1.15 var(--f-head);color:var(--bs-gold);letter-spacing:.005em}
.bs-finalbtn{font:600 clamp(.9rem,1.6vw,1.1rem)/1 var(--f-head);color:var(--bs-gold);background:transparent;border:2px solid var(--bs-line);border-radius:3px;padding:14px 22px;cursor:pointer}
.bs-finalbtn:hover{background:var(--bs-hover)}
.bs-scroll{overflow-x:auto;margin-inline:-2px;padding-inline:2px}
.bs-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(78px,1fr));gap:3px;background:var(--bs-line);border:3px solid var(--bs-line);min-width:calc(var(--cols) * 81px)}
.bs-cat{background:var(--bs-navy);color:var(--bs-white);font:500 clamp(.82rem,1.7vw,1.15rem)/1.25 var(--f-head);text-align:center;padding:10px 6px;min-height:clamp(66px,9vw,104px);display:grid;place-items:center;border:0;overflow-wrap:break-word;word-break:normal;text-wrap:balance}
button.bs-cat{cursor:pointer;outline-offset:-4px}
button.bs-cat:hover{background:var(--bs-hover)}
.bs-cell{background:var(--bs-navy);color:var(--bs-gold);font:600 clamp(1.25rem,3.6vw,2.5rem)/1 var(--f-head);font-variant-numeric:tabular-nums;border:0;min-height:clamp(66px,9.5vw,110px);cursor:pointer;display:grid;place-items:center;position:relative;padding:4px;outline-offset:-4px}
.bs-cell:hover{background:var(--bs-hover)}
.bs-cell.used{background:var(--bs-deep)}
.bs-cell .who{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.bs-cell .none{font:500 .74rem/1.2 var(--f-head);color:rgba(255,255,255,.38)}
.bs-cell.blank::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#FF7F6E}
.bs-scores{display:flex;gap:10px 22px;flex-wrap:wrap}
.bs-scores>span{display:inline-flex;align-items:center;gap:8px;font:600 clamp(1.1rem,2.4vw,1.6rem)/1 var(--f-head);color:var(--bs-gold);font-variant-numeric:tabular-nums}
.bs-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bs-btn{font:600 1rem/1.1 var(--f-head);min-height:48px;padding:0 20px;border-radius:3px;border:2px solid var(--bs-gold);background:var(--bs-gold);color:var(--bs-navy);cursor:pointer}
.bs-btn.ghost{background:transparent;color:var(--bs-gold)}
.bs-btn.line{background:transparent;color:var(--bs-white);border-color:rgba(255,255,255,.35)}
.bs-btn:disabled{opacity:.4;cursor:not-allowed}
.bs-note{font-size:.88rem;color:var(--bs-dim)}
.bs-q .bs-qtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 clamp(1rem,2vw,1.35rem)/1.3 var(--f-head);color:var(--bs-white)}
.bs-pts{color:var(--bs-gold);font-family:var(--f-head);font-weight:600;font-variant-numeric:tabular-nums}
.bs-qtext{font:400 clamp(1.4rem,4vw,2.6rem)/1.45 var(--f-body);color:var(--bs-white);min-height:3.4em;display:grid;align-content:center;text-align:center;overflow-wrap:anywhere}
.bs-ans{border:2px dashed var(--bs-gold);padding:14px 18px;color:var(--bs-gold);font-size:clamp(1.15rem,3vw,1.8rem);line-height:1.45;text-align:center;border-radius:3px;overflow-wrap:anywhere}
.bs .md p{margin:0}
.bs .md ul,.bs .md ol{text-align:left;display:inline-block;margin:0}
.bs-label{display:block;font:500 .8rem/1.3 var(--f-head);letter-spacing:.04em;color:var(--bs-dim);margin-bottom:8px}
.bs .pawn[aria-pressed="true"]{outline-color:var(--bs-gold)}
.bs .pawn[aria-pressed="false"]{opacity:.35}
.bs :focus-visible{outline-color:var(--bs-gold)}
.bs-final-title{font:700 clamp(2rem,6.5vw,3.8rem)/1.05 var(--f-head);color:var(--bs-gold);text-align:center;text-wrap:balance}
.bs-wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 112px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:1.05rem}
.bs-wrow:last-child{border-bottom:0}
.bs input[type=number]{background:var(--bs-deep);color:var(--bs-white);border:1px solid rgba(255,255,255,.3);font-family:var(--f-head);font-size:1.15rem}
.bs-rank div{background:var(--bs-deep);color:var(--bs-white)}
.bs-rank .no{color:var(--bs-dim)}
.bs-rank .v{color:var(--bs-gold)}
@media (max-width:540px){.bs-wrow{grid-template-columns:auto minmax(0,1fr) 84px}.bs-wrow>.bs-pts:nth-child(3){display:none}}

/* wall */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;min-width:0}
.post.pinned{border-color:var(--ink);border-width:1.5px}
.post .by{display:flex;align-items:center;gap:8px;font:500 .84rem var(--f-head);color:var(--muted);flex-wrap:wrap}
.post h3{font-size:1.1rem}

/* stickers */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stk-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;justify-items:center;text-align:center;gap:6px}
.stk-card svg{width:88px;height:88px}
.stk-card b{font:600 .98rem var(--f-head)}
.stk-card span{font-size:.8rem;color:var(--muted);line-height:1.35}
.stk-card.locked b{color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:end center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.sheet{place-items:center}}
.sheet-card{background:var(--surface);color:var(--ink);width:min(700px,100%);max-height:100%;overflow:auto;border-radius:20px;padding:20px;box-shadow:var(--shadow);display:grid;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:500 1.1rem var(--f-head);flex:none}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>span{font:500 .84rem/1.2 var(--f-head);color:var(--muted)}
.field small{color:var(--muted);font-size:.8rem;line-height:1.4}
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pick label{position:relative;cursor:pointer;display:inline-flex}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick input+.pawn{opacity:.32}
.pick input:checked+.pawn{opacity:1;outline:3px solid var(--ink);outline-offset:3px}
.pick input:focus-visible+*{outline:3px solid var(--focus);outline-offset:3px}
.opt input+span{display:inline-block;font:500 .86rem/1 var(--f-head);padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.opt input:checked+span{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.sw input+span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);opacity:1}
.sw input:checked+span{outline:3px solid var(--ink);outline-offset:3px}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.qedit{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;margin:0;min-width:0}
.qedit legend{font:600 .9rem var(--f-head);padding:0 6px;display:flex;align-items:center;gap:6px}
.qedit{transition:transform .15s ease;background:var(--surface)}
.qedit.dragging{transition:none;position:relative;z-index:5;box-shadow:var(--shadow);border-color:var(--ink)}
.grip{display:inline-grid;place-items:center;width:30px;height:30px;margin-left:-4px;border:0;border-radius:8px;background:var(--sunk);color:var(--muted);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;padding:0}
.grip svg{width:11px;height:17px;fill:currentColor}
.grip:active{cursor:grabbing;color:var(--ink)}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.crow input[type=radio]{width:20px;height:20px;accent-color:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--btn);color:var(--btn-ink);font:500 .95rem var(--f-head);padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table td,.table th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.table th{font:500 .78rem var(--f-head);color:var(--muted)}
.scroll{overflow-x:auto}
.kidrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kidrow:last-child{border-bottom:0}
.kidrow b{font:600 1rem var(--f-head)}
details.rules summary{cursor:pointer;font:500 .88rem var(--f-head);color:var(--muted)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.gcard .facts{display:flex;gap:6px;flex-wrap:wrap}

/* Flip 7: one card per player, the player whose turn it is gets a dark ring */
.f7{display:grid;gap:14px}
.f7-turn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.f7-now{display:flex;gap:14px;align-items:center;min-width:0;justify-content:center}
.f7-now .turnname{font-size:clamp(1.4rem,4.6vw,2.1rem)}
.f7-now .nextup{justify-content:flex-start;margin-top:4px}
.f7-turn .btn.big{min-height:54px}
@media (max-width:600px){.f7-turn{grid-template-columns:1fr 1.6fr}.f7-now{grid-column:1/-1;order:-1;justify-content:flex-start}.f7-turn .btn.big{padding:0 12px;font-size:1rem}}
@media (max-width:480px){.f7-row .f7-add input[type=text]{flex-basis:100%}.f7-row .f7-add .btn.primary{flex:1}}
@media (hover:none){.f7-turn kbd,.f7-keys{display:none}}
kbd{font:500 .7rem/1 var(--f-head);padding:3px 6px;border-radius:5px;border:1px solid currentColor;opacity:.75}
.f7-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.f7-head h3{font-weight:600}
.f7-goal{background:color-mix(in srgb,var(--star) 16%,var(--surface));border:1px solid var(--star);border-radius:14px;padding:10px 14px;font-size:.95rem}
.f7-goal b{font-family:var(--f-head);font-weight:600}
.f7-rows{display:grid;gap:10px}
.f7-row{--c:#6B7785;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.f7-row.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.f7-who{background:none;border:0;padding:0;cursor:pointer;border-radius:50%;line-height:0}
.f7-name{display:grid;gap:6px;min-width:0}
.f7-name b{font:600 1.08rem/1.2 var(--f-head);overflow-wrap:anywhere}
.f7-tag{display:inline-block;font:500 .7rem/1 var(--f-head);padding:4px 7px;border-radius:5px;background:var(--ink);color:var(--paper);margin-left:6px;vertical-align:2px}
.f7-tag.hit{background:var(--star);color:#fff}
.f7-bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.f7-bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .4s}
.f7-last{display:flex;gap:4px;flex-wrap:wrap;min-height:20px;align-items:center}
.f7-chip{font:500 .76rem/1 var(--f-head);font-variant-numeric:tabular-nums;padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.f7-chip.neg{color:var(--bad);background:var(--bad-bg)}
.f7-chip em{font-style:normal;margin-left:3px;color:var(--star)}
.f7-tot{font:700 clamp(1.9rem,6vw,2.6rem)/1 var(--f-head);font-variant-numeric:tabular-nums;text-align:right}
.f7-tot small{display:block;font:500 .74rem var(--f-head);color:var(--muted);margin-top:4px}
.f7-tot.neg{color:var(--bad)}
.f7-add{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.f7-add input[type=text]{flex:1 1 150px;width:auto;font-size:1.05rem;font-variant-numeric:tabular-nums;background:var(--paper)}
.f7-add .btn{min-height:42px;white-space:nowrap}
.f7-x2{font-weight:600}
.f7-x2[aria-pressed="true"]{background:var(--star);border-color:var(--star);color:#fff}
.f7-b15,.f7-mod{font-weight:600}
.f7-mod[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.f7-special .f7-key{font-size:.95rem}
.f7-add .f7-go{order:1}.f7-add .f7-pad{order:2}.f7-add .f7-special{order:3}.f7-add .f7-prev{order:4}
.f7-b15[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.f7-chip em.b{color:var(--good)}
.f7-rk{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--sunk);font:600 .78rem/1 var(--f-head);color:var(--muted);font-variant-numeric:tabular-nums;margin-right:7px;vertical-align:2px}
.f7-rk.top{background:var(--star);color:#fff}
.f7-pad{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.f7-pad .f7-key{min-height:40px;padding:0;font:600 1rem/1 var(--f-head);font-variant-numeric:tabular-nums}
.f7-pad .f7-key:active{background:var(--sunk)}
@media (max-width:480px){.f7-row .f7-pad{order:1}.f7-row .f7-special{order:2}.f7-row .f7-add>.btn{order:3}.f7-row .f7-prev{order:4}}
.f7-prev{flex-basis:100%;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.f7-prev:empty{display:none}
.f7-prev b{font-family:var(--f-head);font-weight:600;color:var(--ink)}
.f7-keys{font-size:.84rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.f7-keys span{white-space:nowrap}
.f7-keys span.w{white-space:normal}
.f7-erow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.f7-erow input[type=text]{flex:1 1 150px;width:auto}
.f7-erow .no{font:600 .9rem var(--f-head);color:var(--muted);font-variant-numeric:tabular-nums}
.f7-erow .v{font:600 1rem var(--f-head);font-variant-numeric:tabular-nums;min-width:3.5ch;text-align:right}
.f7-erow.del input[type=text],.f7-erow.del .v{opacity:.4;text-decoration:line-through}
.f7-erow .check{font-size:.9rem}


/* poker helper: chips and betting only */
.pb{display:grid;gap:14px;min-width:0}
.pb-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
.pb-street{font:600 clamp(1.55rem,6vw,2.2rem)/1.1 var(--f-head);margin-top:4px}
.pb-pot{text-align:right;margin-left:auto}
.pb-pot b{display:block;font:700 clamp(2.1rem,9vw,3.2rem)/1 var(--f-head);font-variant-numeric:tabular-nums;margin-top:4px}
.pb-deal{background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:.95rem;line-height:1.5}
.pb-deal b{font-family:var(--f-head);font-weight:600}
.pb-turn{--c:#6B7785;background:var(--surface);border:2px solid var(--c);border-radius:20px;padding:clamp(14px,3.5vw,22px);display:grid;gap:14px;box-shadow:var(--shadow);min-width:0}
.pb-who{display:flex;gap:14px;align-items:center;min-width:0}
.pb-who .turnname{overflow-wrap:anywhere;font-size:clamp(1.5rem,6vw,2.2rem)}
.pb-need{font:500 1.05rem/1.4 var(--f-head)}
.pb-need b{font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.pb-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb-acts .btn{min-height:58px;font-size:1.08rem;padding:0 10px}
.pb-allin{border-color:var(--star);color:var(--ink);background:color-mix(in srgb,var(--star) 18%,var(--surface))}
.pb-allin.arm{background:var(--bad);border-color:var(--bad);color:#fff;font-size:.98rem;line-height:1.25}
.pb-rz{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--sunk)}
.pb-rz .field>span{line-height:1.45}
.pb-rzrow{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px}
.pb-rzrow .btn{min-height:52px;font-size:1.4rem;padding:0}
.pb-rzrow input{font:600 1.45rem/1 var(--f-head);text-align:center;font-variant-numeric:tabular-nums;background:var(--surface)}
.pb-quick{display:flex;gap:6px;flex-wrap:wrap}
.pb-rznow{font-size:.95rem;color:var(--muted);min-height:1.5em}
.pb-rznow b{font:700 1.1rem var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.pb-seats{display:grid;gap:6px}
.pb-seat{--c:#6B7785;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c)}
.pb-seat.now{border-color:var(--c);border-width:2px 2px 2px 5px;box-shadow:var(--shadow)}
.pb-seat.off{opacity:.5}
.pb-nm{min-width:0;display:grid;gap:3px;justify-items:start}
.pb-nm b{font:600 1rem/1.2 var(--f-head);overflow-wrap:anywhere}
.pb-role{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:11px;font:600 .7rem/1 var(--f-head);background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:2px}
.pb-role.d{background:var(--ink);color:var(--paper)}
.pb-st{font:500 .76rem/1 var(--f-head);padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.pb-st.now{background:var(--c);color:#fff}
.pb-st.hot{background:color-mix(in srgb,var(--star) 26%,var(--surface));color:var(--ink)}
.pb-chips{text-align:right;font:600 1.2rem/1 var(--f-head);font-variant-numeric:tabular-nums}
.pb-chips small{display:block;font:500 .74rem/1.2 var(--f-head);color:var(--muted);margin-top:4px}
.pb-tap{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.pb-potbox{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.pb-pothead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pb-pothead b{font:700 1.5rem/1 var(--f-head);font-variant-numeric:tabular-nums}
.pb-picks{display:flex;gap:8px;flex-wrap:wrap}
.pb-pick{display:inline-flex;gap:8px;align-items:center;min-height:44px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font:500 .98rem var(--f-head);color:var(--ink)}
.pb-pick kbd{margin-left:6px}
@media (hover:none){.pb-pick kbd{display:none}}
.pb-pick[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg);box-shadow:inset 0 0 0 1px var(--good)}
.pb-last{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--good-bg);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.pb-lastrow{font-size:1rem}
.pb-lastrow b{font-family:var(--f-head);font-weight:600}
.pb-nets{display:flex;gap:6px 12px;flex-wrap:wrap}
.pb-net{display:inline-flex;align-items:center;gap:5px;font:600 .95rem var(--f-head);font-variant-numeric:tabular-nums}
.pb-net.up,.pb-sub.up{color:var(--good)}
.pb-net.down,.pb-sub.down{color:var(--bad)}
.pb-sub{display:block;font:500 .78rem var(--f-head);color:var(--muted)}
.pb-log{margin:8px 0 0;padding-left:1.4em;font-size:.9rem;color:var(--muted);display:grid;gap:2px}
.pb-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.pb-crow{display:grid;grid-template-columns:auto minmax(0,1fr) 110px auto auto;gap:8px;align-items:center}
.pb-crow b{font:600 .98rem var(--f-head);overflow-wrap:anywhere}
.pb-crow input{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:480px){.pb-crow{grid-template-columns:auto minmax(0,1fr) 92px;row-gap:6px}.pb-crow .btn{grid-column:span 1}.pb-crow .btn:first-of-type{grid-column:2}}

/* คำต้องห้าม: one phone per player; in circle mode the phone faces outward and the word fills the screen */
.tb{display:grid;gap:14px;min-width:0}
.tb-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.tb-two{grid-template-columns:1fr}}
.tb-me{display:flex;align-items:center;gap:10px}
.tb-me b{font-family:var(--f-head);font-weight:600}
.tb-join{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.tb-join input{width:100%;min-width:0;font:600 1.7rem/1 var(--f-head);letter-spacing:.18em;text-align:center;font-variant-numeric:tabular-nums;padding:10px 12px}
.tb-code{font:700 clamp(3.2rem,16vw,5.6rem)/1 var(--f-head);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tb-code span{display:inline-block;width:.35em}
.tb-rules{margin:0;padding-left:1.3em;display:grid;gap:4px}
.tb-seg{grid-template-columns:1fr 1fr;max-width:none}
.tb-seg button:first-child{grid-column:auto}
@media (max-width:480px){.tb-seg{grid-template-columns:1fr}}
.tb-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-bar .btn{margin-left:auto}
.tb-pill{display:inline-flex;align-items:center;min-height:34px;font:600 .9rem/1 var(--f-head);padding:0 12px;border-radius:999px;background:var(--sunk);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-rows{display:grid;gap:8px}
.tb-row{--c:#6B7785;display:grid;grid-template-columns:24px auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);min-width:0}
.tb-row.me{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.tb-row.out{opacity:.5}
.tb-row.out .tb-word{text-decoration:line-through}
.tb-no{font:600 .95rem/1 var(--f-head);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.tb-who{display:grid;gap:2px;min-width:0}
.tb-who b{font:600 1rem/1.25 var(--f-head);overflow-wrap:anywhere}
.tb-word{font:600 clamp(1.35rem,5.4vw,1.9rem)/1.3 var(--f-head);overflow-wrap:anywhere}
.tb-word.mine{font:500 1rem/1.3 var(--f-head);color:var(--muted)}
.tb-tags{display:flex;gap:4px;flex-wrap:wrap}
.tb-tag{display:inline-block;font:500 .7rem/1 var(--f-head);padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.tb-tag.host{background:var(--ink);color:var(--paper)}
.tb-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb-acts .btn.danger{min-width:64px}
@media (max-width:480px){.tb-row{grid-template-columns:20px auto minmax(0,1fr)}.tb-acts{grid-column:1/-1;justify-content:stretch}.tb-acts .btn{flex:1}}
.tb-hidden{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--line);background:var(--sunk)}
.tb-hidden>div{display:grid;gap:2px}
.tb-hidden b{font:600 1.05rem var(--f-head)}
.tb-gone{--c:#6B7785;display:grid;gap:4px;justify-items:center;text-align:center;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1.5px solid var(--c)}
.tb-gone b{font:700 clamp(2rem,9vw,3rem)/1.25 var(--f-head);overflow-wrap:anywhere}
.tb-note{margin:0}
.tb-ask{--c:#6B7785;display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid var(--line)}
.tb-askword{font:700 clamp(1.8rem,7vw,2.6rem)/1.25 var(--f-head);overflow-wrap:anywhere}
.tb-endname{font-family:var(--f-head);font-weight:600;font-size:1.1rem}
/* the outward-facing word: a fixed dark card in both themes so it reads the same across the table */
.tb-full{--c:#6B7785;position:fixed;inset:0;z-index:30;background:#10161C;color:#fff;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;text-align:center;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.tb-band{position:absolute;left:0;right:0;top:0;height:12px;background:var(--c)}
.tb-top{display:flex;align-items:center;justify-content:center;gap:10px;font:500 1.05rem/1.2 var(--f-head);color:rgba(255,255,255,.82)}
.tb-top b{font-weight:600;color:#fff}
.tb-big{display:grid;place-items:center;font-family:var(--f-head);font-weight:700;line-height:1.3;overflow-wrap:anywhere;word-break:break-word;padding-inline:4px;min-height:0}
.tb-under{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.tb-full .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.32)}
.tb-full .btn:hover{border-color:#fff}
.tb-full :focus-visible{outline-color:#fff}
.tb-pill.dark{background:rgba(255,255,255,.12);color:#fff}
.tb-full.warn{background:#F2B21B;color:#17212B}
.tb-full.warn .btn{background:#17212B;color:#fff;border-color:#17212B}
.tb-warn{display:grid;place-items:center;align-content:center;gap:10px}
.tb-warn svg{width:84px;height:84px}
.tb-warn b{font:700 clamp(1.8rem,8vw,3rem)/1.2 var(--f-head)}
.tb-warn span{font:500 1.1rem var(--f-head)}
.tb-count{font:700 clamp(5rem,26vw,9rem)/1 var(--f-head);font-variant-numeric:tabular-nums}
@media (hover:none){.tb-keys{display:none}}
.tb-keylist{font-size:.88rem;color:var(--muted);display:flex;gap:8px 16px;flex-wrap:wrap}
.tb-keylist span{white-space:nowrap}
.tb-none button.pawn[aria-pressed="false"]{opacity:1}
.tb-warnline{color:var(--bad);font-family:var(--f-head);font-weight:500}
.tb-flash{animation:tbflash 1.2s ease 1}
@keyframes tbflash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--focus)}}
.tb-pill.warn{background:var(--bad-bg);color:var(--bad)}
.tb-pill.dark.warn{background:#F2806E;color:#10161C}
.tb-timeup{font:600 1.05rem var(--f-head);color:var(--bad)}
.tb .mini input[type=text]{width:84px;text-align:center}
/* rounds, kills, guessing, score table, game master */
.tb-mybtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb-mybtns .btn{min-height:56px}
.tb-killers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tb-killer{--c:#6B7785;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px 6px 6px;border-radius:14px;border:1.5px solid var(--line);border-left:6px solid var(--c);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left;font:500 1rem/1.2 var(--f-head)}
.tb-killer>span:not(.pawn){flex:1;min-width:0;overflow-wrap:anywhere}
.tb-killer small{display:block;font:400 .82rem var(--f-body);color:var(--muted)}
.tb-killer kbd{opacity:.55}
.tb-killer.on{border-color:var(--good);background:var(--good-bg)}
.tb-killer:active{transform:scale(.98)}
@media (hover:none){.tb-killer kbd,.tb-mybtns kbd,#sheetCard .btn kbd{display:none}}
.tb-full .tb-outbtn{background:#F2806E;border-color:#F2806E;color:#10161C}
.tb-gst{display:inline-block;font:500 .74rem/1 var(--f-head);padding:5px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-top:2px}
.tb-gst.ok{background:var(--good-bg);color:var(--good)}
.tb-gst.no{background:var(--bad-bg);color:var(--bad)}
.tb-chips{display:flex;gap:4px;flex-wrap:wrap}
.tb-rpts{font:700 1.5rem/1 var(--f-head);font-variant-numeric:tabular-nums;color:var(--good);padding-right:4px}
.tb-row.dim .tb-who b{color:var(--muted)}
.tb-row.gm{border-left-style:dashed;background:var(--sunk)}
.tb-tag.gm,.tb-pill.gm{background:var(--star);color:#17212B}
.tb-scorebox{display:grid;gap:8px;min-width:0}
.tb-tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.tb-table{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
.tb-table th,.tb-table td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface);vertical-align:middle}
.tb-table tbody tr:last-child th,.tb-table tbody tr:last-child td{border-bottom:0}
.tb-table thead th{font:500 .82rem/1.2 var(--f-head);color:var(--muted);background:var(--sunk)}
.tb-table thead th small{display:block;font:400 .7rem var(--f-body);opacity:.85}
.tb-table td b{display:block;font:600 1.15rem/1.1 var(--f-head)}
.tb-table td small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.tb-table td.tb-na{color:var(--muted)}
.tb-table .nm{position:sticky;left:0;z-index:1;text-align:left;box-shadow:1px 0 0 var(--line);min-width:150px}
.tb-table thead .nm{z-index:2}
.tb-nm{display:flex;align-items:center;gap:8px}
.tb-nm .n{flex:1;font:600 .98rem var(--f-head);white-space:normal;overflow-wrap:anywhere}
.tb-tot{font:700 1.3rem/1 var(--f-head);min-width:2ch;text-align:right}
.tb-table tr.tb-best .tb-tot{color:var(--star)}
@media (max-width:480px){.tb-row.res{grid-template-columns:6px auto minmax(0,1fr) auto}.tb-row.res .tb-acts{grid-column:1/-1}}
.tb-row.res .tb-no{width:0}
.tb-gst{justify-self:start}

/* ---------- Word Arcade (Connections + Crossword) ---------- */
:root{--wa-tile:#EAE8DE;--wa-tile-ink:#17212B;--wa-sel:#5B5A51;--wa-sel-ink:#FFFFFF;--wa-g0:#F4D762;--wa-g1:#A2C65E;--wa-g2:#AFC5EF;--wa-g3:#BE89CB;--wa-gink:#14191F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wa-tile:#2A333D;--wa-tile-ink:#E6ECF1;--wa-sel:#E6ECF1;--wa-sel-ink:#10161C}}
:root[data-theme="dark"]{--wa-tile:#2A333D;--wa-tile-ink:#E6ECF1;--wa-sel:#E6ECF1;--wa-sel-ink:#10161C}
.wa-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.wa-game{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:grid;gap:10px;align-content:start;color:var(--ink)}
.wa-game:hover{border-color:var(--muted)}
.wa-game b{font:600 1.15rem/1.2 var(--f-head)}
.wa-game span{color:var(--muted);font-size:.9rem;line-height:1.45}
.wa-game .wa-mini{display:grid;grid-template-columns:repeat(4,14px);gap:3px}
.wa-game .wa-mini i{display:block;width:14px;height:14px;border-radius:3px}
.wa-xmini{display:grid;grid-template-columns:repeat(5,12px);gap:2px}
.wa-xmini i{display:block;width:12px;height:12px;border:1px solid var(--muted);border-radius:2px}
.wa-xmini i.k{background:var(--ink);border-color:var(--ink)}
.wa-sync{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.wa-sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.wa-sync .dot.on{background:var(--good)}
.wa-link{background:none;border:0;padding:0;color:var(--focus);font:500 .86rem var(--f-head);cursor:pointer;text-decoration:underline;text-underline-offset:.2em}
.wa-link:disabled{opacity:.5;cursor:default}
.wa-tip{font-size:.86rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.wa-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wa-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:6px;color:var(--ink)}
.wa-card:hover{border-color:var(--muted)}
.wa-card.hid{border-style:dashed}
.wa-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wa-card b{font:600 1.05rem/1.2 var(--f-head)}
.wa-stars{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
.wa-stars span{display:flex;gap:6px;align-items:center}
.wa-stars em{font-style:normal;color:var(--star);letter-spacing:1px}
.wa-stars em s{text-decoration:none;color:var(--line)}
.wa-st{font:500 .72rem/1 var(--f-head);padding:5px 8px;border-radius:6px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.wa-st.win{background:var(--good-bg);color:var(--good)}
.wa-st.lose{background:var(--bad-bg);color:var(--bad)}
.wa-st.go{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.wa-play{display:grid;gap:14px;max-width:640px;margin:0 auto;width:100%}
.wa-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.wa-head h2{font-size:1.5rem}
.wa-lead{text-align:center;color:var(--muted);font-size:.95rem}
.wa-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wa-tile{appearance:none;border:0;border-radius:10px;background:var(--wa-tile);color:var(--wa-tile-ink);min-height:clamp(66px,18vw,84px);padding:6px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;overflow:hidden;transition:transform .12s ease,background .12s ease;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wa-tile span{display:block;max-width:100%;font:700 1.02rem/1.15 var(--f-body);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:normal;word-break:keep-all;hyphens:none}
.wa-tile:active{transform:scale(.96)}
.wa-tile[aria-pressed="true"]{background:var(--wa-sel);color:var(--wa-sel-ink)}
.wa-tile:disabled{cursor:default}
.wa-bar{grid-column:1/-1;border-radius:10px;min-height:clamp(66px,18vw,84px);display:grid;align-content:center;justify-items:center;gap:2px;padding:8px 10px;text-align:center;color:var(--wa-gink)}
.wa-bar b{font:600 1rem/1.2 var(--f-head);text-transform:uppercase;letter-spacing:.02em}
.wa-bar span{font:400 .95rem/1.3 var(--f-body);text-transform:uppercase}
.wa-bar .rv{font:500 .7rem/1 var(--f-head);text-transform:none;background:rgba(255,255,255,.55);padding:3px 7px;border-radius:999px;margin-top:3px}
.wa-bar .lock{font:500 .82rem/1.2 var(--f-head);text-transform:none;opacity:.75}
.wa-g0{background:var(--wa-g0)}.wa-g1{background:var(--wa-g1)}.wa-g2{background:var(--wa-g2)}.wa-g3{background:var(--wa-g3)}
.wa-lives{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.wa-lives i{width:13px;height:13px;border-radius:50%;background:var(--wa-sel);display:inline-block}
.wa-lives i.x{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.wa-ctrl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.wa-ctrl .btn{border-radius:999px;min-width:96px}
.wa-help{display:grid;gap:8px}
.wa-help h3{font-size:1rem}
.wa-hrow{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 10px}
.wa-hrow>i{border-radius:5px}
.wa-hrow .in{display:grid;gap:8px;min-width:0}
.wa-hbtns{display:flex;gap:6px;flex-wrap:wrap}
.wa-hb{font:500 .8rem/1.1 var(--f-head);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
.wa-hb.on{background:var(--sunk);border-style:solid;cursor:default}
.wa-hb.arm{border-color:var(--bad);color:var(--bad)}
.wa-hb small{font:500 .7rem var(--f-head);color:var(--muted);margin-right:4px}
.wa-hb .v{font:700 .86rem var(--f-body)}
.wa-hb.dead{opacity:.45;cursor:default}
.wa-done{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.wa-done h3{font:600 1.3rem var(--f-head)}
.wa-emo{font-size:1.35rem;line-height:1.15;letter-spacing:2px}
.wa-issues{font-size:.86rem;color:var(--muted);background:var(--surface);border:1px dashed var(--bad);border-radius:12px;padding:10px 14px}
.wa-issues b{font:600 .9rem var(--f-head);color:var(--bad)}
.wa-issues ul{margin:6px 0 0;padding-left:1.2em}
@keyframes waShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes waPop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
.wa-tile.shake{animation:waShake .38s ease}
.wa-bar.pop{animation:waPop .3s ease-out}
@media (max-width:420px){.wa-board{gap:6px}.wa-tile{border-radius:8px}.wa-tile span{font-size:.92rem}}
</style>

function ago(t){if(!t)return'';const d=(Date.now()-t)/1000;if(d<60)return'เมื่อกี้';if(d<3600)return Math.floor(d/60)+' นาทีที่แล้ว';if(d<86400)return Math.floor(d/3600)+' ชม.ที่แล้ว';if(d<7*86400)return Math.floor(d/86400)+' วันที่แล้ว';return dfmt(t)}

/* light markdown: ## heading, - list, 1. list, > tip, **bold**, *italic*, `code`, H_2O, x^2, ->, <=> */
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/__([^_]+?)__/g,'<u>$1</u>')
    .replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<em>$2</em>')
    .replace(/_\{([^}]+)\}/g,'<sub>$1</sub>')
    .replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>')
    .replace(/([A-Za-z)\]])_(\d+)/g,'$1<sub>$2</sub>')
    .replace(/\^(\d*[+\-−]|\d+)/g,'<sup>$1</sup>')
    .replace(/&lt;=&gt;/g,'⇌').replace(/-&gt;/g,'→');
}
/* short text (MCQ choices) that keeps the line breaks typed in the editor */
const mline=s=>inline(esc(s||'')).replace(/\r?\n/g,'<br>');
function md(src){
  const lines=esc(src||'').split(/\r?\n/);let out='',list=null,para=[];
  const fp=()=>{if(para.length){out+='<p>'+inline(para.join('<br>'))+'</p>';para=[]}};
  const fl=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const raw of lines){const l=raw.replace(/\s+$/,'');let m;
    if(!l.trim()){fp();fl();continue}
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){fp();fl();const h=m[1].length+2;out+=`<h${h}>${inline(m[2])}</h${h}>`;continue}
    if((m=l.match(/^\s*[-•]\s+(.*)$/))){fp();if(list!=='ul'){fl();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){fp();if(list!=='ol'){fl();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^&gt;\s?(.*)$/))){fp();fl();out+=`<aside class="tip">${inline(m[1])}</aside>`;continue}
    fl();para.push(l);
  }
  fp();fl();return out;
}

const EXT={};
const XB={state:'off',key:null};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function xbKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function xbUnzip(u){return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function extLoad(loud){
  if(XB.state==='loading'||XB.state==='on')return;const pass=LS.get('xk','');const el=document.getElementById('extData');
  if(!pass||!el||!el.textContent.trim()){if(loud)toast('ยังไม่มีส่วนเสริมในเว็บนี้');return}
  XB.state='loading';
  try{const raw=b64d(el.textContent.trim());const key=await xbKey(pass,raw.slice(0,16));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));
    const code=await xbUnzip(new Uint8Array(pt));XB.key=key;XB.state='on';
    await xbRun(code);if(loud)toast('เปิดส่วนเสริมแล้ว');render();
  }catch(e){XB.state=e&&e.name==='OperationError'?'bad':'off';if(loud)toast(XB.state==='bad'?'รหัสไม่ถูก':'เปิดส่วนเสริมไม่ได้ ลองอัปเดตเบราว์เซอร์');render()}
}
/* run the unlocked code; where eval is blocked by the page's security policy, load it as a script instead */
async function xbRun(code){try{(new Function('H',code))(window.House)}catch(e){if(!(e instanceof EvalError))throw e;
  const u=URL.createObjectURL(new Blob(['(function(H){'+code+'\n})(window.House)'],{type:'text/javascript'}));
  await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=u;sc.onload=ok;sc.onerror=()=>no(new Error('blocked'));document.head.appendChild(sc)})}}
async function xbSeal(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},XB.key,new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64e(out)}
async function xbOpen(str){const raw=b64d(str);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},XB.key,raw.slice(12));return JSON.parse(new TextDecoder().decode(pt))}

/* ---------- learn ---------- */
const isMEQ=q=>q&&(q.type==='meq'||q.type==='open');
const qMax=q=>Math.max(1,Math.round(+q.max||1));
/* quiz sets: each topic (by tid), Midterm and Final each have their own questions (topic 'mid' / 'final'; untagged counts as Final) */
function midTids(l){const tp=l.topics||[];const ix=l.midAfter?tp.findIndex(t=>t.tid&&t.tid===l.midAfter):-1;return ix<0?null:tp.slice(0,ix+1).map(t=>t.tid)}
const isFinalQ=q=>!q.topic||q.topic==='final';
function scopeFilter(l,sc){if(!sc)return()=>true;if(sc==='final')return isFinalQ;if(sc==='mid')return q=>q.topic==='mid';return q=>q.topic===sc}
const scopeCount=(l,sc)=>qsOf(l,'mcq',sc).length+qsOf(l,'meq',sc).length;
/* brother can hide a quiz set (topic tid / 'mid' / 'final') until it has been taught */
const setHidden=(l,sc)=>(l.hidden||[]).includes(sc);
const setOpen=(l,sc)=>S.bro||!setHidden(l,sc);
const lessonScopes=l=>[...(l.topics||[]).map(t=>t.tid).filter(Boolean),'mid','final'];
const openQCount=(l,mode)=>{const keep=new Set();lessonScopes(l).forEach(sc=>{if(setOpen(l,sc))qsOf(l,mode,sc).forEach(i=>keep.add(i))});return keep.size};
function scopeName(l,sc){if(!sc||sc==='final')return 'Final';if(sc==='mid')return 'Midterm';const i=(l.topics||[]).findIndex(t=>t.tid===sc);return i<0?'หัวข้อ':'หัวข้อ '+(i+1)}
function curScope(l){const s0=S.learn.scope;let sc=s0&&s0.lid===l.id?s0.sc:null;
  if(sc&&sc!=='final'&&sc!=='mid'&&!(l.topics||[]).some(t=>t.tid===sc))sc=null;
  if(sc&&!setOpen(l,sc))sc=null;
  if(!sc){sc=lessonScopes(l).find(x=>setOpen(l,x)&&scopeCount(l,x))||null}
  return sc}
const qsOf=(l,mode,sc)=>{const keep=scopeFilter(l,sc);return (l.questions||[]).map((q,i)=>({q,i})).filter(x=>(mode==='both'||(mode==='meq'?isMEQ(x.q):!isMEQ(x.q)))&&keep(x.q)).map(x=>x.i)};
const modeName=m=>m==='meq'?'MEQ':m==='both'?'MCQ + MEQ':'MCQ';
/* every question has a stable key: qid (given when the brother saves), or a text hash for questions saved before keys existed */
function qHash(s){let h=5381;s=String(s||'');for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+(h>>>0).toString(36)}
const qKey=q=>q?(q.qid||qHash(q.q)):'';
/* question keys this kid has already done in this lesson; results saved before keys existed count every question of that set and type that was there at the time */
function doneKeys(l,kid){const set=new Set();if(!l||!kid)return set;
  logs().forEach(e=>{if(e.kind!=='quiz'||e.kid!==kid||e.lessonId!==l.id)return;
    if(Array.isArray(e.qids)){e.qids.forEach(k=>set.add(k));return}
    const keep=scopeFilter(l,e.scope||'final');const m=e.mode||'mcq';
    (l.questions||[]).forEach(q=>{if(keep(q)&&(m==='both'||(m==='meq')===isMEQ(q))&&(+q.born||0)<(+e.at||0))set.add(qKey(q))})});
  return set}
const PICKS=[['new','ข้อใหม่','ยังไม่เคยทำ'],['old','ข้อเดิม','เคยทำแล้ว'],['all','ทั้งหมด','ทุกข้อในชุด']];
const pickName=p=>(PICKS.find(x=>x[0]===p)||PICKS[2])[1];
function pickFilter(l,order,pick,done){if(pick==='all')return order;const qs=l.questions||[];return order.filter(i=>done.has(qKey(qs[i]))===(pick==='old'))}
/* topic sets reveal the answer right after each question; Midterm and Final are taken as a whole exam */
const isPractice=sc=>!!sc&&sc!=='mid'&&sc!=='final';
/* what "start" will actually run: the chosen type and new/old pick, falling back when a choice has no questions */
function quizPlan(l,sc,kid){const st=qset();
  const nm=sc?qsOf(l,'mcq',sc).length:0,ne=sc?qsOf(l,'meq',sc).length:0;
  let mode=st.mode;
  if(mode==='both'&&!(nm&&ne))mode=nm?'mcq':'meq';
  if(mode==='mcq'&&!nm&&ne)mode='meq';if(mode==='meq'&&!ne&&nm)mode='mcq';
  const done=doneKeys(l,kid);const base=sc?qsOf(l,mode,sc):[];
  const cnt={all:base.length,new:pickFilter(l,base,'new',done).length};cnt.old=cnt.all-cnt.new;
  let pick=st.pick||'new';if(!kid)pick='all';else if(!cnt[pick])pick=cnt.new?'new':'all';
  const per=m=>pickFilter(l,sc?qsOf(l,m,sc):[],pick,done).length;
  return {nm,ne,mode,pick,cnt,per,done,order:pickFilter(l,base,pick,done)}}
/* scoring works per question, so a quiz can mix MCQ (1 point each) and MEQ (its own full score) */
const qFull=it=>isMEQ(it)?qMax(it):1;
const rGot=(it,r)=>!r?0:isMEQ(it)?(+r.score||0):(r.ok?1:0);
const qTotals=(q,qs)=>q.order.reduce((a,ix,i)=>{const it=qs[ix]||{};a.got+=rGot(it,q.res[i]);a.full+=qFull(it);return a},{got:0,full:0});
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 6.03 6.6.8-4.88 4.53 1.27 6.54L12 17.27 6.16 20.5l1.27-6.54L2.55 9.43l6.6-.8z"/></svg>';

const fmtTime=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};
const fmtDur=s=>{s=Math.round(s);if(s<60)return s+' วินาที';const m=Math.floor(s/60),r=s%60;return m+' นาที'+(r?' '+r+' วินาที':'')};

  const ck='lesson:'+l.id;const tp=l.topics||[];
  const ks=kids();const sel=S.learn.player&&kidById(S.learn.player)?S.learn.player:null;
  const st=qset();const sc=curScope(l);

    :`<p class="muted">${(l.questions||[]).length&&!S.bro?'ยังไม่มีควิซที่เปิดให้ทำ รอพี่เปิดชุดข้อสอบก่อน':'บทนี้ยังไม่มีโจทย์'+(S.bro?' กดแก้ไขควิซเพื่อเพิ่มโจทย์ MCQ หรือ MEQ แล้วเลือกว่าอยู่ชุดไหน':'')}</p>`}

/* quiz engine: exam style — move freely between questions, change answers, submit once; MEQ is graded after submitting */
function quizNow(){return Date.now()}
function startQuizFor(lessonId,kid,again){
  const l=Store.d.lessons[lessonId];const st=qset();const sc=curScope(l);if(!sc)return;
  const P=quizPlan(l,sc,kid);const order=again?again.order.filter(i=>(l.questions||[])[i]):P.order;if(!order.length)return;
  const now=quizNow();
  S.quiz={lessonId,kid,scope:sc,mode:again?again.mode:P.mode,pick:again?again.pick:P.pick,practice:isPractice(sc),timer:st.timer,qSec:st.qSec,setSec:st.setSec,order,i:0,phase:'answer',
    ans:order.map(()=>({pick:null,text:'',locked:false,revealed:false,timeout:false,left:st.qSec})),scores:{},gi:0,gList:[],confirm:false,res:[],
    startAt:now,paused:0,pauseAt:null,qEnd:st.timer==='q'?now+st.qSec*1000:null,setEnd:st.timer==='set'?now+st.setSec*1000:null,done:false};
  quizLoop();render();window.scrollTo({top:0});
}
/* practice (topic) sets: while the answer of the current question is showing, the whole-set clock stops */
function quizPause(q){if(!q)return;const now=quizNow();const r=q.practice&&q.phase==='answer'&&!q.done&&q.ans[q.i]&&q.ans[q.i].revealed;
  if(r&&q.pauseAt==null)q.pauseAt=now;
  else if(!r&&q.pauseAt!=null){const d=now-q.pauseAt;q.paused+=d;if(q.setEnd)q.setEnd+=d;q.pauseAt=null}}
function quizReveal(q,pos){const a=q.ans[pos];if(!a||a.revealed)return;
  if(pos===q.i){const b=document.getElementById('meqAns');if(b)a.text=b.value;if(q.timer==='q'&&q.qEnd&&!a.locked)a.left=Math.max(0,(q.qEnd-quizNow())/1000);q.qEnd=null}
  a.locked=true;a.revealed=true;quizPause(q)}
const nextOpen=q=>{const n=q.order.length;for(let k=1;k<=n;k++){const p=(q.i+k)%n;if(!q.ans[p].revealed)return p}return -1};
const usedSecs=q=>Math.max(0,((q.endAt||quizNow())-q.startAt-(q.paused||0))/1000);
const qItem=(q,pos)=>{const l=Store.d.lessons[q.lessonId];return l&&(l.questions||[])[q.order[pos]]};
function curQ(){const q=S.quiz;return qItem(q,q.i)}
const isAnswered=(q,pos)=>{const it=qItem(q,pos)||{};const a=q.ans[pos];return isMEQ(it)?!!(a.text||'').trim():a.pick!=null};
function meqPositions(q){return q.order.map((ix,pos)=>pos).filter(pos=>isMEQ(qItem(q,pos)||{}))}
function quizLeave(){const q=S.quiz;if(q.timer==='q'&&q.qEnd&&!q.ans[q.i].locked){q.ans[q.i].left=Math.max(0,(q.qEnd-quizNow())/1000)}q.qEnd=null;const b=document.getElementById('meqAns');if(b&&!q.ans[q.i].locked)q.ans[q.i].text=b.value}
function quizGo(pos){const q=S.quiz;if(pos<0||pos>=q.order.length)return;quizLeave();q.i=pos;q.confirm=false;
  if(q.timer==='q'&&!q.ans[pos].locked)q.qEnd=quizNow()+q.ans[pos].left*1000;quizPause(q);render();window.scrollTo({top:0})}
function vQuiz(){
  const q=S.quiz;const l=Store.d.lessons[q.lessonId];if(!l){S.quiz=null;return vLearn()}
  const k=kidById(q.kid);const n=q.order.length;
  if(q.done)return vQuizResult(q,l,k);
  if(q.phase==='grade')return vQuizGrade(q,l,k);
  const it=curQ();if(!it){q.done=true;return vQuizResult(q,l,k)}
  const a=q.ans[q.i];const isE=isMEQ(it);const lock=a.locked;const prac=q.practice;const rev=prac&&a.revealed;
  const done=q.order.filter((_,p)=>isAnswered(q,p)).length;const nRev=q.order.filter((_,p)=>q.ans[p].revealed).length;const ansd=isAnswered(q,q.i);
  let body='';
  if(!isE){
    const cls=j=>rev?(j===it.answer?'right':a.pick===j?'wrong':''):(a.pick===j?'sel':'');
    body=`<div class="choices">${(it.choices||[]).map((c,j)=>`<button class="choice ${cls(j)}" data-act="pick" data-id="${j}" aria-pressed="${a.pick===j}" ${lock?'disabled':''}><span class="L">${LET[j]}</span><span>${mline(c)}</span></button>`).join('')}</div>
      ${a.pick!=null&&!lock?'<button class="btn sm ghost" data-act="clearPick">ล้างคำตอบข้อนี้</button>':''}`;
    if(rev){const ok=a.pick!=null&&a.pick===it.answer;
      body+=`<div class="explain verdict ${ok?'ok':'no'}" role="status"><b>${ok?'ถูกต้อง':(a.pick==null?(a.timeout?'หมดเวลา':'ไม่ได้ตอบ'):'ยังไม่ถูก')+' · เฉลยคือ '+LET[it.answer]}</b>${it.explain?`<div class="prose">${md(it.explain)}</div>`:''}</div>`}
  }else{
    body=`<label class="field"><span>คำตอบของ ${esc(k?k.code:'')}</span><textarea id="meqAns" class="meq-box" data-input="meq" placeholder="เขียนคำตอบ อธิบายเป็นขั้นตอน" ${lock?'readonly':''}>${esc(a.text)}</textarea></label>`;
    if(rev){const mx=qMax(it);const sc=q.scores[q.i];
      body+=`<div class="explain" role="status"><b>แนวคำตอบ</b>${it.key||it.answer?`<div class="prose">${md(it.key||it.answer||'')}</div>`:'<div class="muted">ยังไม่ได้ใส่แนวคำตอบ</div>'}${it.explain?`<div class="prose">${md(it.explain)}</div>`:''}</div>
      <div class="qgroup"><span class="label">ให้คะแนนข้อนี้ (เต็ม ${mx}) · เทียบกับแนวคำตอบ</span><div class="chips">${Array.from({length:mx+1},(_,s)=>`<button class="chip" data-act="pScore" data-id="${s}" aria-pressed="${sc===s}">${s}</button>`).join('')}</div></div>`}
  }
  const cEnd=q.timer==='q'?(lock?null:q.qEnd):q.timer==='set'?q.setEnd:null;const ref=q.pauseAt!=null?q.pauseAt:quizNow();
  const clock=q.timer==='none'?'':`<span class="clock ${cEnd&&cEnd-ref<=10000?'warn':''}" id="qClock" aria-label="เวลาที่เหลือ">${cEnd?fmtTime((cEnd-ref)/1000):'—'}</span>`;
  const left=n-done;const prog=prac?nRev:done;
  const mark=p=>{if(!prac||!q.ans[p].revealed)return '';const x=qItem(q,p)||{};if(isMEQ(x)){const s=q.scores[p];return s==null?'':s>=qMax(x)?'ok':s>0?'part':'no'}return q.ans[p].pick===x.answer?'ok':'no'};
  const nx=prac?nextOpen(q):-1;const needScore=isE&&rev&&q.scores[q.i]==null;
  const nav=prac?`<div class="qnav"><button class="btn big" data-act="qPrev" ${q.i?'':'disabled'}>← ข้อก่อน</button>${!rev?`<button class="btn big primary" id="qCheckBtn" data-act="qCheck" ${ansd?'':'disabled'}>ตรวจคำตอบ</button>`:nx>=0?`<button class="btn big primary" data-act="qGo" data-id="${nx}" ${needScore?'disabled':''}>ข้อต่อไป →</button>`:`<button class="btn big primary" data-act="qSubmit" ${needScore?'disabled':''}>ดูผล</button>`}</div>
    ${!rev?`<div class="btns">${!ansd?'<button class="btn sm ghost" data-act="qCheck">ไม่รู้ ดูเฉลยเลย</button>':''}${nx>=0&&nx!==q.i?`<button class="btn sm ghost" data-act="qGo" data-id="${nx}">ข้ามไปก่อน</button>`:''}</div>`:needScore?'<p class="muted small">ให้คะแนนข้อนี้ก่อน แล้วค่อยไปข้อต่อไป</p>':''}`
    :`<div class="qnav"><button class="btn big" data-act="qPrev" ${q.i?'':'disabled'}>← ข้อก่อน</button>${q.i+1<n?'<button class="btn big primary" data-act="qNext">ข้อต่อไป →</button>':''}</div>`;
  const endWord=prac?'จบชุดนี้':'ส่งข้อสอบ';
  const sub=prac&&nRev===n?'':`<div class="qsubmit">${q.confirm?`<div class="banner">ยังไม่ได้ตอบ ${left} ข้อ ${prac?'จบเลยไหม':'ส่งเลยไหม'} ข้อที่ไม่ได้ตอบจะนับเป็น 0</div><div class="btns"><button class="btn primary" data-act="qSubmit">ยืนยัน${endWord}</button><button class="btn ghost" data-act="qSubmitCancel">กลับไปทำต่อ</button></div>`
      :`<button class="btn ${!prac&&q.i+1===n?'primary big':''}" data-act="qSubmitAsk">${endWord}${prac?' ดูผล':''}</button><span class="muted small">${left?'ยังไม่ได้ตอบ '+left+' ข้อ':'ตอบครบทุกข้อแล้ว'}</span>`}</div>`;
  return `<section class="quiz">

    <nav class="qmap" aria-label="เลือกข้อ">${q.order.map((_,p)=>`<button type="button" class="${p===q.i?'cur':''} ${isAnswered(q,p)?'done':''} ${q.ans[p].locked?'lock':''} ${mark(p)}" data-act="qGo" data-id="${p}" aria-label="ข้อ ${p+1}${isAnswered(q,p)?' ตอบแล้ว':''}" ${p===q.i?'aria-current="true"':''}>${p+1}</button>`).join('')}</nav>

function quizBuildRes(q){
  q.res=q.order.map((ix,pos)=>{const it=qItem(q,pos)||{};const a=q.ans[pos];
    if(isMEQ(it))return {score:q.scores[pos]||0,text:a.text,timeout:a.timeout,skipped:!(a.text||'').trim()};
    return {ok:a.pick!=null&&a.pick===it.answer,picked:a.pick,timeout:a.timeout&&a.pick==null,skipped:a.pick==null}});
}
function quizSubmit(){
  const q=S.quiz;if(!q||q.phase!=='answer')return;quizLeave();
  if(q.pauseAt!=null){q.paused+=quizNow()-q.pauseAt;q.pauseAt=null}
  q.endAt=quizNow();q.confirm=false;clearInterval(qTick);
  /* MEQ already scored right after its answer (topic sets) is not graded again */
  q.gList=meqPositions(q).filter(p=>q.scores[p]==null);
  if(q.gList.length){q.phase='grade';q.gi=0;render();window.scrollTo({top:0})}else{quizBuildRes(q);finishQuiz()}
}
function vQuizResult(q,l,k){

    :q.fresh?'ครั้งนี้ยังไม่ได้แต้ม ลองทบทวนหัวข้ออีกรอบ':q.old?'ทุกข้อในรอบนี้เคยทำแล้ว เป็นรอบฝึก ไม่นับแต้มเพิ่ม':'ไม่ได้ตอบข้อไหนเลย ยังไม่ได้แต้ม';

      const mark=e?`${r.score!=null?r.score:0}/${qMax(it)}`:(r.ok?'ถูก':'ผิด');
      const detail=!e&&!r.ok?`<span class="small muted">${r.picked!=null?'ตอบ '+LET[r.picked]+' · ':''}เฉลย ${LET[it.answer]}</span>`:'';
      return `<li class="${ok?'ok':'no'}"><span class="rv">${mark}</span><span class="rq">${i+1}. ${esc(plain(it.q).slice(0,80))}${plain(it.q).length>80?'…':''} ${detail}</span>${r.timeout?'<span class="tag">หมดเวลา</span>':r.skipped?'<span class="tag">ไม่ได้ตอบ</span>':''}</li>`}).join('')}</ol>

let qTick=null;
function quizLoop(){clearInterval(qTick);if(S.quiz&&S.quiz.timer==='none')return;qTick=setInterval(()=>{
  const q=S.quiz;if(!q||q.done||q.phase!=='answer'){clearInterval(qTick);return}
  quizPause(q);const now=quizNow();const ref=q.pauseAt!=null?q.pauseAt:now;const el=document.getElementById('qClock');
  const end=q.timer==='q'?(q.ans[q.i].locked?null:q.qEnd):q.timer==='set'?q.setEnd:null;
  if(el){if(end){const left=(end-ref)/1000;el.textContent=fmtTime(left);el.classList.toggle('warn',left<=10)}else{el.textContent='—';el.classList.remove('warn')}}
  if(end&&q.pauseAt==null&&now>=end)quizTimeout();
},250)}
function quizTimeout(){
  const q=S.quiz;if(!q)return;
  if(q.timer==='set'){quizSubmit();return}
  const a=q.ans[q.i];
  /* topic sets: time up shows this question's answer; Midterm/Final: lock it and move on */
  if(q.practice){a.timeout=true;quizReveal(q,q.i);a.left=0;render();return}
  const b=document.getElementById('meqAns');if(b)a.text=b.value;
  a.locked=true;a.timeout=true;a.left=0;q.qEnd=null;
  const next=q.order.findIndex((_,p)=>p>q.i&&!q.ans[p].locked);
  if(next>=0)quizGo(next);else{const any=q.order.findIndex((_,p)=>!q.ans[p].locked);if(any>=0)quizGo(any);else quizSubmit()}
}
/* points come only from questions this kid answers for the first time; questions done before are practice */
async function finishQuiz(){
  const q=S.quiz;const l=Store.d.lessons[q.lessonId];const qs=l.questions||[];
  clearInterval(qTick);q.endAt=q.endAt||quizNow();
  const {got,full}=qTotals(q,qs);
  if(!q.saved){q.saved=true;
    const prior=doneKeys(l,q.kid);let pts=0,fresh=0,old=0;const qids=[];
    q.order.forEach((ix,pos)=>{const it=qs[ix];const r=q.res[pos];if(!it||!r)return;const key=qKey(it);
      if(prior.has(key)){old++;if(!r.skipped)qids.push(key);return}
      if(r.skipped)return;fresh++;pts+=rGot(it,r);qids.push(key)});
    Object.assign(q,{pts,fresh,old,done:true});
    await Store.put('log',uid(),{kid:q.kid,kind:'quiz',mode:q.mode,pick:q.pick||'all',scope:q.scope||'final',scopeName:scopeName(l,q.scope),lessonId:l.id,title:l.title,subject:l.subject,score:got,total:full,perfect:got===full&&full>0,pts,qids,secs:Math.round(usedSecs(q)),timer:q.timer,at:Date.now()});}
  q.done=true;
  render();window.scrollTo({top:0});
}

function fmtPreview(){const pv=$('#fmtPrev');if(!pv)return;const el=FMT.el;
  if(!el||!document.body.contains(el)){pv.innerHTML='<span class="muted">เลือกข้อความในช่องที่พิมพ์ แล้วกดปุ่มจัดรูปแบบ</span>';return}
