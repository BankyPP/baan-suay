function parseBulk(txt){
  const out=[];
  txt.split(/\n\s*\n/).forEach(block=>{
    const lines=block.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
    const q=blankQ('mcq');q.choices=[];q.answer=-1;let ans='',max=0;
    lines.forEach((ln,idx)=>{let m;
      if((m=ln.match(/^(\*)?\s*([A-Ha-h])[).]\s+(.*)$/))&&idx>0){if(m[1])q.answer=q.choices.length;q.choices.push(m[3].replace(/\s*\*$/,''));if(/\*$/.test(m[3]))q.answer=q.choices.length-1;return}
      if((m=ln.match(/^(ANS|Ans|ans|ตอบ|เฉลย|แนวคำตอบ)\s*[:：]\s*(.*)$/))){ans+=(ans?'\n':'')+m[2];return}
      if((m=ln.match(/^(คะแนน|คะแนนเต็ม|max|Max)\s*[:：]\s*(\d+)/))){max=+m[2];return}
      if((m=ln.match(/^(E|อธิบาย|เหตุผล)\s*[:：]\s*(.*)$/))){q.explain=m[2];return}
      if(ans&&!q.choices.length){ans+='\n'+ln;return}
      q.q+=(q.q?'\n':'')+ln.replace(/^(Q\s*[:：]|\d+\s*[.)])\s*/,'');
    });
    if(q.choices.length>=2){if(q.answer<0){const L=ans.trim().toUpperCase().charAt(0);const ix=LET.indexOf(L);q.answer=ix>=0&&ix<q.choices.length?ix:0}}
    else{q.type='meq';q.choices=['','','',''];q.answer=0;q.key=ans;q.max=max||2}
    if(q.q)out.push(q);
  });
  return out;
}
async function saveLesson(){
  syncDraft();const d=S.draft;
  if(!d.title){toast('ใส่ชื่อบทก่อนบันทึก');return}
  const topics=d.topics.filter(t=>t.name.trim()||t.goals.trim()).map(t=>({tid:t.tid,name:t.name.trim(),stars:t.stars||0,goals:t.goals.split('\n').map(s=>s.replace(/^\s*[-•]\s*/,'').trim()).filter(Boolean)}));
  const tids=topics.map(t=>t.tid);const okTopic=x=>x==='mid'||x==='final'||tids.includes(x)?x:'final';
  /* each question keeps a key and the time it was added, so the site knows which ones each kid has already done */
  const seen=new Set(),now=Date.now();
  const tag=q=>{let qid=q.qid&&!seen.has(q.qid)?q.qid:'q'+uid();seen.add(qid);return {qid,born:q.born!=null?q.born:now}};
  const qs=d.questions.filter(q=>q.q.trim()).map(q=>{const t=tag(q);const ex=(q.explain||'').trim();
    if(q.type==='meq')return {type:'meq',topic:okTopic(q.topic),q:q.q.trim(),key:(q.key||'').trim(),max:Math.max(1,+q.max||1),explain:ex,...t};
    const kept=q.choices.map((c,j)=>({c:c.trim(),j})).filter(x=>x.c);
    return {type:'mcq',topic:okTopic(q.topic),q:q.q.trim(),choices:kept.map(x=>x.c),answer:kept.findIndex(x=>x.j===q.answer),explain:ex,...t}});
  const bad=qs.find(q=>q.type==='mcq'&&(q.choices.length<2||q.answer<0));
  if(bad){toast('มี MCQ ที่ตัวเลือกไม่ครบ หรือยังไม่ได้เลือกคำตอบที่ถูก');return}
  const id=d.id||uid();const old=d.id&&Store.d.lessons[d.id];
  await Store.put('lessons',id,{subject:d.subject,title:d.title,levels:d.levels,topics,midAfter:tids.includes(d.midAfter)?d.midAfter:'',hidden:(d.hidden||[]).filter(x=>x==='mid'||x==='final'||tids.includes(x)),content:d.content,questions:qs,example:d.example&&!!old,at:old&&old.at||Date.now()});
  closeSheet();S.learn.open=id;toast('บันทึกบทเรียนแล้ว');render();
}

/* Flip 7: running score per player, listed by score, several numbers per entry, x2, +15 */
const F7_TARGETS=[100,150,200,300];
const F7_X2=/[x×*]\s*2(?!\d)/gi;
const f7key=p=>p.id||('g:'+p.name);
const f7Color=p=>{const k=p.id&&kidById(p.id);return okColor(k?k.color:p.color)};
function f7Parse(raw){
  let s=String(raw||'').replace(/[๐-๙]/g,d=>String(d.charCodeAt(0)-0x0E50)).replace(/[−–—]/g,'-');let x2=false;
  s=s.replace(F7_X2,()=>{x2=true;return ' '}).replace(/-\s+(?=\d)/g,'-');
  const nums=(s.match(/-?\d+/g)||[]).map(Number);
  return {nums,base:nums.reduce((a,b)=>a+b,0),x2};
}
const f7Tot=p=>(p.entries||[]).reduce((a,e)=>a+(+e.n||0),0);
const f7Fmt=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
function f7(){
  if(!S.flip)S.flip={phase:'setup',players:[],target:200,cur:0,hist:[],draft:{},x2:{},b15:{},mods:{},award:2,saved:false};
  const f=S.flip;f.draft=f.draft||{};f.x2=f.x2||{};f.b15=f.b15||{};f.mods=f.mods||{};f.hist=f.hist||[];f.target=+f.target||200;
  f.players.forEach(p=>{p.entries=p.entries||[]});if(!(f.cur>=0&&f.cur<f.players.length))f.cur=0;return f;
}
function f7Snap(f,label){f.hist.push({players:clone(f.players),cur:f.cur,label});if(f.hist.length>80)f.hist.shift()}
/* official order: number cards, then x2 on numbers only, then +2..+10 cards and the +15 bonus (never doubled) */
const F7_MODS=[2,4,6,8,10];
const f7Sum=a=>(a||[]).reduce((x,y)=>x+y,0);
const f7Score=(base,x2,mods,b15)=>base*(x2?2:1)+f7Sum(mods)+(b15?15:0);
function f7PrevHTML(f,p){
  const k=f7key(p);const r=f7Parse(f.draft[k]);const b15=!!f.b15[k];const mods=f.mods[k]||[];const x2=r.x2||!!f.x2[k];
  if(!r.nums.length&&!mods.length&&!b15)return x2?'×2 เปิดอยู่ พิมพ์แต้มแล้วกด Enter':'';
  const parts=[];
  if(r.nums.length){const many=r.nums.length>1;let ex=many?r.nums.map((n,i)=>i===0?String(n).replace('-','−'):(n<0?'− '+(-n):'+ '+n)).join(' '):String(r.base).replace('-','−');
    if(x2)ex=(many?'('+ex+')':ex)+' × 2';parts.push(ex)}
  mods.forEach(m=>parts.push(String(m)));if(b15)parts.push('15');
  const n=f7Score(r.base,x2&&r.nums.length>0,mods,b15);
  const show=parts.length>1||(x2&&r.nums.length);
  return (show?parts.join(' + ')+' = ':'')+`<b>${f7Fmt(n)}</b> → รวม ${f7Tot(p)+n}${!r.nums.length?' · กด Enter ได้เลย':''}`;
}

/* Poker (No-Limit Texas Hold'em): only chips and betting. Cards are dealt for real on the table */
const PB_STREETS=['ก่อน Flop','Flop','Turn','River'];
const PB_DEAL=['<b>แจกไพ่คนละ 2 ใบ</b> แล้วเริ่มเดิมพัน','<b>เปิดไพ่กลาง 3 ใบ</b> แล้วเดิมพันรอบ Flop','<b>เปิดไพ่กลางใบที่ 4</b> แล้วเดิมพันรอบ Turn','<b>เปิดไพ่กลางใบที่ 5</b> แล้วเดิมพันรอบสุดท้าย'];
const PB_CHIPS=[500,1000,2000,5000];
const PB_BLINDS=[[5,10],[10,20],[25,50],[50,100],[100,200]];
const pbN=n=>Math.round(+n||0).toLocaleString('en-US');
const pbInt=v=>{const s=String(v==null?'':v).replace(/[๐-๙]/g,d=>String(d.charCodeAt(0)-0x0E50)).replace(/[,\s]/g,'');if(!/^\d+$/.test(s))return NaN;return parseInt(s,10)};
function pb(){
  if(!S.poker)S.poker={phase:'setup',players:[],start:1000,sb:10,bb:20,dealer:0,fixD:true,hands:0,h:null,last:null,hist:[],ui:{},award:2,saved:false};
  const P=S.poker;P.hist=P.hist||[];P.ui=P.ui||{};P.players.forEach(p=>{if(!(p.chips>=0))p.chips=0;if(!(p.buyin>=0))p.buyin=p.chips});return P;
}
function pbSnap(P,label){P.hist.push({label,s:clone({players:P.players,h:P.h,phase:P.phase,dealer:P.dealer,fixD:P.fixD,hands:P.hands,last:P.last,sb:P.sb,bb:P.bb})});if(P.hist.length>60)P.hist.shift()}
const pbHas=(P,i)=>!!(P.players[i]&&P.players[i].chips>0);
function pbNext(P,from,ok){const n=P.players.length;for(let k=1;k<=n;k++){const j=((from+k)%n+n)%n;if(ok(j))return j}return -1}
/* who is dealer / small blind / big blind for the coming hand. Heads-up: the dealer posts the small blind */
function pbRoles(P){
  const n=P.players.length;const ok=i=>pbHas(P,i);const cnt=P.players.filter((p,i)=>ok(i)).length;if(cnt<2)return null;
  let d=P.dealer;if(!(d>=0&&d<n))d=0;d=P.fixD?pbNext(P,d-1,ok):pbNext(P,d,ok);
  const sb=cnt===2?d:pbNext(P,d,ok);const bb=pbNext(P,sb,ok);return {d,sb,bb,heads:cnt===2};
}
const pbPot=h=>h.ps.reduce((a,s)=>a+s.tot,0);
const pbLive=h=>h.ps.map((s,i)=>i).filter(i=>h.ps[i].in&&!h.ps[i].fold);
const pbActor=(h,i)=>{const s=h.ps[i];return !!(s&&s.in&&!s.fold&&!s.allin)};
function pbMove(P,i,amt){const h=P.h,s=h.ps[i],p=P.players[i];const a=Math.max(0,Math.min(Math.floor(amt),p.chips));p.chips-=a;s.bet+=a;s.tot+=a;if(p.chips===0)s.allin=true;return a}
function pbCanRaise(P,i){const h=P.h,s=h.ps[i],p=P.players[i];if(!s||!p)return false;const need=Math.max(0,h.curBet-s.bet);
  return !s.lock&&p.chips>need&&pbLive(h).some(j=>j!==i&&!h.ps[j].allin)}
function pbMinTo(P,i){const h=P.h,s=h.ps[i],p=P.players[i];const max=s.bet+p.chips;const mi=h.curBet+1;const df=h.curBet+Math.max(1,P.bb);return {min:Math.min(mi,max),max,def:Math.min(Math.max(df,mi),max)}}
/* a bet nobody matched goes back to whoever made it */
function pbRefund(P){
  const h=P.h;const idx=h.ps.map((s,i)=>i).filter(i=>h.ps[i].bet>0).sort((a,b)=>h.ps[b].bet-h.ps[a].bet);if(!idx.length)return;
  const top=h.ps[idx[0]].bet,sec=idx.length>1?h.ps[idx[1]].bet:0;if(top<=sec)return;
  const i=idx[0],x=top-sec,s=h.ps[i];s.bet-=x;s.tot-=x;P.players[i].chips+=x;if(P.players[i].chips>0)s.allin=false;
  h.log.push(`คืน ${pbN(x)} ที่ไม่มีใครตามให้ ${playerName(P.players[i])}`);
}
function pbStartHand(P){
  const r=pbRoles(P);if(!r)return false;
  pbSnap(P,'เริ่มมือที่ '+(P.hands+1));P.dealer=r.d;P.fixD=false;
  P.h={no:P.hands+1,d:r.d,sbI:r.sb,bbI:r.bb,street:0,curBet:P.bb,minR:Math.max(1,P.bb),cur:-1,runout:false,log:[],
    ps:P.players.map((p,i)=>({in:pbHas(P,i),bet:0,tot:0,fold:false,allin:false,acted:false,lock:false,say:''}))};
  const h=P.h;const a=pbMove(P,r.sb,P.sb),b=pbMove(P,r.bb,P.bb);
  h.log.push(`${playerName(P.players[r.sb])} ลง Small blind ${pbN(a)}${h.ps[r.sb].allin?' (All-in)':''}`,`${playerName(P.players[r.bb])} ลง Big blind ${pbN(b)}${h.ps[r.bb].allin?' (All-in)':''}`);
  P.phase='hand';P.ui={};
  pbAdvance(P,r.heads?r.sb:r.bb+1);return true;

/* after every action: hand over? betting round over? otherwise whose turn (searching from seat `from`) */
function pbAdvance(P,from){
  const h=P.h;const n=P.players.length;const live=pbLive(h);
  if(live.length<=1){pbFoldWin(P,live[0]);return}
  const actors=live.filter(i=>!h.ps[i].allin);
  const done=!actors.length||(actors.length===1&&h.ps[actors[0]].bet>=h.curBet)||actors.every(i=>h.ps[i].acted&&h.ps[i].bet===h.curBet);
  if(!done){
    for(let k=0;k<n;k++){const j=((from+k)%n+n)%n;const s=h.ps[j];if(pbActor(h,j)&&(!s.acted||s.bet<h.curBet)){h.cur=j;return}}
    h.cur=actors[0];return;
  }
  pbRefund(P);h.ps.forEach(s=>{s.bet=0;s.acted=false;s.lock=false;if(!s.fold&&!s.allin)s.say=''});h.curBet=0;h.minR=Math.max(1,P.bb);
  const still=pbLive(h).filter(i=>!h.ps[i].allin);
  if(h.street>=3||still.length<=1){h.runout=h.street<3;h.cur=-1;P.phase='show';P.ui={win:{}};pbAutoWin(P);return}
  h.street++;h.log.push('— '+PB_STREETS[h.street]+' —');
  pbAdvance(P,h.d+1);
}
function pbNet(h,won){const net={};h.ps.forEach((s,i)=>{if(s.in){const v=(won[i]||0)-s.tot;if(v)net[i]=v}});return net}
function pbFoldWin(P,w){
  const h=P.h;pbRefund(P);const pot=pbPot(h);P.players[w].chips+=pot;
  P.last={no:h.no,fold:true,pots:[{amt:pot,win:[w],each:[pot]}],net:pbNet(h,{[w]:pot}),log:h.log.concat(`${playerName(P.players[w])} ได้ ${pbN(pot)} เพราะคนอื่น Fold หมด`)};
  P.hands++;P.h=null;P.phase='ready';P.ui={};
}
/* main pot and side pots: one layer per all-in level; folded chips stay in, but only live players can win */
function pbPots(h){
  const live=pbLive(h);const lv=[...new Set(live.map(i=>h.ps[i].tot))].filter(v=>v>0).sort((a,b)=>a-b);
  const pots=[];let prev=0;
  for(const L of lv){let amt=0;h.ps.forEach(s=>{amt+=Math.max(0,Math.min(s.tot,L)-prev)});const el=live.filter(i=>h.ps[i].tot>=L);
    if(amt>0){const last=pots[pots.length-1];if(last&&last.el.join()===el.join())last.amt+=amt;else pots.push({amt,el})}prev=L}
  const rest=pbPot(h)-pots.reduce((a,p)=>a+p.amt,0);if(rest>0){if(pots.length)pots[pots.length-1].amt+=rest;else pots.push({amt:rest,el:live})}
  return pots;
}
function pbAutoWin(P){const h=P.h;if(!h)return;P.ui.win=P.ui.win||{};pbPots(h).forEach((pt,k)=>{if(pt.el.length===1)P.ui.win[k]=[pt.el[0]]})}
/* split pots: equal shares, odd chips go to the winner sitting closest to the dealer's left */
function pbPay(P){
  const h=P.h;const n=P.players.length;const pots=pbPots(h);const w=P.ui.win||{};
  if(!pots.every((pt,k)=>(w[k]||[]).some(i=>pt.el.includes(i)))){toast('เลือกคนชนะให้ครบทุกกองก่อน');return}
  pbSnap(P,'จ่ายชิปมือที่ '+h.no);
  const won={};const out=[];const lg=h.log.slice();
  pots.forEach((pt,k)=>{const ws=(w[k]||[]).filter(i=>pt.el.includes(i)).sort((a,b)=>((a-h.d-1+n)%n)-((b-h.d-1+n)%n));
    const share=Math.floor(pt.amt/ws.length);let rem=pt.amt-share*ws.length;const each=ws.map(()=>share+(rem-->0?1:0));
    ws.forEach((i,x)=>{P.players[i].chips+=each[x];won[i]=(won[i]||0)+each[x]});out.push({amt:pt.amt,win:ws,each});
    lg.push(`${ws.map(i=>playerName(P.players[i])).join(' & ')} ได้${pots.length>1?(k?' กองย่อย '+k:' กองหลัก'):''} ${pbN(pt.amt)}`)});
  P.last={no:h.no,fold:false,pots:out,net:pbNet(h,won),log:lg};P.hands++;P.h=null;P.phase='ready';P.ui={};
}
const PB_SAY={fold:'Fold',check:'Check',call:'Call',raise:'Raise'};
function pbAct(P,kind,to){
  const h=P.h;if(!h||P.phase!=='hand'||h.cur<0)return;
  const i=h.cur,s=h.ps[i],p=P.players[i];const nm=playerName(p);const need=Math.max(0,h.curBet-s.bet);
  if(kind==='allin'){if(pbCanRaise(P,i)&&s.bet+p.chips>h.curBet){kind='raise';to=s.bet+p.chips}else kind='call'}
  if(kind==='check'&&need>0)return;
  if(kind==='raise'){if(!pbCanRaise(P,i))return;const r=pbMinTo(P,i);to=Math.floor(+to);
    if(!(to>=r.min&&to<=r.max)){toast(to<r.min?`ต้องมากกว่า ${pbN(h.curBet)}`:`มีชิปให้ลงได้ถึง ${pbN(r.max)}`);return}}
  pbSnap(P,nm+' '+(kind==='raise'&&h.curBet===0?'Bet':PB_SAY[kind]));
  if(kind==='fold'){s.fold=true;s.say='Fold';h.log.push(nm+' Fold')}
  else if(kind==='check'){s.say='Check';h.log.push(nm+' Check')}
  else if(kind==='call'){const a=pbMove(P,i,need);s.say=s.allin?'All-in':'Call '+pbN(a);h.log.push(`${nm} Call ${pbN(a)}${s.allin?' (All-in)':''}`)}

document.addEventListener('keydown',e=>{
  if(!(S.tab==='tools'&&S.tool==='poker'&&S.poker)||!$('#sheet').hidden||e.isComposing)return;
  const P=S.poker,a=document.activeElement;
  if(a&&a.id==='pbRzIn'){if(e.key==='Enter'){e.preventDefault();ACT.pbRaiseGo()}else if(e.key==='Escape'){e.preventDefault();pbCloseRz(P)}return}
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&(e.key==='z'||e.key==='Z'||e.code==='KeyZ')){e.preventDefault();ACT.pbUndo();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  /* a button that has keyboard focus keeps its own Enter/Space */
  if((e.key==='Enter'||e.key===' ')&&a&&a.tagName==='BUTTON')return;
  const go=f=>{e.preventDefault();f()};const k=e.code;const ent=e.key==='Enter';
  const h=P.h;
  if(P.phase==='hand'&&h){if(h.cur<0)return;
    const i=h.cur,s=h.ps[i];const need=Math.max(0,h.curBet-s.bet);const can=pbCanRaise(P,i);const act=id=>go(()=>ACT.pbDo({dataset:{id}}));
    if(k==='KeyF')act('fold');
    else if(k==='KeyC')act(need>0?'call':'check');
    else if(k==='KeyK'&&need===0)act('check');
    else if((k==='KeyB'||k==='KeyR')&&can)go(()=>pbOpenRz(P));
    else if(k==='KeyA'&&can)act('allin');
    else if(ent&&P.ui.open)go(()=>pbOpenRz(P));
    else if(e.key==='Escape'&&(P.ui.open||P.ui.allin))go(()=>{P.ui.allin=false;pbCloseRz(P)});
    return}
  const dg=/^(Digit|Numpad)([0-9])$/.exec(k||'');
  if(P.phase==='show'&&h&&dg){const b=document.querySelectorAll('.pb-pick')[(+dg[2]+9)%10];if(b)go(()=>b.click());return}
  if(P.phase==='show'&&h){if(ent){const w=P.ui.win||{};if(pbPots(h).every((pt,j)=>(w[j]||[]).length))go(()=>ACT.pbPay())}return}
  if(P.phase==='end')return;
  if(P.phase==='ready'&&P.players.length){if((ent||k==='KeyN')&&pbRoles(P))go(()=>ACT.pbDeal());return}
  if(ent&&P.players.length>=2)go(()=>ACT.pbGo());
});

  const el=document.getElementById('pbRzIn');if(el){el.focus();el.select()}}

const tbMeta=()=>Store.d.meta.taboo||{};
function tbCats(){const m=tbMeta();return TB_CATS.map(c=>({id:c.id,name:c.name,w:c.w})).concat((m.cats||[]).filter(c=>c&&c.id).map(c=>({id:c.id,name:c.name||'หมวดของบ้าน',w:[],custom:true})))}
function tbWords(cid){const c=tbCats().find(x=>x.id===cid);if(!c)return[];const m=tbMeta();const del=new Set((m.del&&m.del[cid])||[]);const seen=new Set();const out=[];
  for(const w of c.w.concat((m.add&&m.add[cid])||[])){const t=String(w||'').trim();if(!t||del.has(t)||seen.has(t))continue;seen.add(t);out.push(t)}return out}
function tbPool(cats){const s=new Set();(cats||[]).forEach(c=>tbWords(c).forEach(w=>s.add(w)));return Array.from(s)}

const TB_ME=(()=>{let v=LS.get('tbMe',null);if(!v){v='c'+uid();LS.set('tbMe',v)}return v})();
function tbInit(){if(!S.tb)S.tb={code:LS.get('tbRoom',null),room:null,loaded:false,sub:null,subCode:null,hide:false,reveal:0,seenRound:0,outs:null}}
function tbWho(){const w=LS.get('tbWho',null);if(!w)return null;
  if(w.kid){const k=kidById(w.kid);return k?{kid:k.id,name:k.code,code:k.code,color:okColor(k.color)}:null}
  if(w.name){const n=String(w.name).trim().slice(0,20);if(!n)return null;let h=0;for(const ch of n)h=(h*31+ch.codePointAt(0))>>>0;return {kid:'',name:n,code:Array.from(n).slice(0,2).join(''),color:SWATCHES[h%SWATCHES.length]}}
  return null}
const tbLimitPref=()=>{const v=LS.get('tbLimit',180);return Number.isFinite(+v)&&+v>=0?+v:180};
const tbDigits=v=>String(v||'').replace(/[๐-๙]/g,d=>String(d.charCodeAt(0)-0x0E50)).replace(/\D/g,'');
/* a typed name counts even if "ใช้ชื่อนี้" was not pressed; with no name, point at the name box */

  toast('เลือกชื่อก่อน แตะตัวหมากหรือพิมพ์ชื่อด้านบน');const b=document.getElementById('tbWhoBox');if(b){b.scrollIntoView({behavior:'smooth',block:'center'});b.classList.remove('tb-flash');void b.offsetWidth;b.classList.add('tb-flash')}return null}
const tbTimeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>{const e=new Error('timeout');e.code='timeout';j(e)},ms))]);
const tbPawn=(p,cls)=>playerPawn({id:p.kid||'',name:p.name||'?',code:p.code||String(p.name||'?').slice(0,2),color:p.color},cls);
const tbPlayers=d=>Object.keys((d&&d.players)||{}).map(id=>Object.assign({},d.players[id],{pid:id})).filter(p=>!p.left).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)||a.pid.localeCompare(b.pid));
const tbIn=d=>tbPlayers(d).filter(p=>p.inGame);
const tbAlive=d=>tbIn(d).filter(p=>!p.out);
const tbMe=d=>(d&&d.players&&d.players[TB_ME])||null;
const tbHostOk=d=>!!(d&&d.players&&d.players[d.host]&&!d.players[d.host].left);
const tbIsHost=d=>!!d&&(d.host===TB_ME||(!tbHostOk(d)&&(tbPlayers(d)[0]||{}).pid===TB_ME));
/* ผู้ดำเนินเกม (game master): optional, does not play, runs the round from a control panel */
const tbNarr=d=>{const n=d&&d.narrator;return n&&d.players&&d.players[n]&&!d.players[n].left?n:''};
const tbIsNarr=d=>!!tbNarr(d)&&tbNarr(d)===TB_ME;
/* who runs the game: the game master if there is one, otherwise the room host */
const tbCtl=d=>!!d&&(tbNarr(d)?tbIsNarr(d):tbIsHost(d));
const tbCtlName=d=>tbNarr(d)?'ผู้ดำเนินเกม':'หัวห้อง';
const tbCanSet=d=>!!d&&(tbIsHost(d)||tbIsNarr(d));
/* time limit: 0 = no limit, otherwise seconds; the clock counts down and pauses with the game */
const TB_LIMITS=[[0,'ไม่จับเวลา'],[180,'3 นาที'],[300,'5 นาที']];
const tbMMSS=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tbUsed(d){if(!d||!d.startedAt)return 0;const end=d.status!=='play'&&d.endedAt?d.endedAt:(d.paused&&d.pausedAt?d.pausedAt:Date.now());
  return Math.max(0,(end-d.startedAt-(+d.pausedTotal||0))/1000)}
const tbLeft=d=>(+d.limit||0)-tbUsed(d);
function tbClock(d){if(!d)return '0:00';if(+d.limit>0&&d.status==='play')return 'เหลือ '+tbMMSS(tbLeft(d));return tbMMSS(Math.floor(tbUsed(d)))}
const tbLimitName=v=>{v=Math.round(+v||0);const p=TB_LIMITS.find(x=>x[0]===v);if(p)return p[1];const m=Math.floor(v/60),r=v%60;return (m?m+' นาที':'')+(m&&r?' ':'')+(r?r+' วินาที':'')};
function tbParseMin(v){const n=parseFloat(String(v||'').replace(/[๐-๙]/g,d=>String(d.charCodeAt(0)-0x0E50)).replace(',','.'));if(!(n>0))return null;return Math.max(15,Math.min(3600,Math.round(n*60)))}
const tbLimitPick=(cur,act,dis,inId)=>{const custom=+cur>0&&!TB_LIMITS.some(x=>x[0]===+cur);
  return `<div class="chips">${TB_LIMITS.map(([v,n])=>`<button class="chip" data-act="${act}" data-id="${v}" aria-pressed="${+cur===v}" ${dis?'disabled':''}>${n}</button>`).join('')}
    ${dis?(custom?`<span class="chip" aria-pressed="true">${tbLimitName(cur)}</span>`:''):`<label class="mini"><span>หรือพิมพ์</span><input type="text" inputmode="decimal" id="${inId}" value="${custom?esc(String(+(cur/60).toFixed(2))):''}" placeholder="เช่น 4" aria-label="ตั้งเวลาเอง เป็นนาที"><span>นาที</span></label>`}</div>`};

/* the room lives in one document: rooms/<รหัส> */
const tbRef=c=>Store.db.collection('rooms').doc(c);
function tbFail(e){const c=String((e&&(e.code||e.name||e.message))||'');try{console.warn('taboo',e)}catch(_){}
  toast(/permission/i.test(c)?'ห้องเกมยังเปิดไม่ได้ ให้พี่เพิ่ม Rules ของ rooms ใน Firebase ก่อน':/timeout/i.test(c)?'เชื่อมต่อช้ามาก ตรวจอินเทอร์เน็ตแล้วลองใหม่':'เชื่อมต่อห้องไม่ได้ ลองใหม่อีกครั้ง'+(c?' ('+c+')':''))}
async function tbPatch(o){const c=S.tb&&S.tb.code;if(!c||!Store.db)return false;
  try{if(Store.kind==='firebase')await tbRef(c).set(o,{merge:true});else await tbRef(c).update(o);return true}catch(e){tbFail(e);return false}}
function tbSub(){tbInit();const c=S.tb.code;if(!c||!Store.db||S.tb.subCode===c)return;tbUnsub();S.tb.subCode=c;S.tb.loaded=false;
  try{S.tb.sub=tbRef(c).onSnapshot(s=>tbOnRoom(s&&s.exists?s.data():null),e=>{S.tb.sub=null;S.tb.subCode=null;tbFail(e);tbExit()})}catch(e){S.tb.subCode=null;tbFail(e)}}
function tbUnsub(){if(S.tb&&S.tb.sub){try{S.tb.sub()}catch(e){}}if(S.tb){S.tb.sub=null;S.tb.subCode=null}}
function tbExit(msg){tbUnsub();Object.assign(S.tb,{code:null,room:null,loaded:false,hide:false,reveal:0,seenRound:0,outs:null});LS.set('tbRoom',null);tbWake(false);if(msg)toast(msg);render()}
function tbOnRoom(d){
  const first=!S.tb.loaded;S.tb.loaded=true;
  if(!d){tbExit(first?'ไม่เจอห้องนี้แล้ว':'ห้องนี้ปิดไปแล้ว');return}
  const me=tbMe(d);
  if(!me||me.left){tbExit(first?'':'คุณออกจากห้องแล้ว');return}
  if(d.status==='play'&&me.inGame&&d.round!==S.tb.seenRound){S.tb.seenRound=d.round;S.tb.hide=false;S.tb.reveal=d.mode==='circle'?Date.now()+3200:0}
  /* someone was just caught: beep, and buzz the phone of whoever it was */
  const outs={};tbIn(d).forEach(p=>{if(p.out)outs[p.pid]=p.outAt||1});
  if(S.tb.outs&&d.round===S.tb.outsRound){const fresh=Object.keys(outs).filter(id=>!S.tb.outs[id]);if(fresh.length)tbBeep(fresh.includes(TB_ME))}
  S.tb.outs=outs;S.tb.outsRound=d.round;
  S.tb.room=d;
  /* the game master (or host) moves the round on: last one standing → guessing, every guess judged → round summary */
  if(d.status==='play'&&!d.paused&&tbCtl(d)&&tbIn(d).length>=2&&tbAlive(d).length<=1)tbRoundOver('last');
  if(d.status==='guess'&&tbCtl(d)&&tbGuessDone(d)){const r=d.round;setTimeout(()=>{const x=S.tb.room;if(x&&x.status==='guess'&&x.round===r&&tbGuessDone(x))tbCloseRound()},1200)}
  changed();
}
let tbLock=null;
async function tbWake(on){try{if(on&&!tbLock&&navigator.wakeLock&&document.visibilityState==='visible'){tbLock=await navigator.wakeLock.request('screen');tbLock.addEventListener('release',()=>{tbLock=null})}
  else if(!on&&tbLock){const l=tbLock;tbLock=null;await l.release()}}catch(e){}}
const tbWants=()=>!!(S.tb&&S.tb.code&&S.tb.room&&(S.tb.room.status==='play'||S.tb.room.status==='guess')&&S.tab==='tools'&&S.tool==='taboo');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tbWants())tbWake(true)});
let tbAC=null;
function tbBeep(mine){try{if(navigator.vibrate)navigator.vibrate(mine?[250,120,250]:120)}catch(e){}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;tbAC=tbAC||new C();const t=tbAC.currentTime;
    [[740,0],[520,.16]].forEach(([f,o])=>{const g=tbAC.createGain();const s=tbAC.createOscillator();s.type='triangle';s.frequency.value=f;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.15);s.connect(g);g.connect(tbAC.destination);s.start(t+o);s.stop(t+o+.16)})}catch(e){}}
setInterval(()=>{if(!(S.tb&&S.tb.room))return;const d=S.tb.room;
  /* time up: everyone beeps once, the game master/host moves the round to guessing; anyone steps in if that phone is asleep */
  if(d.status==='play'&&+d.limit>0&&!d.paused&&tbLeft(d)<=0&&S.tb.timeUp!==d.round){S.tb.timeUp=d.round;tbBeep(false);if(tbCtl(d))tbRoundOver('time')}
  if(d.status==='play'&&+d.limit>0&&!d.paused&&tbLeft(d)<=-4&&S.tb.timeUp2!==d.round){S.tb.timeUp2=d.round;tbRoundOver('time')}
  const stuck=(d.status==='play'&&!d.paused&&tbIn(d).length>=2&&tbAlive(d).length<=1)||(d.status==='guess'&&tbGuessDone(d));
  if(stuck){const key=d.status+d.round;if(S.tb.stuckKey!==key){S.tb.stuckKey=key;S.tb.stuckAt=Date.now()}else if(Date.now()-S.tb.stuckAt>6000&&S.tb.stuckDone!==key){S.tb.stuckDone=key;if(d.status==='play')tbRoundOver('last');else tbCloseRound()}}
  if(!(S.tab==='tools'&&S.tool==='taboo'))return;
  const el=document.getElementById('tbClock');if(el){el.textContent=tbClock(d);el.classList.toggle('warn',d.status==='play'&&+d.limit>0&&tbLeft(d)<=10)}
  const rv=document.getElementById('tbRevealN');if(rv){const left=Math.ceil((S.tb.reveal-Date.now())/1000);if(left<=0)render();else if(rv.textContent!==String(left))rv.textContent=left}},250);

/* game moves
   a game = many rounds; each round: play → guess (players still in guess their own word) → roundEnd (summary + score table)
   points per round: ฆ่าได้ +1 each, รอดถึงจบ round +1, เดาคำตัวเองถูก +1 (only those who survived) */
const TB_WHY={time:'หมดเวลา',last:'เหลือคนสุดท้าย',manual:'จบ round',final:'จบเกม'};
const tbGuessDone=d=>{const a=tbAlive(d);return a.length>0&&a.every(p=>p.guess===true||p.guess===false)};
function tbEntry(d){const ins=tbIn(d);const pts={},words={},names={},kills={};
  ins.forEach(p=>{const k=ins.filter(v=>v.out&&v.killBy===p.pid).length;const s=!p.out;
    pts[p.pid]={k,s:s?1:0,g:s&&p.guess===true?1:0};words[p.pid]=p.word||'';names[p.pid]={name:p.name,code:p.code||'',color:p.color||'',kid:p.kid||''};if(p.out&&p.killBy)kills[p.pid]=p.killBy});
  return {r:+d.round||0,why:d.endBy||'',at:Date.now(),pts,words,names,kills}}
const tbHistWith=d=>(d.history||[]).filter(x=>x.r!==(+d.round||0)).concat(tbEntry(d));
const tbPts=x=>(x?(+x.k||0)+(+x.s||0)+(+x.g||0):0);
function tbScoreRows(d){const hist=d.history||[];const rows={};
  const add=(pid,info)=>{if(!rows[pid])rows[pid]=Object.assign({pid,total:0,per:{}},info)};
  hist.forEach(h=>Object.keys(h.pts||{}).forEach(pid=>{add(pid,(h.names||{})[pid]||{name:'?'});rows[pid].per[h.r]=h.pts[pid];rows[pid].total+=tbPts(h.pts[pid])}));
  Object.keys(rows).forEach(pid=>{const p=(d.players||{})[pid];if(p&&!p.left)Object.assign(rows[pid],{name:p.name,code:p.code,color:p.color,kid:p.kid})});
  return Object.values(rows).sort((a,b)=>b.total-a.total||String(a.name).localeCompare(String(b.name),'th'))}
function tbFreshTime(d,o){const now=Date.now();o.endedAt=now;o.paused=false;if(d.paused&&d.pausedAt)o.pausedTotal=(+d.pausedTotal||0)+(now-d.pausedAt);return o}
async function tbRoundOver(why){const d=S.tb.room;if(!d||d.status!=='play')return;const al=tbAlive(d);
  const o=tbFreshTime(d,{endBy:why||'manual'});
  if(al.length){o.status='guess';o.players={};al.forEach(p=>{o.players[p.pid]={guess:null}});await tbPatch(o);return}
  const x=Object.assign({},d,o);o.status='roundEnd';o.history=tbHistWith(x);await tbPatch(o)}
async function tbCloseRound(){const d=S.tb.room;if(!d)return;if(d.status==='play'){await tbRoundOver('manual');return}
  if(d.status!=='guess')return;await tbPatch({status:'roundEnd',history:tbHistWith(d)})}
async function tbFinal(){const d=S.tb.room;if(!d)return;const o={status:'final'};
  if(d.status==='play'||d.status==='guess'){const t=d.status==='play'?tbFreshTime(d,{endBy:'final'}):{};Object.assign(o,t);o.history=tbHistWith(Object.assign({},d,t))}
  await tbPatch(o)}
async function tbNewGame(){const d=S.tb.room;if(!tbCtl(d))return;await tbPatch({status:'lobby',history:[],round:0,saved:false,endBy:''})}
async function tbStart(){const d=S.tb.room;if(!d)return;if(!tbCtl(d)){toast('ให้'+tbCtlName(d)+'เป็นคนกดเริ่ม');return}
  const nr=tbNarr(d);const ps=tbPlayers(d).filter(p=>p.pid!==nr);if(ps.length<2){toast('ต้องมีคนเล่นอย่างน้อย 2 คน ไม่นับผู้ดำเนินเกม');return}
  const pool=tbPool(d.cats);if(pool.length<ps.length){toast('คำในหมวดที่เลือกไม่พอ เลือกหมวดเพิ่มอีก');return}
  const recent=new Set(LS.get('tbRecent',[]).concat(d.used||[]));let fresh=shuffle(pool.filter(w=>!recent.has(w)));if(fresh.length<ps.length)fresh=shuffle(pool);
  const players={};const words=[];ps.forEach((p,i)=>{players[p.pid]={word:fresh[i],inGame:true,out:false,outAt:0,outBy:'',killBy:'',guess:null,rr:0};words.push(fresh[i])});
  if(nr)players[nr]={word:'',inGame:false,out:false,killBy:'',guess:null};
  LS.set('tbRecent',LS.get('tbRecent',[]).concat(words).slice(-300));
  await tbPatch({status:'play',host:tbHostOk(d)?d.host:TB_ME,round:(+d.round||0)+1,startedAt:Date.now()+(d.mode==='line'?0:3200),endBy:'',endedAt:0,paused:false,pausedAt:0,pausedTotal:0,winner:[],saved:false,used:(d.used||[]).concat(words).slice(-300),players})}
/* who was caught, and who made them say it: one sheet, tap the killer (or "nobody") */
function tbAskOut(pid,fix){const d=S.tb.room;if(!d||d.status!=='play'&&!(fix&&d.status==='guess'))return;if(d.paused&&!fix){toast('เกมพักอยู่ กดเล่นต่อก่อน');return}
  const p=(d.players||{})[pid];if(!p||!p.inGame||p.left||(!fix&&p.out))return;const self=pid===TB_ME;const me=tbMe(d)||{};
  const iSee=!self||!me.inGame||me.out;const ins=tbIn(d);
  const cand=ins.filter(x=>x.pid!==pid&&(fix||!x.out));
  openSheet(fix?'แก้ว่าใครฆ่า '+esc(p.name):self?'ฉันโดนแล้ว ใครฆ่า?':esc(p.name)+' โดนแล้ว ใครฆ่า?',
    `<div class="tb-ask" style="--c:${okColor(p.color)}">${tbPawn(p,'lg')}<div>${iSee?`<span class="label">คำต้องห้ามของ ${esc(p.name)}</span><div class="tb-askword">${esc(p.word)}</div>`:'<span class="muted">เลือกแล้วจะเห็นคำของตัวเอง</span>'}</div></div>
    <div class="field"><span>ใครทำให้${self?'เรา':esc(p.name)}พูดคำนี้ (คนนั้นได้ +1)</span>
      <div class="tb-killers">${cand.map(x=>{const n=ins.findIndex(y=>y.pid===x.pid)+1;return `<button type="button" class="tb-killer ${p.killBy===x.pid?'on':''}" data-act="tbOutGo" data-id="${esc(pid)}" data-k="${esc(x.pid)}" data-key="${n}" style="--c:${okColor(x.color)}">${tbPawn(x,'sm')}<span>${esc(x.name)}</span><kbd>${n}</kbd></button>`}).join('')}</div></div>
    <p class="muted small">${fix?'เปลี่ยนคนได้แต้มฆ่าของรอบนี้':'เลือกแล้ว '+(self?'คุณ':esc(p.name))+'ตกรอบทันที กดผิดกดย้อนกลับได้'}</p>`,
    `<button class="btn ${fix?'':'dangerfill'} big" data-act="tbOutGo" data-id="${esc(pid)}" data-k="" data-enter>${fix?'ไม่มีใครฆ่า':'ไม่มีใคร (พูดเอง)'} <kbd>Enter</kbd></button><button class="btn ghost big" data-act="closeSheet">ยกเลิก</button>`)}
/* "ฉันฆ่าได้": the killer reports it and picks who they caught */
function tbAskKill(){const d=S.tb.room;if(!d||d.status!=='play')return;if(d.paused){toast('เกมพักอยู่ กดเล่นต่อก่อน');return}
  const me=tbMe(d);if(!me||!me.inGame||me.out){toast('ต้องยังอยู่ในเกมถึงจะฆ่าได้');return}const ins=tbIn(d);
  const cand=ins.filter(x=>x.pid!==TB_ME&&!x.out);
  openSheet('ฉันฆ่าได้ ฆ่าใคร?',`<div class="field"><span>แตะคนที่เผลอพูดคำของตัวเอง เขาจะตกรอบ แล้วเราได้ +1</span>
    <div class="tb-killers">${cand.map(x=>{const n=ins.findIndex(y=>y.pid===x.pid)+1;return `<button type="button" class="tb-killer" data-act="tbOutGo" data-id="${esc(x.pid)}" data-k="${esc(TB_ME)}" data-key="${n}" style="--c:${okColor(x.color)}">${tbPawn(x,'sm')}<span>${esc(x.name)}<small>${esc(x.word)}</small></span><kbd>${n}</kbd></button>`}).join('')}</div></div>`,
    `<button class="btn ghost big" data-act="closeSheet">ยกเลิก</button>`)}
async function tbOutGo(pid,killer){const d=S.tb.room;if(!d)return;const p=(d.players||{})[pid];if(!p||!p.inGame)return;
  if(killer&&(killer===pid||!(d.players||{})[killer]))killer='';
  if(p.out){if(await tbPatch({players:{[pid]:{killBy:killer}}}))toast(killer?d.players[killer].name+' ได้แต้มฆ่า '+p.name:'ไม่นับแต้มฆ่า '+p.name);return}
  if(d.status!=='play')return;
  if(!await tbPatch({players:{[pid]:{out:true,outAt:Date.now(),outBy:TB_ME,killBy:killer}}}))return;
  toast(p.name+' ตกรอบ'+(killer?' · '+d.players[killer].name+' +1':''));
  const now=S.tb.room;if(now&&now.status==='play'&&tbCtl(now)&&tbAlive(now).filter(x=>x.pid!==pid).length<=1)tbRoundOver('last')}
async function tbRevive(pid){const d=S.tb.room;if(!d)return;const p=(d.players||{})[pid];if(!p||!p.out)return;
  const o={players:{[pid]:{out:false,outAt:0,outBy:'',killBy:'',guess:null}}};
  if(d.status==='guess'){if(d.endBy==='time')o.players[pid].guess=null;
    else{o.status='play';o.pausedTotal=(+d.pausedTotal||0)+Math.max(0,Date.now()-(d.endedAt||Date.now()));o.endedAt=0;o.endBy='';tbAlive(d).forEach(x=>{o.players[x.pid]={guess:null}});o.players[pid]={out:false,outAt:0,outBy:'',killBy:'',guess:null}}}
  else if(d.status!=='play')return;
  if(await tbPatch(o))toast(p.name+' กลับเข้าเกมแล้ว')}
async function tbUndo(){const d=S.tb.room;if(!d||(d.status!=='play'&&d.status!=='guess'))return;if(d.status==='guess'&&!tbCtl(d)){toast('ให้'+tbCtlName(d)+'เป็นคนย้อน');return}
  const last=tbIn(d).filter(p=>p.out).sort((a,b)=>(b.outAt||0)-(a.outAt||0))[0];if(!last){toast('ยังไม่มีใครโดน');return}
  await tbRevive(last.pid)}
async function tbPause(){const d=S.tb.room;if(!d||d.status!=='play')return;
  if(d.paused)await tbPatch({paused:false,pausedAt:0,pausedTotal:(+d.pausedTotal||0)+Math.max(0,Date.now()-(d.pausedAt||Date.now()))});
  else await tbPatch({paused:true,pausedAt:Date.now()})}
/* change a word: as many times as you like */
async function tbReroll(pid){const d=S.tb.room;if(!d||d.status!=='play')return;if(d.paused){toast('เกมพักอยู่');return}
  const p=(d.players||{})[pid];if(!p||!p.inGame||p.out)return;
  const now=new Set(tbIn(d).map(x=>x.word));const used=new Set(d.used||[]);const pool=tbPool(d.cats);
  let c=pool.filter(w=>!now.has(w)&&!used.has(w));if(!c.length)c=pool.filter(w=>!now.has(w));if(!c.length){toast('ไม่มีคำเหลือให้เปลี่ยน');return}
  const w=c[Math.floor(Math.random()*c.length)];
  if(await tbPatch({players:{[pid]:{word:w,rr:(+p.rr||0)+1}},used:(d.used||[]).concat(w).slice(-300)}))toast(pid===TB_ME?'เปลี่ยนคำของคุณแล้ว':'เปลี่ยนคำของ '+p.name+' แล้ว')}
/* guessing: the game master judges; without one, anyone but the guesser does */
const tbCanJudge=(d,pid)=>tbNarr(d)?tbIsNarr(d):pid!==TB_ME;
async function tbGuess(pid,v){const d=S.tb.room;if(!d||d.status!=='guess')return;const p=(d.players||{})[pid];if(!p||!p.inGame||p.out)return;
  if(!tbCanJudge(d,pid)){toast(tbNarr(d)?'ให้ผู้ดำเนินเกมเป็นคนตัดสิน':'ให้คนอื่นตัดสินว่าเดาถูกไหม');return}
  await tbPatch({players:{[pid]:{guess:p.guess===v?null:v}}})}

function tbTable(d,opts){opts=opts||{};const rows=tbScoreRows(d);const hist=(d.history||[]).slice().sort((a,b)=>a.r-b.r);
  if(!rows.length||!hist.length)return '';const best=rows[0].total;

    return `<td><b>${tbPts(x)}</b>${bits.length?`<small>${bits.join(' · ')}</small>`:''}</td>`};
  return `<div class="tb-scorebox">${opts.title?`<h3>${opts.title}</h3>`:''}<div class="tb-tablewrap"><table class="tb-table">

document.addEventListener('keydown',e=>{
  if(!(S.tab==='tools'&&S.tool==='taboo'&&S.tb&&S.tb.code&&S.tb.room)||e.isComposing)return;
  const a=document.activeElement;if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;
  const dig=/^(Digit|Numpad)([1-9])$/.exec(e.code||'');
  /* inside the "who killed" popup: the number picks that player */
  if(!$('#sheet').hidden){if(dig&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const b=$(`#sheetCard [data-key="${dig[2]}"]`);if(b){e.preventDefault();b.click()}}return}
  const d=S.tb.room;
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&e.code==='KeyZ'){e.preventDefault();tbUndo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'){e.preventDefault();if(d.status==='play')tbPause();else if(d.status==='guess'){if(tbCtl(d))tbCloseRound()}else if(d.status!=='final'&&tbCtl(d))tbStart();return}
  if(dig){if(d.status==='play'){const p=tbIn(d)[+dig[2]-1];if(p&&!p.out){e.preventDefault();tbAskOut(p.pid)}}return}
  if(e.code==='KeyD'){e.preventDefault();tbAskOut(TB_ME);return}
  if(e.code==='KeyK'){e.preventDefault();tbAskKill();return}
  if(e.code==='KeyH'){e.preventDefault();ACT.tbHide();return}
  if(e.code==='KeyR'){e.preventDefault();tbReroll(TB_ME)}
});

function endInfo(){
  if(S.bro&&EXT.end){const x=EXT.end();if(x)return x}
  if(S.tab!=='tools'||!S.tool)return null;
  switch(S.tool){
    case 'bsgs':{const s=S.bs;if(!s||s.phase==='setup'||s.phase==='end')return null;return {name:'Baan Suay Game Show',note:'ไปหน้าสรุปคะแนนเลย ช่องที่ยังไม่เปิดจะไม่ได้เล่น',go:()=>ACT.bsEndNow()}}
    case 'uno':{const u=S.uno;if(!u||u.phase!=='play')return null;return {name:'UNO',note:'ไปหน้าเลือกว่าใครลงไพ่ใบสุดท้าย',go:()=>ACT.unoEnd()}}
    case 'score':{const s=S.score;if(!s||s.phase!=='play')return null;
      if(s.mode==='coop')return {name:s.game||'เกมช่วยกัน',note:'ทีมผ่านด่านมั้ย',choices:[{label:'ผ่านด่าน',go:()=>ACT.scCoop({dataset:{id:'win'}})},{label:'ยังไม่ผ่าน',go:()=>ACT.scCoop({dataset:{id:'lose'}})}]};
      return {name:s.game||'กระดานคะแนน',note:'ไปหน้าสรุปอันดับ',go:()=>ACT.scEnd()}}
    case 'flip7':{const f=S.flip;if(!f||f.phase!=='play'||!(f.players||[]).length)return null;return {name:'Flip 7',note:'ไปหน้าสรุปแต้ม',go:()=>ACT.f7End()}}
    case 'poker':{const P=S.poker;if(!P)return null;if(P.h&&(P.phase==='hand'||P.phase==='show'))return {block:'ยังอยู่กลางมือ เล่นมือนี้ให้จบก่อนแล้วค่อยจบเกม'};
      if(P.phase!=='ready'||!(P.players||[]).length)return null;return {name:'โป๊กเกอร์',note:'ไปหน้าสรุปชิป',go:()=>ACT.pbEnd()}}
    case 'taboo':{const d=S.tb&&S.tb.room;if(!d||!['play','guess','roundEnd','end','lobby'].includes(d.status))return null;if(d.status==='lobby'&&!(d.history||[]).length)return null;
      if(!tbCtl(d))return {block:'ให้'+tbCtlName(d)+'เป็นคนกดจบเกม'};
      return {name:'คำต้องห้าม · ห้อง '+(d.code||S.tb.code),note:(d.status==='play'||d.status==='guess'?'round นี้นับแต้มเท่าที่เล่นไปแล้ว คนที่ยังไม่ตกรอบได้ +1 ':'')+'แล้วรวมแต้มทุก round ประกาศผู้ชนะ',go:()=>tbFinal()}}
  }
  return null;
}

/* drag a topic or question box by its grip to reorder it */
function startDrag(e,grip){
  const item=grip.closest('[data-drag]');const list=item&&item.parentElement;if(!item||!list||!S.draft)return;
  const kind=item.dataset.drag;const items=Array.from(list.children).filter(el=>el.dataset&&el.dataset.drag===kind&&!el.hidden);
  const from=items.indexOf(item);if(from<0||items.length<2)return;
  const sc=$('#sheetCard');const s0=sc.scrollTop;const y0=e.clientY;
  const rs=items.map(el=>{const r=el.getBoundingClientRect();return {top:r.top+s0,h:r.height}});
  const gap=rs.length>1?Math.max(0,rs[1].top-(rs[0].top+rs[0].h)):12;const H=rs[from].h+gap;
  let to=from,lastY=y0,raf=0;
  item.classList.add('dragging');try{grip.setPointerCapture(e.pointerId)}catch(_){}
  const layout=()=>{
    const dy=(lastY-y0)+(sc.scrollTop-s0);item.style.transform=`translateY(${dy}px)`;
    const c=rs[from].top+rs[from].h/2+dy;to=from;
    for(let i=0;i<rs.length;i++){if(i===from)continue;const mid=rs[i].top+rs[i].h/2;if(i>from&&c>mid)to=i;if(i<from&&c<mid&&to>=from)to=i}
    items.forEach((el,i)=>{if(i===from)return;let off=0;if(from<to&&i>from&&i<=to)off=-H;if(to<from&&i>=to&&i<from)off=H;el.style.transform=off?`translateY(${off}px)`:''});
  };
  const edge=()=>{const r=sc.getBoundingClientRect();let v=0;if(lastY<r.top+70)v=-12;else if(lastY>r.bottom-70)v=12;if(v){sc.scrollTop+=v;layout()}raf=requestAnimationFrame(edge)};
  raf=requestAnimationFrame(edge);
  const move=ev=>{lastY=ev.clientY;layout();ev.preventDefault()};
  const up=()=>{cancelAnimationFrame(raf);grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);
    items.forEach(el=>{el.style.transform='';el.classList.remove('dragging')});
    if(to!==from){syncDraft();const a=kind==='t'?S.draft.topics:S.draft.questions;const fr=+items[from].dataset.ix,tr=+items[to].dataset.ix;const [x]=a.splice(fr,1);a.splice(tr,0,x);paintLessonForm()}};
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
}
