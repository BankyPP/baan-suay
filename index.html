<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baan Suay">
<meta name="theme-color" content="#1B365D">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Baan Suay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,700;1,400&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* Layout: a family game table. House name + mode switch on top, rooms as a scrolling tab row, one content column.
   Calm blue-grey paper and ink; the siblings' pawn colours are the only loud colour on the page. */
:root{
  --paper:#ECF0F3; --surface:#FFFFFF; --sunk:#DFE6EC; --ink:#17212B; --muted:#55626E; --line:#CDD6DE;
  --btn:#17212B; --btn-ink:#FFFFFF; --good:#16825A; --good-bg:#DCF1E7; --bad:#BE3A2A; --bad-bg:#F8E0DC;
  --focus:#2F5BD3; --scrim:rgba(12,18,24,.48); --star:#E2A00C;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 6px 20px rgba(23,33,43,.08);
  --f-head:"Kanit","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","Kanit",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10161C; --surface:#18212A; --sunk:#222C37; --ink:#E6ECF1; --muted:#98A5B1; --line:#2D3844;
  --btn:#E6ECF1; --btn-ink:#10161C; --good:#4CC18C; --good-bg:#16352A; --bad:#F2806E; --bad-bg:#3B201C;
  --focus:#86A6FF; --scrim:rgba(0,0,0,.6); --star:#F5B931; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10161C; --surface:#18212A; --sunk:#222C37; --ink:#E6ECF1; --muted:#98A5B1; --line:#2D3844;
  --btn:#E6ECF1; --btn-ink:#10161C; --good:#4CC18C; --good-bg:#16352A; --bad:#F2806E; --bad-bg:#3B201C;
  --focus:#86A6FF; --scrim:rgba(0,0,0,.6); --star:#F5B931; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--f-body)}
h1,h2,h3,h4,h5{font-family:var(--f-head);line-height:1.25;text-wrap:balance;margin:0}
h2{font-weight:600;font-size:1.35rem}
h3{font-weight:500;font-size:1.08rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:46px;height:46px;flex:none;color:var(--ink)}
.brand h1{font-weight:700;font-size:clamp(1.45rem,4.6vw,2.1rem);letter-spacing:-.005em}
.brand small{display:block;font:500 .78rem/1.3 var(--f-head);color:var(--muted);letter-spacing:.03em}
.modebtn{display:inline-flex;align-items:center;gap:8px;font:500 .9rem/1 var(--f-head);min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.modebtn .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.modebtn[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.modebtn[aria-pressed="true"] .dot{background:#38D38E}

.tabs{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;margin-block:14px 20px;box-shadow:inset 0 -1px 0 var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:500 1rem/1 var(--f-head);background:none;border:0;color:var(--muted);padding:12px 14px 13px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;flex:none}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}

.banner{font-size:.9rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px}

.btn{font:500 .95rem/1.1 var(--f-head);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:.86rem;border-radius:10px}
.btn.big{min-height:58px;font-size:1.1rem;padding:0 22px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.sec{display:grid;gap:14px;margin-bottom:32px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head p{color:var(--muted);font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font:500 .74rem/1.2 var(--f-head);letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:500 .86rem/1 var(--f-head);padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:500 .72rem/1 var(--f-head);padding:5px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ex{background:transparent;border:1px dashed var(--muted)}
.subj{display:inline-block;font:600 .74rem/1 var(--f-head);letter-spacing:.04em;padding:5px 9px;border-radius:6px;border:1.5px solid var(--ink);color:var(--ink)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;display:grid;gap:12px;justify-items:center}
.empty b{font:600 1.05rem var(--f-head);color:var(--ink)}

/* pawns: the siblings as game pieces */
.pawn{--c:#6B7785;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font:600 15px/1 var(--f-head);letter-spacing:.02em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);flex:none;border:0;padding:0}
.pawn.sm{width:26px;height:26px;font-size:10.5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.pawn.lg{width:64px;height:64px;font-size:22px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.pawn.xl{width:132px;height:132px;font-size:46px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.2)}
button.pawn{cursor:pointer;transition:transform .12s}
button.pawn:active{transform:scale(.94)}
button.pawn[aria-pressed="false"]{opacity:.32}
button.pawn[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.pawns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex}
.stack .pawn{margin-left:-6px;outline:2px solid var(--surface)}
.stack .pawn:first-child{margin-left:0}

/* race track */
.board{display:grid;gap:10px}
.lane{--c:#6B7785;display:grid;grid-template-columns:88px minmax(0,1fr) 70px;gap:12px;align-items:center}
.lane-who b{font:600 1.02rem/1.2 var(--f-head);display:block}
.lane-who small{display:block;color:var(--muted);font-size:.76rem;line-height:1.25}
.track{position:relative;height:50px;border-radius:25px;background:var(--sunk);overflow:hidden}
.track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--paper) calc(10% - 2px) 10%)}
.track .fill{position:absolute;inset:0 auto 0 0;width:calc(50px + (100% - 50px) * var(--p));background:color-mix(in srgb,var(--c) 26%,transparent);border-radius:25px;transition:width .7s}
.track .pawn{position:absolute;top:5px;left:calc(5px + (100% - 50px) * var(--p));transition:left .7s}
.lane-pts{font:600 1.35rem/1 var(--f-head);text-align:right;font-variant-numeric:tabular-nums}
.lane-pts small{display:block;font:400 .72rem var(--f-body);color:var(--muted)}
.lead{font:600 .66rem/1 var(--f-head);background:var(--ink);color:var(--paper);padding:3px 6px;border-radius:5px;margin-left:4px;vertical-align:2px}
@media (max-width:540px){.lane{grid-template-columns:66px minmax(0,1fr) 50px;gap:8px}.lane-who small{display:none}}

.feed{display:grid;gap:0}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .pts{font:600 .95rem var(--f-head);font-variant-numeric:tabular-nums;color:var(--good)}
.feed .pts.zero{color:var(--muted)}
.feed .pts.neg,.lane-pts.neg{color:var(--bad)}
.lane-who{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.lane-who small{grid-column:2}
.rk{grid-row:span 2;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:600 .85rem/1 var(--f-head);font-variant-numeric:tabular-nums;color:var(--muted)}
.rk.top{background:var(--star);color:#fff}
.secret-title{font-size:clamp(1.5rem,4.4vw,2.1rem);font-weight:700;letter-spacing:.01em}
.pick.minus .opt input:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
ul.plain{list-style:none;margin:0;padding:0}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.qcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:grid;gap:4px}
.qcard:hover{border-color:var(--muted)}
.qcard b{font:600 1rem var(--f-head)}
.qcard span{color:var(--muted);font-size:.86rem;line-height:1.4}

/* lessons */
.lcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:grid;gap:8px;align-content:start;min-width:0}
.lcard:hover{border-color:var(--muted)}
.lcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lcard p{color:var(--muted);font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}
.lcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;min-height:26px}
.prose{max-width:68ch;overflow-wrap:anywhere}
.prose h3,.prose h4,.prose h5{margin:1.1em 0 .4em}
.prose h3{font-size:1.15rem;font-weight:600}
.prose p,.prose ul,.prose ol{margin:.5em 0}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin:.2em 0}
.prose code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.tip{background:var(--sunk);border-radius:12px;padding:10px 14px;margin:.7em 0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:500 .92rem var(--f-head);cursor:pointer;padding:6px 0}
.back:hover{color:var(--ink)}

/* quiz */
.quiz{display:grid;gap:16px;max-width:760px}
.qtop{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .3s}
.qtext{font-size:1.2rem;line-height:1.55}
.qtext p{margin:0}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:1.02rem}
.choice .L{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--sunk);font:600 .95rem var(--f-head)}
.choice:hover:not(:disabled){border-color:var(--muted)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.right .L{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .L{background:var(--bad);color:#fff}
.explain{border-radius:14px;padding:12px 16px;background:var(--sunk)}
.explain b{font-family:var(--f-head);font-weight:600}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px 16px}
.result .score{font:700 3.6rem/1 var(--f-head);font-variant-numeric:tabular-nums}

/* lesson topics, stars, quiz setup */
.stars{display:inline-flex;gap:1px;align-items:center;flex:none}
.stars i{display:inline-flex}
.stars svg{width:19px;height:19px;fill:var(--line)}
.stars i.on svg{fill:var(--star)}
.stars.sm svg{width:14px;height:14px}
.ltitle{font-size:clamp(1.6rem,4.4vw,2.2rem);font-weight:600}
.topics{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:14px;row-gap:8px;align-items:start}
.tno{grid-row:1/span 2;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--sunk);font:600 1.05rem/1 var(--f-head);font-variant-numeric:tabular-nums}
.topic-head{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;min-height:38px}
.topic-head h3{font-size:1.1rem;font-weight:600}
.goalwrap{display:grid;gap:6px;min-width:0}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.goals li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;line-height:1.5;overflow-wrap:anywhere}
.goals li::before{content:"";width:12px;height:12px;margin-top:.42em;border:1.6px solid var(--muted);border-radius:3px}
@media (max-width:480px){.topic{grid-template-columns:30px minmax(0,1fr);column-gap:10px;padding:12px}.tno{width:30px;height:30px;font-size:.95rem}}
.qpanel{display:grid;gap:18px}
.qgroup{display:grid;gap:8px;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px}
.seg button{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.seg button b{font:600 1.15rem/1.1 var(--f-head)}
.seg button span{font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.mini{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.mini input{width:92px;padding:8px 10px}
.mini span{white-space:nowrap}
.qedit .mini{justify-self:start}
.clock{font:600 1rem/1 var(--f-head);font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:999px;background:var(--sunk);min-width:4.2em;text-align:center}
.clock.warn{background:var(--bad-bg);color:var(--bad)}
.meq-box{min-height:170px;font-size:1.05rem}
.meq-yours{border:1px dashed var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:6px}
.review{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;width:100%;max-width:560px;text-align:left}
.review li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--sunk);font-size:.92rem}
.review .rv{font:600 .82rem/1 var(--f-head);padding:5px 8px;border-radius:6px;min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
.review li.ok .rv{background:var(--good-bg);color:var(--good)}
.review li.no .rv{background:var(--bad-bg);color:var(--bad)}
.review .rq{overflow-wrap:anywhere}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.starpick{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.starpick input{position:absolute;opacity:0;width:1px;height:1px}
.starpick label{cursor:pointer;padding:2px;display:inline-flex}
.starpick svg{width:26px;height:26px;fill:var(--line);transition:fill .1s}
.starpick input:checked~label svg,.starpick label:hover svg,.starpick label:hover~label svg{fill:var(--star)}
.starpick input:focus-visible+label{outline:3px solid var(--focus);outline-offset:1px;border-radius:6px}

/* tools */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);display:grid;gap:18px;min-width:0}
.bigq{font-size:clamp(1.3rem,3.4vw,1.9rem);line-height:1.5;font-weight:400}
.bigq p{margin:0}
.scoreline{display:flex;gap:14px;flex-wrap:wrap}
.scoreline>span{display:inline-flex;align-items:center;gap:6px;font:600 1.1rem var(--f-head);font-variant-numeric:tabular-nums}
.center{display:grid;justify-items:center;text-align:center;gap:10px}
.turnname{font:600 clamp(1.6rem,5vw,2.4rem)/1.1 var(--f-head)}
.dir{display:inline-flex;align-items:center;gap:8px;font:500 1rem var(--f-head);color:var(--muted)}
.dir svg{width:26px;height:26px}
.pending{font:600 1.15rem var(--f-head);background:var(--bad-bg);color:var(--bad);padding:8px 16px;border-radius:999px}
.unocolors{display:flex;gap:8px;justify-content:center}
.unocolors button{width:40px;height:40px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.unocolors button[aria-pressed="true"]{border-color:var(--ink)}
.unogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.nextup{display:flex;gap:6px;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem}
.order{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:46px;padding:8px;border-radius:12px;background:var(--sunk)}
.order .item{display:inline-flex;align-items:center;gap:4px;font:500 .8rem var(--f-head);color:var(--muted)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .tot{font:700 2rem/1 var(--f-head);font-variant-numeric:tabular-nums;min-width:2.5ch;text-align:right}
.prow .ctrl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.prow .ctrl input{width:90px}
.digits{font:600 clamp(4rem,16vw,7.5rem)/1 var(--f-head);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.digits.done{color:var(--bad);animation:blink .6s steps(2) 6}
@keyframes blink{50%{opacity:.25}}
.dice{display:flex;gap:14px;justify-content:center}
.dice svg{width:84px;height:84px}
.rank{display:grid;gap:8px;width:100%;max-width:460px}
.rank div{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--sunk);text-align:left}
.rank .no{font:600 1rem var(--f-head);color:var(--muted)}
.rank .v{font:700 1.3rem var(--f-head);font-variant-numeric:tabular-nums}

/* Baan Suay Game Show: one deliberate stage look (navy + marquee yellow) in both themes */

/* light markdown: ## heading, - list, 1. list, > tip, **bold**, *italic*, `code`, H_2O, x^2, ->, <=> */
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<em>$2</em>')
    .replace(/_\{([^}]+)\}/g,'<sub>$1</sub>')
    .replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>')
    .replace(/([A-Za-z)\]])_(\d+)/g,'$1<sub>$2</sub>')
    .replace(/\^(\d*[+\-−]|\d+)/g,'<sup>$1</sup>')
    .replace(/&lt;=&gt;/g,'⇌').replace(/-&gt;/g,'→');
}
function md(src){
  const lines=esc(src||'').split(/\r?\n/);let out='',list=null,para=[];
  const fp=()=>{if(para.length){out+='<p>'+inline(para.join('<br>'))+'</p>';para=[]}};
  const fl=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const raw of lines){const l=raw.replace(/\s+$/,'');let m;
    if(!l.trim()){fp();fl();continue}
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){fp();fl();const h=m[1].length+2;out+=`<h${h}>${inline(m[2])}</h${h}>`;continue}
    if((m=l.match(/^\s*[-•]\s+(.*)$/))){fp();if(list!=='ul'){fl();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){fp();if(list!=='ol'){fl();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^&gt;\s?(.*)$/))){fp();fl();out+=`<aside class="tip">${inline(m[1])}</aside>`;continue}
    fl();para.push(l);
  }
  fp();fl();return out;
}
const plain=s=>String(s||'').replace(/[#*>`_^{}]/g,'').replace(/\s+/g,' ').trim();

/* ---------- storage: shared database in the artifact, browser storage elsewhere ---------- */
const COLS=['kids','lessons','log','posts','games','sessions','meta','boards'];
const Store={
  mode:'loading', d:{kids:{},lessons:{},log:{},posts:{},games:{},sessions:{},meta:{},boards:{}}, db:null,
  async init(){
    COLS.forEach(c=>this.d[c]={});
    let db=null;const cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey&&!/ใส่/.test(cfg.apiKey)){
      if(!window.firebase){this.err='โหลด Firebase ไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดหน้าใหม่'}
      else{try{if(!firebase.apps.length)firebase.initializeApp(cfg);const au=firebase.auth();
          const u=await new Promise(r=>{const un=au.onAuthStateChanged(x=>{un();r(x)})});if(!u)await au.signInAnonymously();
          db=firebase.firestore();this.kind='firebase'}
        catch(e){this.err='เข้าฐานข้อมูล Firebase ไม่ได้ ('+(e&&e.code||'error')+') ตรวจว่าเปิด Anonymous ใน Authentication แล้ว และวาง Rules ถูกต้อง'}}
    }else if(window.claude&&typeof window.claude.use==='function'){try{db=await window.claude.use('db')}catch(e){db=null}if(db)this.kind='claude'}
    if(db){
      this.db=db;this.mode='shared';
      COLS.forEach(c=>{
        db.collection(c).onSnapshot(s=>{const m={};s.docs.forEach(x=>{m[x.id]=Object.assign({},x.data(),{id:x.id})});this.d[c]=m;changed()},
          ()=>toast('เชื่อมต่อข้อมูลบ้านไม่ได้ ลองเปิดหน้านี้ใหม่'));
      });
      if(this.kind==='firebase'){this.d.adminRequests={};
        db.collection('adminRequests').onSnapshot(s=>{const m={};s.docs.forEach(x=>{m[x.id]=Object.assign({},x.data(),{id:x.id})});this.d.adminRequests=m;changed()},()=>{});
        await this.afterAuth();}
    }else{
      this.mode='local';
      COLS.forEach(c=>{let m={};try{m=JSON.parse(localStorage.getItem('house6:'+c)||'{}')||{}}catch(e){}
        const out={};Object.keys(m).forEach(id=>{if(m[id]&&typeof m[id]==='object')out[id]=Object.assign({},m[id],{id})});this.d[c]=out});
    }
    changed();
    try{await this.maybeSeed()}catch(e){}
  },
  /* login: everyone is signed in anonymously; brother mode needs a Google account on the allowed list (meta/admins) */
  user:null, admin:false, ownerClaim:false,
  get isGoogle(){return !!(this.user&&!this.user.isAnonymous)},
  admins(){return (this.d.meta.admins&&this.d.meta.admins.uids)||[]},
  adminNames(){return (this.d.meta.admins&&this.d.meta.admins.names)||{}},
  async afterAuth(){
    const au=firebase.auth();this.user=au.currentUser;this.admin=false;this.ownerClaim=false;
    if(this.isGoogle){const uid=this.user.uid;
      try{const snap=await this.db.collection('meta').doc('admins').get();const a=snap.exists?snap.data():{};
        if((a.uids||[]).includes(uid))this.admin=true;
        else{await this.db.collection('meta').doc('admins').set({uids:(a.uids||[]).concat(uid),names:Object.assign({},a.names||{},{[uid]:this.user.displayName||'พี่'})});this.admin=true;this.ownerClaim=true}
      }catch(e){this.admin=false}
    }
    if(!this.admin)S.bro=false;else if(LS.get('bro',false))S.bro=true;
    changed();
    if(this.admin){try{await this.maybeSeed()}catch(e){}}
  },
  checkAdmin(){if(this.kind!=='firebase')return;if(!this.user){this.admin=false;S.bro=false;return}const ok=this.isGoogle&&(this.ownerClaim||this.admins().includes(this.user.uid));this.admin=ok;if(!ok)S.bro=false},
  /* a fresh copy of the website starts with the house's starter data (window.HOUSE_SEED), once */
  async maybeSeed(){
    const seed=window.HOUSE_SEED;if(!seed||this.kind==='claude')return;if(this.kind==='firebase'&&!this.admin)return;
    const data=seed.data||seed,ver=seed.ver||{},top=seed.v||1;
    const shared=this.mode==='shared';
    const exists=async(c,id)=>shared?(await this.db.collection(c).doc(id).get()).exists:!!(this.d[c]&&this.d[c][id]);
    let flag=shared?await this.db.collection('meta').doc('seeded').get():null;
    flag=shared?(flag.exists?flag.data():null):(this.d.meta.seeded||null);
    let hasKids=shared?!(await this.db.collection('kids').get()).empty:Object.keys(this.d.kids).length>0;
    let cur=flag?(+flag.v||1):(hasKids?1:0);
    if(cur>=top)return;
    for(const c of Object.keys(data)){if(!COLS.includes(c))continue;
      for(const id of Object.keys(data[c])){const v=+ver[c+'/'+id]||1;if(v<=cur)continue;if(cur>0&&await exists(c,id))continue;await this.put(c,id,data[c][id])}}
    await this.put('meta','seeded',{at:Date.now(),v:top});
  },
  async put(c,id,obj){
    const body=JSON.parse(JSON.stringify(obj));delete body.id;
    this.d[c]=Object.assign({},this.d[c],{[id]:Object.assign({},body,{id})});changed();
    try{
      if(this.mode==='shared') await this.db.collection(c).doc(id).set(body);
      else localStorage.setItem('house6:'+c,JSON.stringify(this.d[c]));
      return true;
    }catch(e){toast('บันทึกไม่สำเร็จ ตรวจว่ามีสิทธิ์แก้ไขบ้านนี้ แล้วลองใหม่');return false}
  },
  async del(c,id){
    const m=Object.assign({},this.d[c]);delete m[id];this.d[c]=m;changed();
    try{
      if(this.mode==='shared') await this.db.collection(c).doc(id).delete();
      else localStorage.setItem('house6:'+c,JSON.stringify(this.d[c]));
    }catch(e){toast('ลบไม่สำเร็จ ลองใหม่อีกครั้ง')}
  }
};

function playerPawn(p,cls){const k=p.id&&kidById(p.id);return k?pawn(k,cls):guestPawn(p,cls)}

function totals(range){
  const t={};const n=new Date();const m0=new Date(n.getFullYear(),n.getMonth(),1).getTime();
  for(const e of logs()){if(e.kind==='secret')continue;if(range==='month'&&(e.at||0)<m0)continue;t[e.kid]=(t[e.kid]||0)+(+e.pts||0)}
  return t;
}
function stats(kid){
  const st={pts:0,quizzes:0,bySubj:{},perfect:0,perfectChem:0,wins:0,coop:0,showCorrect:0,stickers:new Set()};const seen=new Set();
  for(const e of logs()){
    if(e.kid!==kid||e.kind==='secret')continue;st.pts+=(+e.pts||0);
    if(e.kind==='quiz'){if(!seen.has(e.lessonId)){seen.add(e.lessonId);st.quizzes++;st.bySubj[e.subject]=(st.bySubj[e.subject]||0)+1}
      if(e.perfect){st.perfect++;if(e.subject==='chem')st.perfectChem++}}
    if(e.kind==='game'){if(e.win&&!e.coop)st.wins++;if(e.coop)st.coop++;st.showCorrect+=(+e.correct||0)}
    if(e.kind==='sticker'&&e.sticker)st.stickers.add(e.sticker);
  }
  return st;
}

const secretMeta=()=>Store.d.meta.secret||{};
const secretTitle=()=>secretMeta().title||'Secret Game';
function secretLogs(){const since=+secretMeta().since||0;return logs().filter(e=>e.kind==='secret'&&(e.at||0)>=since)}
function secretTotals(){const t={};for(const e of secretLogs())t[e.kid]=(t[e.kid]||0)+(+e.pts||0);return t}
function laneBoard(t,empty,unit){unit=unit||'คะแนน';
  const lg=league();if(!lg.length)return `<p class="muted">${empty}</p>`;
  const max=Math.max(1,...lg.map(k=>Math.max(0,t[k.id]||0)));
  const sorted=lg.slice().sort((a,b)=>(t[b.id]||0)-(t[a.id]||0));
  let rank=0,prev=null;
  return sorted.map((k,i)=>{const p=t[k.id]||0;if(p!==prev){rank=i+1;prev=p}const r=(Math.max(0,p)/max).toFixed(3);
    return `<div class="lane" style="--c:${okColor(k.color)};--p:${r}">
    <div class="lane-who"><span class="rk ${rank===1&&p>0?'top':''}">${rank}</span><b>${esc(k.code)}</b><small>${esc(k.grade||'')}</small></div>
    <div class="track" role="img" aria-label="อันดับ ${rank} ${esc(k.code)} ${p} ${unit}"><span class="fill"></span><span class="pawn" style="--c:${okColor(k.color)}">${esc(k.code)}</span></div>
    <div class="lane-pts ${p<0?'neg':''}">${p}<small>${unit}</small></div></div>`}).join('');
}
function feedList(list,emptyMsg){
  return list.length?`<ul class="plain feed">${list.map(e=>{const k=kidById(e.kid);const v=+e.pts||0;return `<li>${k?pawn(k,'sm'):'<span class="pawn sm">?</span>'}<div class="small"><span>${logText(e)}</span><br><span class="muted">${ago(e.at)}</span></div><span class="pts ${v<0?'neg':v?'':'zero'}">${v>0?'+':''}${v}</span></li>`}).join('')}</ul>`:`<p class="muted">${emptyMsg}</p>`;
}

const qMax=q=>Math.max(1,Math.round(+q.max||1));
const qsOf=(l,mode)=>(l.questions||[]).map((q,i)=>({q,i})).filter(x=>mode==='meq'?isMEQ(x.q):!isMEQ(x.q)).map(x=>x.i);

const fmtDur=s=>{s=Math.round(s);if(s<60)return s+' วินาที';const m=Math.floor(s/60),r=s%60;return m+' นาที'+(r?' '+r+' วินาที':'')};
const lv=l=>(l.levels&&l.levels.length)?l.levels.map(bandName).join(' · '):'ทุกระดับ';

function vLearn(){
  if(S.quiz)return vQuiz();
  if(S.learn.open&&Store.d.lessons[S.learn.open])return vLesson(Store.d.lessons[S.learn.open]);
  const all=lessons();const fk=S.learn.kid!=='all'&&kidById(S.learn.kid);
  const list=all.filter(l=>(S.learn.subj==='all'||l.subject===S.learn.subj)&&(!fk||bandFits(l.levels,fk.band)));

const Q_PRESETS=[[30,'30 วิ'],[60,'1 นาที'],[120,'2 นาที'],[300,'5 นาที'],[600,'10 นาที']];

/* quiz engine */
function quizNow(){return Date.now()}
function startQuizFor(lessonId,kid){
  const l=Store.d.lessons[lessonId];const st=qset();const order=qsOf(l,st.mode);if(!order.length)return;
  const now=quizNow();
  S.quiz={lessonId,kid,mode:st.mode,timer:st.timer,qSec:st.qSec,setSec:st.setSec,order,i:0,res:[],picked:null,revealed:false,typed:'',
    startAt:now,qStart:now,qEnd:st.timer==='q'?now+st.qSec*1000:null,setEnd:st.timer==='set'?now+st.setSec*1000:null,setOver:false,done:false};
  quizLoop();render();window.scrollTo({top:0});
}
function curQ(){const q=S.quiz;const l=Store.d.lessons[q.lessonId];return l&&(l.questions||[])[q.order[q.i]]}
function vQuiz(){
  const q=S.quiz;const l=Store.d.lessons[q.lessonId];if(!l){S.quiz=null;return vLearn()}
  const k=kidById(q.kid);const n=q.order.length;
  if(q.done)return vQuizResult(q,l,k);
  const it=curQ();if(!it){q.done=true;return vQuizResult(q,l,k)}
  const r=q.res[q.i];const answered=!!r&&(q.mode==='mcq'||r.score!=null);
  let body='';
  if(q.mode==='mcq'){
    const pk=q.picked;
    body=`<div class="choices">${(it.choices||[]).map((c,j)=>{let cls='';if(pk!=null){if(j===it.answer)cls='right';else if(j===pk)cls='wrong'}
      return `<button class="choice ${cls}" data-act="pick" data-id="${j}" ${pk!=null?'disabled':''}><span class="L">${LET[j]}</span><span>${inline(esc(c))}</span></button>`}).join('')}</div>
      ${pk!=null?`<div class="explain"><b>${r&&r.timeout?'หมดเวลา · คำตอบคือ '+LET[it.answer]:pk===it.answer?'ถูกต้อง':'ยังไม่ถูก คำตอบคือ '+LET[it.answer]}</b>${it.explain?`<div>${md(it.explain)}</div>`:''}</div>`:''}`;
  }else{
    const mx=qMax(it);
    body=!q.revealed?`<label class="field"><span>คำตอบของ ${esc(k?k.code:'')}</span><textarea id="meqAns" class="meq-box" data-input="meq" placeholder="เขียนคำตอบ อธิบายเป็นขั้นตอน">${esc(q.typed)}</textarea></label>
      <div class="btns"><button class="btn primary big" data-act="meqSubmit">ส่งคำตอบ แล้วดูเฉลย</button></div>`
    :`<div class="meq-yours"><span class="label">คำตอบของ ${esc(k?k.code:'')}${r&&r.timeout?' · หมดเวลา':''}</span><div class="prose">${q.typed.trim()?md(q.typed):'<span class="muted">ไม่ได้เขียนคำตอบ</span>'}</div></div>
      <div class="explain"><b>แนวคำตอบ</b>${it.key||it.answer?`<div class="prose">${md(it.key||it.answer||'')}</div>`:'<div class="muted">ยังไม่ได้ใส่แนวคำตอบ</div>'}${it.explain?`<div class="small muted">${md(it.explain)}</div>`:''}</div>
      <div class="qgroup"><span class="label">ให้คะแนน (เต็ม ${mx})</span><div class="chips">${Array.from({length:mx+1},(_,s)=>`<button class="chip" data-act="meqScore" data-id="${s}" aria-pressed="${r&&r.score===s}">${s}</button>`).join('')}</div></div>`;
  }
  const cEnd=q.timer==='q'?q.qEnd:q.timer==='set'&&!q.setOver?q.setEnd:null;
  const clock=q.timer==='none'?'':`<span class="clock ${cEnd&&cEnd-quizNow()<=10000?'warn':''}" id="qClock" aria-label="เวลาที่เหลือ">${cEnd?fmtTime((cEnd-quizNow())/1000):'—'}</span>`;
  return `<section class="quiz">
    <div class="qtop">${pawn(k)}<div class="bar"><i style="width:${(q.i/n*100).toFixed(1)}%"></i></div><span class="label">${q.mode.toUpperCase()} · ข้อ ${q.i+1}/${n}</span>${clock}<button class="btn sm ghost" data-act="endQuiz">ออก</button></div>
    ${q.setOver?'<div class="banner">หมดเวลาทั้งชุด ข้อที่ยังไม่ได้ทำนับเป็น 0</div>':''}
    ${q.mode==='meq'?`<span class="tag">เต็ม ${qMax(it)} คะแนน</span>`:''}
    <div class="qtext">${md(it.q)}</div>${body}
    ${answered?`<div class="btns"><button class="btn primary big" data-act="nextQ">${q.i+1<n&&!q.setOver?'ข้อต่อไป':'ดูผล'}</button></div>`:''}
  </section>`;
}
function vQuizResult(q,l,k){
  const qs=l.questions||[];const meq=q.mode==='meq';
  const got=q.res.reduce((s,r)=>s+(r?(meq?(+r.score||0):(r.ok?1:0)):0),0);
  const full=meq?q.order.reduce((s,ix)=>s+qMax(qs[ix]||{}),0):q.order.length;
  const used=((q.endAt||quizNow())-q.startAt)/1000;
  return `<section class="quiz"><div class="panel result">${pawn(k,'lg')}<span class="label">${esc(l.title)} · ${meq?'MEQ':'MCQ'}</span><div class="score">${got}/${full}</div>
    <p class="muted small">ใช้เวลา ${fmtDur(used)}${q.timer==='set'?' จาก '+fmtDur(q.setSec):q.timer==='q'?' · จับเวลาข้อละ '+fmtDur(q.qSec):''}</p>
    <p>${q.firstTime?(got?`ได้ ${got} แต้มเข้าบ้าน`:'ครั้งนี้ยังไม่ได้แต้ม ลองทบทวนหัวข้ออีกรอบ'):'เคยทำ'+(meq?' MEQ ':' MCQ ')+'บทนี้แล้ว รอบนี้เป็นรอบฝึก ไม่นับแต้มเพิ่ม'}</p>
    ${got===full&&full?'<p><b>เต็มทุกข้อ</b></p>':''}
    <ol class="review">${q.order.map((ix,i)=>{const it=qs[ix]||{};const r=q.res[i];const ok=r&&(meq?(+r.score||0)>=qMax(it):r.ok);
      const mark=meq?`${r&&r.score!=null?r.score:0}/${qMax(it)}`:(r&&r.ok?'ถูก':'ผิด');
      return `<li class="${ok?'ok':'no'}"><span class="rv">${mark}</span><span class="rq">${esc(plain(it.q).slice(0,80))}${plain(it.q).length>80?'…':''}</span>${r&&r.timeout?'<span class="tag">หมดเวลา</span>':''}${r&&r.skipped?'<span class="tag">ไม่ได้ทำ</span>':''}</li>`}).join('')}</ol>
    <div class="btns"><button class="btn" data-act="retryQuiz">ทำอีกรอบ</button><button class="btn primary" data-act="endQuiz">กลับบทเรียน</button></div></div></section>`;
}
let qTick=null;
function quizLoop(){clearInterval(qTick);qTick=setInterval(()=>{
  const q=S.quiz;if(!q||q.done){clearInterval(qTick);return}
  const now=quizNow();const el=document.getElementById('qClock');
  const end=q.timer==='q'?q.qEnd:q.timer==='set'?(q.setOver?null:q.setEnd):null;
  if(el){if(end){const left=(end-now)/1000;el.textContent=fmtTime(left);el.classList.toggle('warn',left<=10)}else if(q.timer!=='none'){el.textContent='—';el.classList.remove('warn')}}
  if(end&&now>=end)quizTimeout();
},250)}
function quizTimeout(){
  const q=S.quiz;const it=curQ();if(!q||!it)return;
  const box=document.getElementById('meqAns');if(box)q.typed=box.value;
  if(q.timer==='q'){q.qEnd=null;
    if(q.mode==='mcq'){if(q.picked==null){q.picked=-1;q.res[q.i]={ok:false,picked:-1,timeout:true,secs:q.qSec}}}
    else if(!q.revealed){q.revealed=true;q.res[q.i]={text:q.typed,score:null,timeout:true,secs:q.qSec}}
  }else if(q.timer==='set'){q.setOver=true;q.endAt=quizNow();
    for(let i=q.i+1;i<q.order.length;i++)q.res[i]=q.mode==='mcq'?{ok:false,skipped:true}:{score:0,skipped:true};
    if(q.mode==='mcq'){if(q.picked==null)q.res[q.i]={ok:false,timeout:true};q.endAt=quizNow();finishQuiz();return}
    if(!q.revealed){q.revealed=true;q.res[q.i]={text:q.typed,score:null,timeout:true}}
  }
  render();
}
async function finishQuiz(){
  const q=S.quiz;const l=Store.d.lessons[q.lessonId];const qs=l.questions||[];const meq=q.mode==='meq';
  clearInterval(qTick);q.endAt=q.endAt||quizNow();
  const got=q.res.reduce((s,r)=>s+(r?(meq?(+r.score||0):(r.ok?1:0)):0),0);
  const full=meq?q.order.reduce((s,ix)=>s+qMax(qs[ix]||{}),0):q.order.length;
  q.firstTime=!logs().some(e=>e.kind==='quiz'&&e.kid===q.kid&&e.lessonId===q.lessonId&&(e.mode||'mcq')===q.mode);
  q.done=true;
  if(!q.saved){q.saved=true;
    await Store.put('log',uid(),{kid:q.kid,kind:'quiz',mode:q.mode,lessonId:l.id,title:l.title,subject:l.subject,score:got,total:full,perfect:got===full&&full>0,pts:q.firstTime?got:0,secs:Math.round((q.endAt-q.startAt)/1000),timer:q.timer,at:Date.now()});}
  render();window.scrollTo({top:0});
}
function quizAdvance(){
  const q=S.quiz;if(q.i+1<q.order.length&&!q.setOver){
    q.i++;q.picked=null;q.revealed=false;q.typed='';const now=quizNow();q.qStart=now;if(q.timer==='q')q.qEnd=now+q.qSec*1000;
    render();window.scrollTo({top:0});
  }else{q.endAt=q.endAt||quizNow();finishQuiz()}
}

    </article>`).join('')}</div>`:`<div class="empty"><b>${all.length?'ไม่มีเกมประเภทนี้':'ยังไม่มีเกมในคลัง'}</b><p>เพิ่มเกมที่เล่นกันในบ้าน เช่น ไพ่ บอร์ดเกม หรือเกมที่คิดขึ้นเอง พร้อมกติกาและตัวช่วยที่ใช้</p>${S.bro?'<button class="btn primary" data-act="gameForm">เพิ่มเกม</button>':''}</div>`}
  </section>
  <section class="sec"><div class="sec-head"><h2>บันทึกการเล่น</h2></div>
    <div class="panel">${ss.length?`<div class="scroll"><table class="table"><thead><tr><th>วันที่</th><th>เกม</th><th>คนเล่น</th><th>ผล</th>${S.bro?'<th></th>':''}</tr></thead><tbody>${ss.map(s=>`<tr><td class="small">${dfmt(s.at)}</td><td>${esc(s.game)}</td><td><span class="stack">${(s.players||[]).map(p=>playerPawn(p,'sm')).join('')}</span></td><td class="small">${s.coop?(s.win?'ผ่านด่าน':'ยังไม่ผ่าน'):((s.winners||[]).length?'ชนะ: '+s.winners.map(w=>esc(playerName(w))).join(', '):'—')}</td>${S.bro?`<td>${S.confirm==='ses:'+s.id?`<button class="btn sm dangerfill" data-act="delSession" data-id="${esc(s.id)}">ยืนยัน</button>`:`<button class="btn sm ghost" data-act="ask" data-id="ses:${esc(s.id)}">ลบ</button>`}</td>`:''}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">ยังไม่มีบันทึก เมื่อจบเกมในตัวช่วยเล่นแล้วกดบันทึก ผลจะมาอยู่ที่นี่</p>'}</div>
  </section>`;
}

/* ---------- Baan Suay Game Show (jeopardy board) ---------- */
const GUEST_COLORS=['#6B7785','#0E8C9C','#8A6A3B','#C2416B','#4A5868'];
const pk=p=>p.id||('g:'+p.name);
const catName=n=>esc(n).replace(/&amp;/g,'&amp;<wbr>').replace(/\//g,'/<wbr>');
const clone=o=>JSON.parse(JSON.stringify(o));
const boards=()=>Object.values(Store.d.boards).sort((a,b)=>(a.at||0)-(b.at||0));
const bRows=b=>b.cats&&b.cats.length?Math.max(...b.cats.map(c=>(c.qs||[]).length)):0;
function bNorm(b){b=clone(b);b.cats=b.cats||[];const n=bRows(b)||1;b.cats.forEach(c=>{c.qs=c.qs||[];while(c.qs.length<n)c.qs.push({q:'',a:'',pts:''})});b.final=b.final||{cat:'',q:'',a:''};return b}
function bVal(b,c,r){
  const step=+b.step||10;const cell=b.cats[c]&&b.cats[c].qs[r];
  if(b.ptsMode==='custom'&&cell&&cell.pts!==''&&cell.pts!=null&&!isNaN(+cell.pts))return +cell.pts;
  if(b.ptsMode==='row')return (r+1)*step;
  return (r*b.cats.length+c+1)*step;
}
function newBoard(cols,rows){return {title:'Baan Suay Game Show',ptsMode:'seq',step:10,
  cats:Array.from({length:cols},(_,i)=>({name:'หัวข้อ '+(i+1),qs:Array.from({length:rows},()=>({q:'',a:'',pts:''}))})),final:{cat:'',q:'',a:''},at:Date.now()}}
function bsBoardNow(){const s=S.bs;let b=s&&Store.d.boards[s.boardId];if(!b){const all=boards();if(all.length){b=all[0];if(s)s.boardId=b.id}}return b?Object.assign(bNorm(b),{id:b.id}):null}
async function saveBoard(b){await Store.put('boards',b.id,b)}
function bsScores(s,b){
  const sc={};s.players.forEach(p=>{sc[pk(p)]=0});
  Object.keys(s.used||{}).forEach(k=>{const [c,r]=k.split('-').map(Number);if(!b||!b.cats[c]||r>=b.cats[c].qs.length)return;const v=bVal(b,c,r);(s.used[k].w||[]).forEach(x=>{if(x in sc)sc[x]+=v})});
  const f=s.final;if(f&&f.done)s.players.forEach(p=>{const x=pk(p);const w=+((f.wager||{})[x])||0;sc[x]+=(f.right||{})[x]?w:-w});
  return sc;
}
function bsPawnBtn(p,act,on,cls){const k=p.id&&kidById(p.id);const code=k?k.code:(p.code||String(p.name).slice(0,2));
  return `<button type="button" class="pawn ${cls||''}" style="--c:${okColor(k?k.color:p.color)}" data-act="${act}" data-id="${esc(pk(p))}" aria-pressed="${on?'true':'false'}" aria-label="${esc(playerName(p))}">${esc(code)}</button>`}
function bsScoreBar(s,b){const sc=bsScores(s,b);
  return s.players.length?`<div class="bs-scores">${s.players.map(p=>`<span>${playerPawn(p)}${sc[pk(p)]}</span>`).join('')}</div>`:''}

function vBsgs(){
  if(!S.bs)S.bs={phase:'setup',boardId:null,players:[],used:{},open:null,revealed:false,got:[],final:null,edit:false,saved:false,award:5};
  const s=S.bs;const b=bsBoardNow();
  if(!b){return `<div class="empty"><b>ยังไม่มีกระดานเกมโชว์</b><p>สร้างกระดานแล้วใส่หัวข้อ คำถาม และเฉลย</p>${S.bro?'<button class="btn primary" data-act="bsNewBoard">สร้างกระดาน</button>':'<button class="btn primary" data-act="toggleBro">เปิดโหมดพี่เพื่อสร้างกระดาน</button>'}</div>`}
  if(s.edit&&!S.bro)s.edit=false;
  if(s.phase==='setup')return bsSetup(s,b);
  if(s.phase==='q')return bsQuestion(s,b);
  if(s.phase==='final')return bsFinalView(s,b);
  if(s.phase==='end')return bsEnd(s,b);
  return bsBoardView(s,b);
}
function bsSetup(s,b){
  const all=boards();const filled=b.cats.reduce((n,c)=>n+c.qs.filter(q=>q.q).length,0);const total=b.cats.length*bRows(b);
  return `<div class="stage">
    ${all.length>1?`<div><h3>เลือกกระดาน</h3></div><div class="chips">${all.map(x=>`<button class="chip" data-act="bsPickBoard" data-id="${esc(x.id)}" aria-pressed="${x.id===b.id}">${esc(x.title||'กระดาน')}</button>`).join('')}</div>`:''}
    <div class="panel" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><b style="font-family:var(--f-head);font-weight:600">${esc(b.title)}</b><div class="small muted">${b.cats.length} หัวข้อ · หัวข้อละ ${bRows(b)} ข้อ · ใส่คำถามแล้ว ${filled}/${total} ช่อง${b.final.q?' · มีคำถามสุดท้ายแล้ว':' · ยังไม่มีคำถามสุดท้าย'}</div></div>
      ${S.bro?'<button class="btn" data-act="bsEditMode">แก้ไขกระดาน</button>':''}</div>
    <div><h3>คนเล่น ${s.players.length} คน</h3><p class="muted small">แตะเพื่อเลือก เล่นเป็นทีมก็ได้ โดยเพิ่มชื่อทีมในช่องด้านล่าง</p></div>
    <div class="pawns">${kids().map(k=>pawnBtn(k,'bsPlayer',s.players.some(p=>p.id===k.id),'lg')).join('')}</div>
    <div class="row2"><label class="field"><span>เพื่อน แขก หรือชื่อทีม</span><input type="text" id="bsGuest" placeholder="เช่น ทีมแดง"></label><div style="align-self:end"><button class="btn" data-act="bsGuest">เพิ่ม</button></div></div>
    ${s.players.some(p=>!p.id)?`<div><p class="muted small">แตะเพื่อเอาออก</p><div class="pawns">${s.players.filter(p=>!p.id).map(p=>bsPawnBtn(p,'bsPlayer',true,'lg')).join('')}</div></div>`:''}
    <div class="btns"><button class="btn primary big" data-act="bsStart" ${s.players.length?'':'disabled'}>${s.players.length?'เปิดกระดาน':'เลือกคนเล่นก่อน'}</button></div>
  </div>`;
}
function bsBoardView(s,b){
  const cols=b.cats.length,rows=bRows(b);const edit=!!s.edit;
  let cells='';
  b.cats.forEach((c,ci)=>{cells+=edit?`<button type="button" class="bs-cat" data-act="bsCat" data-c="${ci}">${c.name?catName(c.name):'ตั้งชื่อหัวข้อ'}</button>`:`<div class="bs-cat">${catName(c.name)}</div>`});
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const key=c+'-'+r;const v=bVal(b,c,r);const cell=b.cats[c].qs[r];const u=s.used[key];
    if(edit)cells+=`<button type="button" class="bs-cell ${cell.q?'':'blank'}" data-act="bsOpen" data-c="${c}" data-r="${r}" aria-label="แก้ไข ${esc(b.cats[c].name)} ${v}">${v}</button>`;
    else if(u)cells+=`<button type="button" class="bs-cell used" data-act="bsOpen" data-c="${c}" data-r="${r}" aria-label="${esc(b.cats[c].name)} ${v} เล่นแล้ว">${(u.w||[]).length?`<span class="who">${u.w.map(x=>{const p=s.players.find(p=>pk(p)===x);return p?playerPawn(p,'sm'):''}).join('')}</span>`:'<span class="none">ไม่มีใครได้</span>'}</button>`;
    else cells+=`<button type="button" class="bs-cell" data-act="bsOpen" data-c="${c}" data-r="${r}">${v}</button>`;
  }
  const left=cols*rows-Object.keys(s.used).length;
  return `<div class="bs">
    <div class="bs-head"><h3 class="bs-title">${esc(b.title)}</h3><button type="button" class="bs-finalbtn" data-act="bsFinal">${edit?'แก้ Final Question':'Final Question!'}</button></div>
    <div class="bs-scroll"><div class="bs-grid" style="--cols:${cols}">${cells}</div></div>
    ${edit?`<div class="bs-tools"><button class="bs-btn ghost" data-act="bsAddCol" ${cols>=10?'disabled':''}>+ หัวข้อ</button><button class="bs-btn ghost" data-act="bsDelCol" ${cols<=1?'disabled':''}>− หัวข้อ</button><button class="bs-btn ghost" data-act="bsAddRow" ${rows>=10?'disabled':''}>+ แถว</button><button class="bs-btn ghost" data-act="bsDelRow" ${rows<=1?'disabled':''}>− แถว</button><button class="bs-btn ghost" data-act="bsSettings">ชื่อและคะแนน</button><button class="bs-btn" data-act="bsEditMode">เสร็จแล้ว</button></div>
      <p class="bs-note">แตะหัวข้อเพื่อเปลี่ยนชื่อ แตะช่องคะแนนเพื่อใส่คำถามและเฉลย · จุดแดงคือช่องที่ยังไม่มีคำถาม</p>`
    :bsScoreBar(s,b)}
  </div>
  ${edit?'':`<div class="btns" style="margin-top:14px">${S.bro?'<button class="btn" data-act="bsEditMode">แก้ไขกระดาน</button>':''}<button class="btn" data-act="bsEndNow">จบเกม${left?' (เหลือ '+left+' ช่อง)':''}</button><button class="btn ghost" data-act="bsToSetup">เปลี่ยนคนเล่นหรือกระดาน</button></div>`}`;
}
function bsQuestion(s,b){
  const [c,r]=s.open;const cat=b.cats[c];const cell=cat&&cat.qs[r];
  if(!cell){s.phase='board';return bsBoardView(s,b)}
  const v=bVal(b,c,r);const key=c+'-'+r;const was=s.used[key];
  return `<div class="bs bs-q">
    <div class="bs-qtop"><span>${esc(cat.name)}</span><span class="bs-pts">${v}</span></div>
    <div class="bs-qtext md">${cell.q?md(cell.q):'<span style="opacity:.6">ช่องนี้ยังไม่มีคำถาม</span>'}</div>
    ${s.revealed?`<div class="bs-ans md"><span class="bs-label">เฉลย</span>${cell.a?md(cell.a):'—'}</div>`:''}
    <div><span class="bs-label">ใครตอบถูก แตะได้มากกว่า 1 คน</span><div class="pawns">${s.players.map(p=>bsPawnBtn(p,'bsGot',s.got.includes(pk(p)),'lg')).join('')}</div></div>
    <div class="bs-tools">
      ${s.revealed?'':'<button class="bs-btn" data-act="bsReveal">เฉลย</button>'}
      <button class="bs-btn" data-act="bsMark" ${s.got.length?'':'disabled'}>${s.got.length?'ให้ '+v+' คะแนน ('+s.got.length+' คน)':'เลือกคนที่ตอบถูก'}</button>
      <button class="bs-btn ghost" data-act="bsNone">ไม่มีใครตอบได้</button>
      ${was?'<button class="bs-btn line" data-act="bsClear">คืนช่องนี้ให้ยังไม่เล่น</button>':''}
      <button class="bs-btn line" data-act="bsBack">กลับกระดาน</button>
      ${S.bro?`<button class="bs-btn line" data-act="bsCellForm" data-c="${c}" data-r="${r}">แก้ข้อนี้</button>`:''}
    </div>
  </div>`;
}
function bsMaxWager(s,b,sc,x){let top=0;b.cats.forEach((c,ci)=>c.qs.forEach((q,ri)=>{top=Math.max(top,bVal(b,ci,ri))}));return Math.max(sc[x]||0,top)}
function bsFinalView(s,b){
  const f=s.final;const fq=b.final;const sc=bsScores(s,b);
  if(!fq.q)return `<div class="bs bs-q"><div class="bs-final-title">Final Question!</div><p class="bs-qtext" style="font-size:1.2rem">ยังไม่ได้ตั้งคำถามสุดท้าย</p><div class="bs-tools">${S.bro?'<button class="bs-btn" data-act="bsFinalForm">ตั้งคำถามสุดท้าย</button>':''}<button class="bs-btn line" data-act="bsFinalBack">กลับกระดาน</button></div></div>`;
  if(f.step==='wager')return `<div class="bs bs-q">
    <div class="bs-final-title">Final Question!</div>
    <div class="bs-qtop" style="justify-content:center"><span>หัวข้อ: <b class="bs-pts">${esc(fq.cat||'ลับเฉพาะ')}</b></span></div>
    <div><span class="bs-label">ลงเดิมพัน ตอบถูกได้คะแนนเท่าที่ลง ตอบผิดเสียเท่าที่ลง</span>
    ${s.players.map((p,i)=>{const x=pk(p);return `<div class="bs-wrow">${playerPawn(p)}<span>${esc(playerName(p))}</span><span class="bs-pts">${sc[x]}</span><input type="number" id="bsW_${i}" min="0" max="${bsMaxWager(s,b,sc,x)}" value="${esc((f.wager||{})[x]||0)}" aria-label="เดิมพันของ ${esc(playerName(p))} สูงสุด ${bsMaxWager(s,b,sc,x)}"></div>`}).join('')}</div>
    <p class="bs-note">ลงได้สูงสุดเท่าคะแนนที่มี หรือเท่าช่องที่แพงที่สุดบนกระดานถ้าคะแนนยังน้อย</p>
    <div class="bs-tools"><button class="bs-btn" data-act="bsWagerLock">ล็อกเดิมพัน แล้วเปิดคำถาม</button><button class="bs-btn line" data-act="bsFinalBack">กลับกระดาน</button></div>
  </div>`;
  return `<div class="bs bs-q">
    <div class="bs-qtop"><span>Final Question! · ${esc(fq.cat||'')}</span></div>
    <div class="bs-qtext md">${md(fq.q)}</div>
    ${f.step==='judge'?`<div class="bs-ans md"><span class="bs-label">เฉลย</span>${md(fq.a||'—')}</div>
      <div><span class="bs-label">แตะคนที่ตอบถูก คนที่ไม่ได้แตะถือว่าตอบผิด</span>
      ${s.players.map(p=>{const x=pk(p);const w=+((f.wager||{})[x])||0;const ok=!!(f.right||{})[x];return `<div class="bs-wrow">${bsPawnBtn(p,'bsRight',ok,'')}<span>${esc(playerName(p))}</span><span class="bs-pts">${ok?'+':'−'}${w}</span><span class="bs-pts" style="text-align:right">${sc[x]+(ok?w:-w)}</span></div>`}).join('')}</div>
      <div class="bs-tools"><button class="bs-btn" data-act="bsFinalDone">สรุปผล</button></div>`
    :'<div class="bs-tools"><button class="bs-btn" data-act="bsFinalReveal">เฉลย</button></div>'}
  </div>`;
}
function bsEnd(s,b){
  const sc=bsScores(s,b);const r=s.players.slice().sort((a,c)=>sc[pk(c)]-sc[pk(a)]);const best=r.length?sc[pk(r[0])]:0;
  return `<div class="bs bs-q" style="justify-items:center;text-align:center">
    <span class="bs-label">${esc(b.title)}</span>
    <div class="bs-final-title">${r.length&&best>0?esc(r.filter(p=>sc[pk(p)]===best).map(playerName).join(' & '))+' ชนะ':'จบเกม'}</div>
    <div class="rank bs-rank">${r.map((p,i)=>`<div><span class="no">${i+1}</span>${playerPawn(p)}<span>${esc(playerName(p))}</span><span class="v">${sc[pk(p)]}</span></div>`).join('')}</div>
    ${s.saved?'<p class="bs-note">บันทึกผลเข้าบ้านแล้ว</p>':`<label class="field" style="max-width:240px;text-align:left"><span style="color:rgba(255,255,255,.7)">แต้มบ้านให้ผู้ชนะ</span><input type="number" id="bsAward" value="${esc(s.award==null?5:s.award)}" min="0" max="50"></label><button class="bs-btn" data-act="bsSave">บันทึกผลเข้าบ้าน</button>`}
    <div class="bs-tools" style="justify-content:center"><button class="bs-btn ghost" data-act="bsReplay">เล่นใหม่ กระดานเดิม</button><button class="bs-btn line" data-act="bsToSetup">เปลี่ยนคนเล่นหรือกระดาน</button>${s.final&&s.final.done?'':'<button class="bs-btn line" data-act="bsBack">กลับกระดาน</button>'}</div>
  </div>`;
}
/* edit sheets */
function bsCatForm(c){const b=bsBoardNow();const ck='bscol:'+c;
  openSheet('หัวข้อที่ '+(c+1),`<label class="field"><span>ชื่อหัวข้อ</span><input type="text" id="bsCatName" value="${esc(b.cats[c].name)}"></label>`,
  `<button class="btn primary" data-act="bsCatSave" data-c="${c}">บันทึก</button>${b.cats.length>1?(S.confirm===ck?`<button class="btn dangerfill" data-act="bsColDel" data-c="${c}">ยืนยันลบหัวข้อและคำถามทั้งคอลัมน์</button>`:`<button class="btn danger" data-act="bsColAsk" data-c="${c}">ลบหัวข้อนี้</button>`):''}`)}
function bsCellForm(c,r){const b=bsBoardNow();const cell=b.cats[c].qs[r];const v=bVal(b,c,r);

function unoAct(a){
  const u=S.uno;const n=u.order.length;u.hist=u.hist||[];
  if(a==='undo'){const h=u.hist.pop();if(h)Object.assign(u,h);return}
  u.hist.push({cur:u.cur,dir:u.dir,pending:u.pending,color:u.color,msg:u.msg});if(u.hist.length>40)u.hist.shift();
  const step=k=>{u.cur=((u.cur+u.dir*k)%n+n)%n};const who=k=>playerName(u.order[((u.cur+u.dir*k)%n+n)%n]);
  u.msg='';
  if(a==='next'){step(1)}
  else if(a==='skip'){u.msg=who(1)+' โดนข้าม';step(2)}
  else if(a==='rev'){u.dir*=-1;if(n===2){u.msg='2 คนเล่น กลับทาง = ได้เล่นอีกตา'}else{step(1)}}
  else if(a==='d2'||a==='d4'){const add=a==='d2'?2:4;
    if(u.stack){u.pending=(u.pending||0)+add;step(1)}
    else{u.msg=who(1)+' จั่ว '+add+' ใบ แล้วข้าม';step(2)}}
  else if(a==='take'){u.msg=playerName(u.order[u.cur])+' จั่ว '+u.pending+' ใบ แล้วข้าม';u.pending=0;step(1)}
}

let tick=null,actx=null;
function paintTimer(){const el=$('#timerDigits');if(!el)return;const t=S.timer;let left=t.run?Math.max(0,Math.ceil((t.endAt-Date.now())/1000)):t.left;el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
function timerLoop(){clearInterval(tick);tick=setInterval(()=>{const t=S.timer;if(!t.run){clearInterval(tick);return}
  const left=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));if(left<=0){t.run=false;t.left=0;t.done=true;clearInterval(tick);beep();if(S.tab==='tools')render();return}paintTimer()},250)}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.28);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.3)})}catch(e){}}

function vStickers(){

function syncDraft(){
  const d=S.draft;if(!d)return;
  d.subject=val('lfSubj')||d.subject;d.title=val('lfTitle');const ct=document.getElementById('lfContent');if(ct)d.content=ct.value;d.levels=radios('lfLv');
  d.topics.forEach((t,i)=>{t.name=val('t'+i+'_name');const s=radio('t'+i+'_star');t.stars=s?+s:0;const g=document.getElementById('t'+i+'_goals');if(g)t.goals=g.value});
  d.questions.forEach((q,i)=>{
    const t=document.getElementById('q'+i+'_type');if(t)q.type=t.value;
    q.q=(document.getElementById('q'+i+'_q')||{}).value||'';q.explain=val('q'+i+'_e');
    const k=document.getElementById('q'+i+'_k');if(k)q.key=k.value;
    const m=document.getElementById('q'+i+'_m');if(m)q.max=Math.max(1,Math.min(20,Math.round(+m.value||1)));
    q.choices=q.choices.map((c,j)=>{const e=document.getElementById('q'+i+'_c'+j);return e?e.value:c});
    const r=radio('q'+i+'_ans');if(r!=='')q.answer=+r;

function parseBulk(txt){
  const out=[];
  txt.split(/\n\s*\n/).forEach(block=>{
    const lines=block.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
    const q=blankQ('mcq');q.choices=[];q.answer=-1;let ans='',max=0;
    lines.forEach((ln,idx)=>{let m;
      if((m=ln.match(/^(\*)?\s*([A-Ha-h])[).]\s+(.*)$/))&&idx>0){if(m[1])q.answer=q.choices.length;q.choices.push(m[3].replace(/\s*\*$/,''));if(/\*$/.test(m[3]))q.answer=q.choices.length-1;return}
      if((m=ln.match(/^(ANS|Ans|ans|ตอบ|เฉลย|แนวคำตอบ)\s*[:：]\s*(.*)$/))){ans+=(ans?'\n':'')+m[2];return}
      if((m=ln.match(/^(คะแนน|คะแนนเต็ม|max|Max)\s*[:：]\s*(\d+)/))){max=+m[2];return}
      if((m=ln.match(/^(E|อธิบาย|เหตุผล)\s*[:：]\s*(.*)$/))){q.explain=m[2];return}
      if(ans&&!q.choices.length){ans+='\n'+ln;return}
      q.q+=(q.q?'\n':'')+ln.replace(/^(Q\s*[:：]|\d+\s*[.)])\s*/,'');
    });
    if(q.choices.length>=2){if(q.answer<0){const L=ans.trim().toUpperCase().charAt(0);const ix=LET.indexOf(L);q.answer=ix>=0&&ix<q.choices.length?ix:0}}
    else{q.type='meq';q.choices=['','','',''];q.answer=0;q.key=ans;q.max=max||2}
    if(q.q)out.push(q);
  });
  return out;
}
async function saveLesson(){
  syncDraft();const d=S.draft;
  if(!d.title){toast('ใส่ชื่อบทก่อนบันทึก');return}
  const topics=d.topics.filter(t=>t.name.trim()||t.goals.trim()).map(t=>({name:t.name.trim(),stars:t.stars||0,goals:t.goals.split('\n').map(s=>s.replace(/^\s*[-•]\s*/,'').trim()).filter(Boolean)}));
  const qs=d.questions.filter(q=>q.q.trim()).map(q=>{
    if(q.type==='meq')return {type:'meq',q:q.q.trim(),key:(q.key||'').trim(),max:Math.max(1,+q.max||1),explain:q.explain};
    const kept=q.choices.map((c,j)=>({c:c.trim(),j})).filter(x=>x.c);
    return {type:'mcq',q:q.q.trim(),choices:kept.map(x=>x.c),answer:kept.findIndex(x=>x.j===q.answer),explain:q.explain}});
  const bad=qs.find(q=>q.type==='mcq'&&(q.choices.length<2||q.answer<0));
  if(bad){toast('มี MCQ ที่ตัวเลือกไม่ครบ หรือยังไม่ได้เลือกคำตอบที่ถูก');return}
  const id=d.id||uid();const old=d.id&&Store.d.lessons[d.id];
  await Store.put('lessons',id,{subject:d.subject,title:d.title,levels:d.levels,topics,content:d.content,questions:qs,example:d.example&&!!old,at:old&&old.at||Date.now()});
  closeSheet();S.learn.open=id;toast('บันทึกบทเรียนแล้ว');render();
}

/* drag a topic or question box by its grip to reorder it */
function startDrag(e,grip){
  const item=grip.closest('[data-drag]');const list=item&&item.parentElement;if(!item||!list||!S.draft)return;
  const kind=item.dataset.drag;const items=Array.from(list.children).filter(el=>el.dataset&&el.dataset.drag===kind);
  const from=items.indexOf(item);if(from<0||items.length<2)return;
  const sc=$('#sheetCard');const s0=sc.scrollTop;const y0=e.clientY;
  const rs=items.map(el=>{const r=el.getBoundingClientRect();return {top:r.top+s0,h:r.height}});
  const gap=rs.length>1?Math.max(0,rs[1].top-(rs[0].top+rs[0].h)):12;const H=rs[from].h+gap;
  let to=from,lastY=y0,raf=0;
  item.classList.add('dragging');try{grip.setPointerCapture(e.pointerId)}catch(_){}
  const layout=()=>{
    const dy=(lastY-y0)+(sc.scrollTop-s0);item.style.transform=`translateY(${dy}px)`;
    const c=rs[from].top+rs[from].h/2+dy;to=from;
    for(let i=0;i<rs.length;i++){if(i===from)continue;const mid=rs[i].top+rs[i].h/2;if(i>from&&c>mid)to=i;if(i<from&&c<mid&&to>=from)to=i}
    items.forEach((el,i)=>{if(i===from)return;let off=0;if(from<to&&i>from&&i<=to)off=-H;if(to<from&&i>=to&&i<from)off=H;el.style.transform=off?`translateY(${off}px)`:''});
  };
  const edge=()=>{const r=sc.getBoundingClientRect();let v=0;if(lastY<r.top+70)v=-12;else if(lastY>r.bottom-70)v=12;if(v){sc.scrollTop+=v;layout()}raf=requestAnimationFrame(edge)};
  raf=requestAnimationFrame(edge);
  const move=ev=>{lastY=ev.clientY;layout();ev.preventDefault()};
  const up=()=>{cancelAnimationFrame(raf);grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);
    items.forEach(el=>{el.style.transform='';el.classList.remove('dragging')});
    if(to!==from){syncDraft();const a=kind==='t'?S.draft.topics:S.draft.questions;const [x]=a.splice(from,1);a.splice(to,0,x);paintLessonForm()}};
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
}
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(g&&(e.button===0||e.pointerType!=='mouse')){e.preventDefault();startDrag(e,g)}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.input==='meq'&&S.quiz)S.quiz.typed=e.target.value});
document.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.change;if(!c)return;
  if(c==='qtype'){syncDraft();paintLessonForm()}
  if(c==='qsCustom'){const v=parseFloat(e.target.value);if(v>0){const st=qset();const sec=Math.round(v*60);if(st.timer==='q')st.qSec=sec;else st.setSec=sec;LS.set('qset',st);render()}}
  if(c==='unoStack'){S.uno.stack=e.target.checked;persist()}
  if(c==='scLow'){S.score.low=e.target.checked;persist()}
  if(c==='scGame'){S.score.game=e.target.value.trim();persist()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* hook for future games: House.registerTool({id,name,desc,view:()=>html}) */
window.House={registerTool(def){if(def&&def.id&&typeof def.view==='function'){TOOLS[def.id]={view:def.view,name:def.name,desc:def.desc};render()}},store:Store,kids,act:ACT,render};

render();
Store.init();
})();
</script>
