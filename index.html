function tbExit(msg){tbUnsub();Object.assign(S.tb,{code:null,room:null,loaded:false,hide:false,reveal:0,seenRound:0,outs:null});LS.set('tbRoom',null);tbWake(false);if(msg)toast(msg);render()}
function tbOnRoom(d){
  const first=!S.tb.loaded;S.tb.loaded=true;
  if(!d){tbExit(first?'ไม่เจอห้องนี้แล้ว':'ห้องนี้ปิดไปแล้ว');return}
  const me=tbMe(d);
  if(!me||me.left){tbExit(first?'':'คุณออกจากห้องแล้ว');return}
  if(d.status==='play'&&me.inGame&&d.round!==S.tb.seenRound){S.tb.seenRound=d.round;S.tb.hide=false;S.tb.reveal=d.mode==='circle'?Date.now()+3200:0}
  /* someone was just caught: beep, and buzz the phone of whoever it was */
  const outs={};tbIn(d).forEach(p=>{if(p.out)outs[p.pid]=p.outAt||1});
  if(S.tb.outs&&d.round===S.tb.outsRound){const fresh=Object.keys(outs).filter(id=>!S.tb.outs[id]);if(fresh.length)tbBeep(fresh.includes(TB_ME))}
  S.tb.outs=outs;S.tb.outsRound=d.round;
  S.tb.room=d;
  /* the game master (or host) moves the round on: last one standing → guessing, every guess judged → round summary */
  if(d.status==='play'&&!d.paused&&tbCtl(d)&&tbIn(d).length>=2&&tbAlive(d).length<=1)tbRoundOver('last');
  if(d.status==='guess'&&tbCtl(d)&&tbGuessDone(d)){const r=d.round;setTimeout(()=>{const x=S.tb.room;if(x&&x.status==='guess'&&x.round===r&&tbGuessDone(x))tbCloseRound()},1200)}
  changed();
}
let tbLock=null;
async function tbWake(on){try{if(on&&!tbLock&&navigator.wakeLock&&document.visibilityState==='visible'){tbLock=await navigator.wakeLock.request('screen');tbLock.addEventListener('release',()=>{tbLock=null})}
  else if(!on&&tbLock){const l=tbLock;tbLock=null;await l.release()}}catch(e){}}
const tbWants=()=>!!(S.tb&&S.tb.code&&S.tb.room&&(S.tb.room.status==='play'||S.tb.room.status==='guess')&&S.tab==='tools'&&S.tool==='taboo');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tbWants())tbWake(true)});
let tbAC=null;
function tbBeep(mine){try{if(navigator.vibrate)navigator.vibrate(mine?[250,120,250]:120)}catch(e){}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;tbAC=tbAC||new C();const t=tbAC.currentTime;
    [[740,0],[520,.16]].forEach(([f,o])=>{const g=tbAC.createGain();const s=tbAC.createOscillator();s.type='triangle';s.frequency.value=f;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.15);s.connect(g);g.connect(tbAC.destination);s.start(t+o);s.stop(t+o+.16)})}catch(e){}}
setInterval(()=>{if(!(S.tb&&S.tb.room))return;const d=S.tb.room;
  /* time up: everyone beeps once, the game master/host moves the round to guessing; anyone steps in if that phone is asleep */
  if(d.status==='play'&&+d.limit>0&&!d.paused&&tbLeft(d)<=0&&S.tb.timeUp!==d.round){S.tb.timeUp=d.round;tbBeep(false);if(tbCtl(d))tbRoundOver('time')}
  if(d.status==='play'&&+d.limit>0&&!d.paused&&tbLeft(d)<=-4&&S.tb.timeUp2!==d.round){S.tb.timeUp2=d.round;tbRoundOver('time')}
  const stuck=(d.status==='play'&&!d.paused&&tbIn(d).length>=2&&tbAlive(d).length<=1)||(d.status==='guess'&&tbGuessDone(d));
  if(stuck){const key=d.status+d.round;if(S.tb.stuckKey!==key){S.tb.stuckKey=key;S.tb.stuckAt=Date.now()}else if(Date.now()-S.tb.stuckAt>6000&&S.tb.stuckDone!==key){S.tb.stuckDone=key;if(d.status==='play')tbRoundOver('last');else tbCloseRound()}}
  if(!(S.tab==='tools'&&S.tool==='taboo'))return;
  const el=document.getElementById('tbClock');if(el){el.textContent=tbClock(d);el.classList.toggle('warn',d.status==='play'&&+d.limit>0&&tbLeft(d)<=10)}
  const rv=document.getElementById('tbRevealN');if(rv){const left=Math.ceil((S.tb.reveal-Date.now())/1000);if(left<=0)render();else if(rv.textContent!==String(left))rv.textContent=left}},250);

/* game moves
   a game = many rounds; each round: play → guess (players still in guess their own word) → roundEnd (summary + score table)
   points per round: ฆ่าได้ +1 each, รอดถึงจบ round +1, เดาคำตัวเองถูก +1 (only those who survived) */
const TB_WHY={time:'หมดเวลา',last:'เหลือคนสุดท้าย',manual:'จบ round',final:'จบเกม'};
const tbGuessDone=d=>{const a=tbAlive(d);return a.length>0&&a.every(p=>p.guess===true||p.guess===false)};
function tbEntry(d){const ins=tbIn(d);const pts={},words={},names={},kills={};
  ins.forEach(p=>{const k=ins.filter(v=>v.out&&v.killBy===p.pid).length;const s=!p.out;
    pts[p.pid]={k,s:s?1:0,g:s&&p.guess===true?1:0};words[p.pid]=p.word||'';names[p.pid]={name:p.name,code:p.code||'',color:p.color||'',kid:p.kid||''};if(p.out&&p.killBy)kills[p.pid]=p.killBy});
  return {r:+d.round||0,why:d.endBy||'',at:Date.now(),pts,words,names,kills}}
const tbHistWith=d=>(d.history||[]).filter(x=>x.r!==(+d.round||0)).concat(tbEntry(d));
const tbPts=x=>(x?(+x.k||0)+(+x.s||0)+(+x.g||0):0);
function tbScoreRows(d){const hist=d.history||[];const rows={};
  const add=(pid,info)=>{if(!rows[pid])rows[pid]=Object.assign({pid,total:0,per:{}},info)};
  hist.forEach(h=>Object.keys(h.pts||{}).forEach(pid=>{add(pid,(h.names||{})[pid]||{name:'?'});rows[pid].per[h.r]=h.pts[pid];rows[pid].total+=tbPts(h.pts[pid])}));
  Object.keys(rows).forEach(pid=>{const p=(d.players||{})[pid];if(p&&!p.left)Object.assign(rows[pid],{name:p.name,code:p.code,color:p.color,kid:p.kid})});
  return Object.values(rows).sort((a,b)=>b.total-a.total||String(a.name).localeCompare(String(b.name),'th'))}
function tbFreshTime(d,o){const now=Date.now();o.endedAt=now;o.paused=false;if(d.paused&&d.pausedAt)o.pausedTotal=(+d.pausedTotal||0)+(now-d.pausedAt);return o}
async function tbRoundOver(why){const d=S.tb.room;if(!d||d.status!=='play')return;const al=tbAlive(d);
  const o=tbFreshTime(d,{endBy:why||'manual'});
  if(al.length){o.status='guess';o.players={};al.forEach(p=>{o.players[p.pid]={guess:null}});await tbPatch(o);return}
  const x=Object.assign({},d,o);o.status='roundEnd';o.history=tbHistWith(x);await tbPatch(o)}
async function tbCloseRound(){const d=S.tb.room;if(!d)return;if(d.status==='play'){await tbRoundOver('manual');return}
  if(d.status!=='guess')return;await tbPatch({status:'roundEnd',history:tbHistWith(d)})}
async function tbFinal(){const d=S.tb.room;if(!d)return;const o={status:'final'};
  if(d.status==='play'||d.status==='guess'){const t=d.status==='play'?tbFreshTime(d,{endBy:'final'}):{};Object.assign(o,t);o.history=tbHistWith(Object.assign({},d,t))}
  await tbPatch(o)}
async function tbNewGame(){const d=S.tb.room;if(!tbCtl(d))return;await tbPatch({status:'lobby',history:[],round:0,saved:false,endBy:''})}
async function tbStart(){const d=S.tb.room;if(!d)return;if(!tbCtl(d)){toast('ให้'+tbCtlName(d)+'เป็นคนกดเริ่ม');return}
  const nr=tbNarr(d);const ps=tbPlayers(d).filter(p=>p.pid!==nr);if(ps.length<2){toast('ต้องมีคนเล่นอย่างน้อย 2 คน ไม่นับผู้ดำเนินเกม');return}
  const pool=tbPool(d.cats);if(pool.length<ps.length){toast('คำในหมวดที่เลือกไม่พอ เลือกหมวดเพิ่มอีก');return}
  const recent=new Set(LS.get('tbRecent',[]).concat(d.used||[]));let fresh=shuffle(pool.filter(w=>!recent.has(w)));if(fresh.length<ps.length)fresh=shuffle(pool);
  const players={};const words=[];ps.forEach((p,i)=>{players[p.pid]={word:fresh[i],inGame:true,out:false,outAt:0,outBy:'',killBy:'',guess:null,rr:0};words.push(fresh[i])});
  if(nr)players[nr]={word:'',inGame:false,out:false,killBy:'',guess:null};
  LS.set('tbRecent',LS.get('tbRecent',[]).concat(words).slice(-300));
  await tbPatch({status:'play',host:tbHostOk(d)?d.host:TB_ME,round:(+d.round||0)+1,startedAt:Date.now()+(d.mode==='line'?0:3200),endBy:'',endedAt:0,paused:false,pausedAt:0,pausedTotal:0,winner:[],saved:false,used:(d.used||[]).concat(words).slice(-300),players})}
/* who was caught, and who made them say it: one sheet, tap the killer (or "nobody") */
function tbAskOut(pid,fix){const d=S.tb.room;if(!d||d.status!=='play'&&!(fix&&d.status==='guess'))return;if(d.paused&&!fix){toast('เกมพักอยู่ กดเล่นต่อก่อน');return}
  const p=(d.players||{})[pid];if(!p||!p.inGame||p.left||(!fix&&p.out))return;const self=pid===TB_ME;const me=tbMe(d)||{};
  const iSee=!self||!me.inGame||me.out;const ins=tbIn(d);
  const cand=ins.filter(x=>x.pid!==pid&&(fix||!x.out));
  openSheet(fix?'แก้ว่าใครฆ่า '+esc(p.name):self?'ฉันโดนแล้ว ใครฆ่า?':esc(p.name)+' โดนแล้ว ใครฆ่า?',
    `<div class="tb-ask" style="--c:${okColor(p.color)}">${tbPawn(p,'lg')}<div>${iSee?`<span class="label">คำต้องห้ามของ ${esc(p.name)}</span><div class="tb-askword">${esc(p.word)}</div>`:'<span class="muted">เลือกแล้วจะเห็นคำของตัวเอง</span>'}</div></div>
    <div class="field"><span>ใครทำให้${self?'เรา':esc(p.name)}พูดคำนี้ (คนนั้นได้ +1)</span>
      <div class="tb-killers">${cand.map(x=>{const n=ins.findIndex(y=>y.pid===x.pid)+1;return `<button type="button" class="tb-killer ${p.killBy===x.pid?'on':''}" data-act="tbOutGo" data-id="${esc(pid)}" data-k="${esc(x.pid)}" data-key="${n}" style="--c:${okColor(x.color)}">${tbPawn(x,'sm')}<span>${esc(x.name)}</span><kbd>${n}</kbd></button>`}).join('')}</div></div>
    <p class="muted small">${fix?'เปลี่ยนคนได้แต้มฆ่าของรอบนี้':'เลือกแล้ว '+(self?'คุณ':esc(p.name))+'ตกรอบทันที กดผิดกดย้อนกลับได้'}</p>`,
    `<button class="btn ${fix?'':'dangerfill'} big" data-act="tbOutGo" data-id="${esc(pid)}" data-k="" data-enter>${fix?'ไม่มีใครฆ่า':'ไม่มีใคร (พูดเอง)'} <kbd>Enter</kbd></button><button class="btn ghost big" data-act="closeSheet">ยกเลิก</button>`)}
/* "ฉันฆ่าได้": the killer reports it and picks who they caught */
function tbAskKill(){const d=S.tb.room;if(!d||d.status!=='play')return;if(d.paused){toast('เกมพักอยู่ กดเล่นต่อก่อน');return}
  const me=tbMe(d);if(!me||!me.inGame||me.out){toast('ต้องยังอยู่ในเกมถึงจะฆ่าได้');return}const ins=tbIn(d);
  const cand=ins.filter(x=>x.pid!==TB_ME&&!x.out);
  openSheet('ฉันฆ่าได้ ฆ่าใคร?',`<div class="field"><span>แตะคนที่เผลอพูดคำของตัวเอง เขาจะตกรอบ แล้วเราได้ +1</span>
    <div class="tb-killers">${cand.map(x=>{const n=ins.findIndex(y=>y.pid===x.pid)+1;return `<button type="button" class="tb-killer" data-act="tbOutGo" data-id="${esc(x.pid)}" data-k="${esc(TB_ME)}" data-key="${n}" style="--c:${okColor(x.color)}">${tbPawn(x,'sm')}<span>${esc(x.name)}<small>${esc(x.word)}</small></span><kbd>${n}</kbd></button>`}).join('')}</div></div>`,
    `<button class="btn ghost big" data-act="closeSheet">ยกเลิก</button>`)}
async function tbOutGo(pid,killer){const d=S.tb.room;if(!d)return;const p=(d.players||{})[pid];if(!p||!p.inGame)return;
  if(killer&&(killer===pid||!(d.players||{})[killer]))killer='';
  if(p.out){if(await tbPatch({players:{[pid]:{killBy:killer}}}))toast(killer?d.players[killer].name+' ได้แต้มฆ่า '+p.name:'ไม่นับแต้มฆ่า '+p.name);return}
  if(d.status!=='play')return;
  if(!await tbPatch({players:{[pid]:{out:true,outAt:Date.now(),outBy:TB_ME,killBy:killer}}}))return;
  toast(p.name+' ตกรอบ'+(killer?' · '+d.players[killer].name+' +1':''));
  const now=S.tb.room;if(now&&now.status==='play'&&tbCtl(now)&&tbAlive(now).filter(x=>x.pid!==pid).length<=1)tbRoundOver('last')}
async function tbRevive(pid){const d=S.tb.room;if(!d)return;const p=(d.players||{})[pid];if(!p||!p.out)return;
  const o={players:{[pid]:{out:false,outAt:0,outBy:'',killBy:'',guess:null}}};
  if(d.status==='guess'){if(d.endBy==='time')o.players[pid].guess=null;
    else{o.status='play';o.pausedTotal=(+d.pausedTotal||0)+Math.max(0,Date.now()-(d.endedAt||Date.now()));o.endedAt=0;o.endBy='';tbAlive(d).forEach(x=>{o.players[x.pid]={guess:null}});o.players[pid]={out:false,outAt:0,outBy:'',killBy:'',guess:null}}}
  else if(d.status!=='play')return;
  if(await tbPatch(o))toast(p.name+' กลับเข้าเกมแล้ว')}
async function tbUndo(){const d=S.tb.room;if(!d||(d.status!=='play'&&d.status!=='guess'))return;if(d.status==='guess'&&!tbCtl(d)){toast('ให้'+tbCtlName(d)+'เป็นคนย้อน');return}
  const last=tbIn(d).filter(p=>p.out).sort((a,b)=>(b.outAt||0)-(a.outAt||0))[0];if(!last){toast('ยังไม่มีใครโดน');return}
  await tbRevive(last.pid)}
async function tbPause(){const d=S.tb.room;if(!d||d.status!=='play')return;
  if(d.paused)await tbPatch({paused:false,pausedAt:0,pausedTotal:(+d.pausedTotal||0)+Math.max(0,Date.now()-(d.pausedAt||Date.now()))});
  else await tbPatch({paused:true,pausedAt:Date.now()})}
/* change a word: as many times as you like */
async function tbReroll(pid){const d=S.tb.room;if(!d||d.status!=='play')return;if(d.paused){toast('เกมพักอยู่');return}
  const p=(d.players||{})[pid];if(!p||!p.inGame||p.out)return;
  const now=new Set(tbIn(d).map(x=>x.word));const used=new Set(d.used||[]);const pool=tbPool(d.cats);
  let c=pool.filter(w=>!now.has(w)&&!used.has(w));if(!c.length)c=pool.filter(w=>!now.has(w));if(!c.length){toast('ไม่มีคำเหลือให้เปลี่ยน');return}
  const w=c[Math.floor(Math.random()*c.length)];
  if(await tbPatch({players:{[pid]:{word:w,rr:(+p.rr||0)+1}},used:(d.used||[]).concat(w).slice(-300)}))toast(pid===TB_ME?'เปลี่ยนคำของคุณแล้ว':'เปลี่ยนคำของ '+p.name+' แล้ว')}
/* guessing: the game master judges; without one, anyone but the guesser does */
const tbCanJudge=(d,pid)=>tbNarr(d)?tbIsNarr(d):pid!==TB_ME;
async function tbGuess(pid,v){const d=S.tb.room;if(!d||d.status!=='guess')return;const p=(d.players||{})[pid];if(!p||!p.inGame||p.out)return;
  if(!tbCanJudge(d,pid)){toast(tbNarr(d)?'ให้ผู้ดำเนินเกมเป็นคนตัดสิน':'ให้คนอื่นตัดสินว่าเดาถูกไหม');return}
  await tbPatch({players:{[pid]:{guess:p.guess===v?null:v}}})}

function vTaboo(){
  tbInit();
  if(Store.mode!=='shared'||!Store.db)return `<div class="empty"><b>ต้องเปิดเว็บแบบออนไลน์</b><p>คำต้องห้ามเล่นหลายเครื่องผ่านห้องออนไลน์ เปิดเว็บบ้านจากลิงก์ปกติแล้วลองใหม่</p></div>`;
  if(S.tb.code){
    if(S.tb.subCode!==S.tb.code)setTimeout(tbSub,0);
    setTimeout(()=>tbWake(tbWants()),0);
    const d=S.tb.room;
    if(!d||!S.tb.loaded)return `<div class="panel muted">กำลังเข้าห้อง ${esc(S.tb.code)}…</div>`;
    if(d.status==='play')return tbPlay(d);
    if(d.status==='guess')return tbGuessView(d);
    if(d.status==='roundEnd'||d.status==='end')return tbRoundView(d);
    if(d.status==='final')return tbFinalView(d);
    return tbLobby(d);
  }
  return tbHome();
}

document.addEventListener('keydown',e=>{
  if(!(S.tab==='tools'&&S.tool==='taboo'&&S.tb&&S.tb.code&&S.tb.room)||e.isComposing)return;
  const a=document.activeElement;if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;
  const dig=/^(Digit|Numpad)([1-9])$/.exec(e.code||'');
  /* inside the "who killed" popup: the number picks that player */
  if(!$('#sheet').hidden){if(dig&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const b=$(`#sheetCard [data-key="${dig[2]}"]`);if(b){e.preventDefault();b.click()}}return}
  const d=S.tb.room;
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&e.code==='KeyZ'){e.preventDefault();tbUndo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'){e.preventDefault();if(d.status==='play')tbPause();else if(d.status==='guess'){if(tbCtl(d))tbCloseRound()}else if(d.status!=='final'&&tbCtl(d))tbStart();return}
  if(dig){if(d.status==='play'){const p=tbIn(d)[+dig[2]-1];if(p&&!p.out){e.preventDefault();tbAskOut(p.pid)}}return}
  if(e.code==='KeyD'){e.preventDefault();tbAskOut(TB_ME);return}
  if(e.code==='KeyK'){e.preventDefault();tbAskKill();return}
  if(e.code==='KeyH'){e.preventDefault();ACT.tbHide();return}
  if(e.code==='KeyR'){e.preventDefault();tbReroll(TB_ME)}
});

function endInfo(){
  if(S.tab!=='tools'||!S.tool)return null;
  switch(S.tool){
    case 'bsgs':{const s=S.bs;if(!s||s.phase==='setup'||s.phase==='end')return null;return {name:'Baan Suay Game Show',note:'ไปหน้าสรุปคะแนนเลย ช่องที่ยังไม่เปิดจะไม่ได้เล่น',go:()=>ACT.bsEndNow()}}
    case 'uno':{const u=S.uno;if(!u||u.phase!=='play')return null;return {name:'UNO',note:'ไปหน้าเลือกว่าใครลงไพ่ใบสุดท้าย',go:()=>ACT.unoEnd()}}
    case 'score':{const s=S.score;if(!s||s.phase!=='play')return null;
      if(s.mode==='coop')return {name:s.game||'เกมช่วยกัน',note:'ทีมผ่านด่านมั้ย',choices:[{label:'ผ่านด่าน',go:()=>ACT.scCoop({dataset:{id:'win'}})},{label:'ยังไม่ผ่าน',go:()=>ACT.scCoop({dataset:{id:'lose'}})}]};
      return {name:s.game||'กระดานคะแนน',note:'ไปหน้าสรุปอันดับ',go:()=>ACT.scEnd()}}
    case 'flip7':{const f=S.flip;if(!f||f.phase!=='play'||!(f.players||[]).length)return null;return {name:'Flip 7',note:'ไปหน้าสรุปแต้ม',go:()=>ACT.f7End()}}
    case 'poker':{const P=S.poker;if(!P)return null;if(P.h&&(P.phase==='hand'||P.phase==='show'))return {block:'ยังอยู่กลางมือ เล่นมือนี้ให้จบก่อนแล้วค่อยจบเกม'};
      if(P.phase!=='ready'||!(P.players||[]).length)return null;return {name:'โป๊กเกอร์',note:'ไปหน้าสรุปชิป',go:()=>ACT.pbEnd()}}
    case 'taboo':{const d=S.tb&&S.tb.room;if(!d||!['play','guess','roundEnd','end','lobby'].includes(d.status))return null;if(d.status==='lobby'&&!(d.history||[]).length)return null;
      if(!tbCtl(d))return {block:'ให้'+tbCtlName(d)+'เป็นคนกดจบเกม'};
      return {name:'คำต้องห้าม · ห้อง '+(d.code||S.tb.code),note:(d.status==='play'||d.status==='guess'?'round นี้นับแต้มเท่าที่เล่นไปแล้ว คนที่ยังไม่ตกรอบได้ +1 ':'')+'แล้วรวมแต้มทุก round ประกาศผู้ชนะ',go:()=>tbFinal()}}
  }
  return null;
}

/* drag a topic or question box by its grip to reorder it */
function startDrag(e,grip){
  const item=grip.closest('[data-drag]');const list=item&&item.parentElement;if(!item||!list||!S.draft)return;
  const kind=item.dataset.drag;const items=Array.from(list.children).filter(el=>el.dataset&&el.dataset.drag===kind&&!el.hidden);
  const from=items.indexOf(item);if(from<0||items.length<2)return;
  const sc=$('#sheetCard');const s0=sc.scrollTop;const y0=e.clientY;
  const rs=items.map(el=>{const r=el.getBoundingClientRect();return {top:r.top+s0,h:r.height}});
  const gap=rs.length>1?Math.max(0,rs[1].top-(rs[0].top+rs[0].h)):12;const H=rs[from].h+gap;
  let to=from,lastY=y0,raf=0;
  item.classList.add('dragging');try{grip.setPointerCapture(e.pointerId)}catch(_){}
  const layout=()=>{
    const dy=(lastY-y0)+(sc.scrollTop-s0);item.style.transform=`translateY(${dy}px)`;
    const c=rs[from].top+rs[from].h/2+dy;to=from;
    for(let i=0;i<rs.length;i++){if(i===from)continue;const mid=rs[i].top+rs[i].h/2;if(i>from&&c>mid)to=i;if(i<from&&c<mid&&to>=from)to=i}
    items.forEach((el,i)=>{if(i===from)return;let off=0;if(from<to&&i>from&&i<=to)off=-H;if(to<from&&i>=to&&i<from)off=H;el.style.transform=off?`translateY(${off}px)`:''});
  };
  const edge=()=>{const r=sc.getBoundingClientRect();let v=0;if(lastY<r.top+70)v=-12;else if(lastY>r.bottom-70)v=12;if(v){sc.scrollTop+=v;layout()}raf=requestAnimationFrame(edge)};
  raf=requestAnimationFrame(edge);
  const move=ev=>{lastY=ev.clientY;layout();ev.preventDefault()};
  const up=()=>{cancelAnimationFrame(raf);grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);
    items.forEach(el=>{el.style.transform='';el.classList.remove('dragging')});
    if(to!==from){syncDraft();const a=kind==='t'?S.draft.topics:S.draft.questions;const fr=+items[from].dataset.ix,tr=+items[to].dataset.ix;const [x]=a.splice(fr,1);a.splice(tr,0,x);paintLessonForm()}};
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
}
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(g&&(e.button===0||e.pointerType!=='mouse')){e.preventDefault();startDrag(e,g)}});
['focusin','select','keyup','mouseup','touchend'].forEach(ev=>document.addEventListener(ev,e=>{const t=ev==='focusin'||ev==='select'?e.target:document.activeElement;fmtTrack(t)},true));
document.addEventListener('selectionchange',()=>fmtTrack(document.activeElement));
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-fmt]');if(b)e.preventDefault()},true);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-fmt]');if(b){e.preventDefault();fmtApply(b.dataset.fmt)}});
document.addEventListener('input',e=>{autoGrow(e.target);if(e.target===FMT.el)fmtTrack(e.target);if(e.target.dataset&&e.target.dataset.input==='meq'&&S.quiz&&S.quiz.ans&&!S.quiz.ans[S.quiz.i].locked){S.quiz.ans[S.quiz.i].text=e.target.value;const cb=document.getElementById('qCheckBtn');if(cb)cb.disabled=!e.target.value.trim()}});
document.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.change;if(!c)return;
  if(c==='qtype'){syncDraft();paintLessonForm()}
  if(c==='qsCustom'){const v=parseFloat(e.target.value);if(v>0){const st=qset();const sec=Math.round(v*60);if(st.timer==='q')st.qSec=sec;else st.setSec=sec;LS.set('qset',st);render()}}
  if(c==='unoStack'){S.uno.stack=e.target.checked;persist()}
  if(c==='scLow'){S.score.low=e.target.checked;persist()}
  if(c==='scGame'){S.score.game=e.target.value.trim();persist()}
  if(c==='pbSetup'){pbSyncSetup();persist()}
  if(c==='f7Target'){const v=parseInt(e.target.value,10);if(v>0){f7().target=v;persist();render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey||e.shiftKey||e.isComposing)return;
  const k={KeyB:'b',KeyI:'i',KeyU:'u'}[e.code];const el=document.activeElement;
  if(!k||!el||el.tagName!=='TEXTAREA'||!$('#fmtPrev')||!$('#sheetCard').contains(el))return;
  e.preventDefault();FMT.el=el;fmtWrap(el,el.selectionStart,el.selectionEnd,k)});

/* footer: when the website itself was last updated (stamped at each release) */
const SITE_UPDATED='2026-10-24T22:13:00+07:00';
(function(){const el=document.getElementById('siteFoot');if(!el)return;const d=new Date(SITE_UPDATED);
  let t;try{t=d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'})+' เวลา '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'})+' น.'}catch(e){t=SITE_UPDATED}
  el.innerHTML='<span>อัปเดตเว็บล่าสุด</span> <time datetime="'+SITE_UPDATED+'">'+t+'</time>'})();
/* hook for future games: House.registerTool({id,name,desc,view:()=>html}) */
window.House={registerTool(def){if(def&&def.id&&typeof def.view==='function'){TOOLS[def.id]={view:def.view,name:def.name,desc:def.desc};render()}},store:Store,kids,act:ACT,render};

render();
Store.init();
})();
</script>
